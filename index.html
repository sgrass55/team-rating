<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Рейтинг команды</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #050c18;
      --bg2: #0c1730;
      --card: rgba(22, 36, 63, 0.92);
      --card2: rgba(14, 27, 49, 0.96);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f5f7ff;
      --muted: #8e9bb7;
      --blue: #37bff5;
      --green: #31d879;
      --gold: #f6c626;
      --silver: #bac4d1;
      --bronze: #cf7b30;
      --danger: #ff6174;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 50% 0%,
          #172959 0%,
          #0b162b 32%,
          #050c18 72%
        );

      background-attachment: fixed;
    }

    body.modal-open {
      overflow: hidden;
    }

    button {
      font: inherit;
    }

    .page {
      min-height: 100vh;
      padding: 24px 16px 60px;
    }

    .container {
      width: min(920px, 100%);
      margin: 0 auto;
    }

    /* =====================================================
       HEADER
       ===================================================== */

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    .title {
      margin: 0;

      font-size: 34px;
      line-height: 1.1;

      font-weight: 850;
      letter-spacing: -1px;
    }

    .subtitle {
      margin-top: 7px;

      font-size: 14px;
      color: var(--muted);
    }

    .current-period {
      margin-top: 12px;

      font-size: 25px;
      font-weight: 850;
    }

    .status {
      min-height: 18px;
      margin-top: 7px;

      font-size: 12px;
      color: var(--muted);
    }

    .status.error {
      color: var(--danger);
    }

    /* =====================================================
       RANKING
       ===================================================== */

    .ranking {
      display: grid;
      gap: 9px;

      margin-top: 16px;
    }

    .rank-card {
      display: grid;

      grid-template-columns:
        44px
        minmax(150px, 1.2fr)
        minmax(220px, 4fr)
        auto;

      align-items: center;

      min-height: 66px;

      padding: 10px 15px;

      border:
        1px solid
        var(--border);

      border-radius: 17px;

      background:
        linear-gradient(
          90deg,
          rgba(30, 45, 74, 0.94),
          rgba(15, 26, 47, 0.92)
        );

      transition:
        transform 0.65s cubic-bezier(.2,.8,.2,1),
        border-color 0.3s ease,
        box-shadow 0.3s ease,
        opacity 0.3s ease;

      will-change: transform;
    }

    .rank-card:hover {
      transform: translateY(-1px);
    }

    .rank-card.first {
      border-color:
        rgba(246, 198, 38, 0.75);
    }

    .rank-card.second {
      border-color:
        rgba(186, 196, 209, 0.55);
    }

    .rank-card.third {
      border-color:
        rgba(207, 123, 48, 0.72);
    }

    .place {
      text-align: center;
      font-size: 20px;
    }

    .person-name {
      min-width: 0;

      overflow: hidden;

      white-space: nowrap;
      text-overflow: ellipsis;

      font-size: 16px;
      font-weight: 780;
    }

    .percent {
      padding-left: 13px;

      white-space: nowrap;

      font-size: 21px;
      line-height: 1;

      font-weight: 850;
      color: var(--blue);
    }

    .percent.green {
      color: var(--green);
    }

    .percent {
      transition:
        color 0.35s ease,
        transform 0.25s ease;
    }

    .percent.value-changed {
      transform: scale(1.08);
    }

    .rank-card.new-card {
      animation: cardAppear 0.45s ease both;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* =====================================================
       CLICKABLE SCALE
       ===================================================== */

    .bar-wrap {
      position: relative;

      padding: 12px 7px;

      cursor: pointer;

      border-radius: 12px;

      outline: none;
    }

    .bar-wrap:hover {
      background:
        rgba(255, 255, 255, 0.035);
    }

    .bar-wrap:focus-visible {
      box-shadow:
        0 0 0 2px
        rgba(55, 191, 245, 0.5);
    }

    .bar {
      position: relative;

      height: 12px;

      overflow: hidden;

      border-radius: 999px;

      background:
        rgba(255, 255, 255, 0.08);
    }

    /*
      Вертикальные деления каждые 5%.
    */

    .bar::after {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      background:
        repeating-linear-gradient(
          to right,
          transparent 0,
          transparent calc(5% - 1px),
          rgba(255, 255, 255, 0.18)
            calc(5% - 1px),
          rgba(255, 255, 255, 0.18)
            5%
        );
    }

    .bar-fill {
      position: absolute;

      left: 0;
      top: 0;
      bottom: 0;

      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          #37bff5,
          #31d879
        );

      transition:
        width 0.65s cubic-bezier(.2,.8,.2,1);
    }

    .bar-hint {
      position: absolute;

      left: 50%;
      bottom: -1px;

      transform: translateX(-50%);

      opacity: 0;

      pointer-events: none;

      white-space: nowrap;

      font-size: 9px;
      color: var(--muted);

      transition:
        opacity 0.15s ease;
    }

    .bar-wrap:hover .bar-hint {
      opacity: 1;
    }

    /* =====================================================
       ARCHIVE LINK
       ===================================================== */

    .archive-link-wrap {
      display: flex;
      justify-content: center;

      margin-top: 22px;
    }

    .archive-link {
      appearance: none;

      border: 0;
      padding: 6px 12px;

      color: #cbd7ed;

      background: transparent;

      cursor: pointer;

      font-size: 14px;
      font-weight: 700;

      text-decoration: underline;
      text-decoration-color:
        rgba(203, 215, 237, 0.45);
      text-underline-offset: 4px;
    }

    .archive-link:hover {
      color: #ffffff;
    }

    /* =====================================================
       MODALS
       ===================================================== */

    .modal {
      display: none;

      position: fixed;
      inset: 0;

      z-index: 1000;

      padding: 18px;

      background:
        rgba(2, 8, 18, 0.76);

      backdrop-filter:
        blur(10px);
      -webkit-backdrop-filter:
        blur(10px);
    }

    .modal.visible {
      display: flex;

      align-items: center;
      justify-content: center;
    }

    .modal-card {
      width: min(960px, 100%);
      max-height: calc(100vh - 36px);

      overflow-y: auto;

      border:
        1px solid
        rgba(255, 255, 255, 0.13);

      border-radius: 22px;

      background:
        linear-gradient(
          180deg,
          rgba(17, 31, 57, 0.99),
          rgba(8, 18, 34, 0.99)
        );

      box-shadow:
        0 30px 100px
        rgba(0, 0, 0, 0.42);
    }

    .modal-head {
      position: sticky;
      top: 0;

      z-index: 3;

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 14px;

      padding: 17px 18px;

      border-bottom:
        1px solid
        rgba(255, 255, 255, 0.08);

      background:
        rgba(12, 25, 46, 0.96);

      backdrop-filter:
        blur(12px);
      -webkit-backdrop-filter:
        blur(12px);
    }

    .modal-title {
      min-width: 0;

      margin: 0;

      overflow: hidden;

      white-space: nowrap;
      text-overflow: ellipsis;

      font-size: 21px;
      font-weight: 850;
    }

    .close-btn {
      flex: 0 0 auto;

      width: 36px;
      height: 36px;

      border:
        1px solid
        rgba(255, 255, 255, 0.11);

      border-radius: 50%;

      color: var(--text);

      background:
        rgba(255, 255, 255, 0.06);

      cursor: pointer;

      font-size: 20px;
      line-height: 1;
    }

    .close-btn:hover {
      background:
        rgba(255, 255, 255, 0.11);
    }

    .modal-body {
      padding: 18px;
    }

    .section-title {
      margin:
        0
        0
        12px;

      font-size: 18px;
      font-weight: 820;
    }

    .subtle {
      color: var(--muted);
      font-size: 12px;
    }

    .panel {
      padding: 15px;

      border:
        1px solid
        rgba(255, 255, 255, 0.09);

      border-radius: 17px;

      background:
        rgba(255, 255, 255, 0.035);
    }

    .panel + .panel {
      margin-top: 15px;
    }

    /* =====================================================
       ARCHIVE
       ===================================================== */

    .archive-years,
    .archive-months {
      display: flex;
      flex-wrap: wrap;

      gap: 7px;
    }

    .archive-months {
      margin-top: 10px;
    }

    .period-button {
      appearance: none;

      padding: 9px 13px;

      border:
        1px solid
        rgba(255, 255, 255, 0.12);

      border-radius: 11px;

      color: var(--text);

      background:
        rgba(255, 255, 255, 0.06);

      cursor: pointer;
    }

    .period-button:hover {
      background:
        rgba(255, 255, 255, 0.1);
    }

    .period-button.active {
      border-color:
        var(--blue);

      background:
        rgba(55, 191, 245, 0.16);
    }

    .archive-ranking {
      display: grid;
      gap: 9px;

      margin-top: 16px;
    }

    .archive-placeholder {
      padding: 32px 15px;

      text-align: center;
      color: var(--muted);
    }

    /* =====================================================
       HISTORY
       ===================================================== */

    .history-list {
      display: grid;
      gap: 7px;
    }

    .history-row {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 14px;

      padding: 9px 11px;

      border-radius: 11px;

      background:
        rgba(255, 255, 255, 0.05);
    }

    .history-period {
      color: #dbe4f7;
    }

    .history-percent {
      font-weight: 850;
      color: var(--blue);
    }

    .history-percent.green {
      color: var(--green);
    }

    /* =====================================================
       COMPARISON
       ===================================================== */

    .compare-options {
      display: flex;
      flex-wrap: wrap;

      gap: 8px;

      margin-bottom: 14px;
    }

    .compare-option {
      display: flex;
      align-items: center;

      gap: 7px;

      padding: 8px 10px;

      border-radius: 10px;

      background:
        rgba(255, 255, 255, 0.05);

      cursor: pointer;
    }

    .chart-wrap {
      overflow-x: auto;
    }

    #compareChart {
      min-width: 760px;
    }

    /* =====================================================
       LOADER / EMPTY
       ===================================================== */

    .loader {
      width: 32px;
      height: 32px;

      margin: 35px auto;

      border:
        3px solid
        rgba(255, 255, 255, 0.14);

      border-top-color:
        var(--blue);

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .empty {
      padding: 28px 14px;

      text-align: center;
      color: var(--muted);
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 700px) {

      .page {
        padding:
          17px
          10px
          40px;
      }

      .title {
        font-size: 28px;
      }

      .current-period {
        font-size: 21px;
      }

      .rank-card {
        grid-template-columns:
          34px
          1fr
          auto;

        grid-template-areas:
          "place name percent"
          ". bar bar";

        gap: 4px 8px;

        padding:
          9px
          11px
          5px;
      }

      .place {
        grid-area: place;
      }

      .person-name {
        grid-area: name;
      }

      .percent {
        grid-area: percent;

        padding-left: 4px;

        font-size: 18px;
      }

      .bar-wrap {
        grid-area: bar;

        padding:
          10px
          0
          12px;
      }

      .modal {
        padding: 8px;
      }

      .modal-card {
        max-height:
          calc(100vh - 16px);

        border-radius: 17px;
      }

      .modal-head {
        padding: 13px 14px;
      }

      .modal-body {
        padding: 13px;
      }

      .modal-title {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="container">

      <header class="header">

        <div class="subtitle">
          Текущий месяц
        </div>

        <div
          class="current-period"
          id="currentPeriod">
          —
        </div>

        <div
          class="status"
          id="status">
        </div>

      </header>


      <!--
        На главной странице теперь
        ТОЛЬКО текущий месяц.
      -->

      <section
        class="ranking"
        id="ranking">
      </section>


      <!--
        История и сравнение убраны
        с главной страницы.

        Остаётся только ссылка Архив.
      -->

      <div class="archive-link-wrap">

        <button
          class="archive-link"
          id="archiveBtn"
          type="button">
          Архив
        </button>

      </div>

    </div>

  </main>


  <!-- =====================================================
       ARCHIVE MODAL
       ===================================================== -->

  <div
    class="modal"
    id="archiveModal"
    aria-hidden="true">

    <div
      class="modal-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="archiveTitle">

      <div class="modal-head">

        <h2
          class="modal-title"
          id="archiveTitle">
          Архив
        </h2>

        <button
          class="close-btn"
          id="archiveClose"
          type="button"
          aria-label="Закрыть">
          ×
        </button>

      </div>


      <div class="modal-body">

        <div class="panel">

          <div class="section-title">
            Выберите месяц
          </div>

          <div
            class="archive-years"
            id="archiveYears">
          </div>

          <div
            class="archive-months"
            id="archiveMonths">
          </div>

        </div>


        <!--
          Рейтинг архивного месяца
          НЕ загружается заранее.

          Он появится только после
          клика по конкретному месяцу.
        -->

        <div
          class="archive-ranking"
          id="archiveRanking">

          <div class="archive-placeholder">
            Выберите архивный месяц
          </div>

        </div>

      </div>

    </div>

  </div>


  <!-- =====================================================
       PERSON DETAILS MODAL

       Открывается кликом по шкале
       конкретного участника.

       Здесь одновременно:
       1. История участника
       2. Сравнение
       ===================================================== -->

  <div
    class="modal"
    id="personModal"
    aria-hidden="true">

    <div
      class="modal-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="personModalTitle">

      <div class="modal-head">

        <h2
          class="modal-title"
          id="personModalTitle">
          Статистика участника
        </h2>

        <button
          class="close-btn"
          id="personClose"
          type="button"
          aria-label="Закрыть">
          ×
        </button>

      </div>


      <div class="modal-body">

        <div class="panel">

          <h3 class="section-title">
            История статистики
          </h3>

          <div
            class="history-list"
            id="historyList">
          </div>

        </div>


        <div class="panel">

          <h3 class="section-title">
            Сравнение участников
          </h3>

          <div
            class="compare-options"
            id="compareOptions">
          </div>

          <div class="chart-wrap">

            <svg
              id="compareChart"
              width="100%"
              height="370"
              viewBox="0 0 900 370"
              preserveAspectRatio="none">
            </svg>

          </div>

        </div>

      </div>

    </div>

  </div>


  <script>

    /* =====================================================
       API
       ===================================================== */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbwYcG1OIZ_y2E3OZQw8oH0IuDMyk06lxL41oM6K1TtXN0Noxa5bV7kC_hsWOXTsTde_IA/exec";


    const MONTH_KEYS = [
      "ЯНВАРЬ",
      "ФЕВРАЛЬ",
      "МАРТ",
      "АПРЕЛЬ",
      "МАЙ",
      "ИЮНЬ",
      "ИЮЛЬ",
      "АВГУСТ",
      "СЕНТЯБРЬ",
      "ОКТЯБРЬ",
      "НОЯБРЬ",
      "ДЕКАБРЬ"
    ];


    const MONTH_NAMES = [
      "Январь",
      "Февраль",
      "Март",
      "Апрель",
      "Май",
      "Июнь",
      "Июль",
      "Август",
      "Сентябрь",
      "Октябрь",
      "Ноябрь",
      "Декабрь"
    ];


    /* =====================================================
       STATE
       ===================================================== */

    const state = {

      currentPeriod:
        null,

      currentPeople:
        [],

      archivePeriods:
        null,

      archiveSelectedYear:
        null,

      archiveSelectedPeriod:
        null,

      /*
        Архивные рейтинги кешируем
        только ПОСЛЕ первого клика.
      */

      archiveRankingCache:
        new Map(),

      /*
        История + сравнение тоже
        НЕ грузятся при открытии сайта.

        Загружаются только после
        клика по шкале участника.
      */

      historyData:
        null,

      historyLoading:
        null,

      selectedPerson:
        null,

      selectedComparePeople:
        new Set(),

      currentMonthLoading:
        false
    };


    /* =====================================================
       DOM
       ===================================================== */

    const rankingEl =
      document.getElementById(
        "ranking"
      );

    const currentPeriodEl =
      document.getElementById(
        "currentPeriod"
      );

    const statusEl =
      document.getElementById(
        "status"
      );

    const archiveBtn =
      document.getElementById(
        "archiveBtn"
      );

    const archiveModal =
      document.getElementById(
        "archiveModal"
      );

    const archiveClose =
      document.getElementById(
        "archiveClose"
      );

    const archiveYearsEl =
      document.getElementById(
        "archiveYears"
      );

    const archiveMonthsEl =
      document.getElementById(
        "archiveMonths"
      );

    const archiveRankingEl =
      document.getElementById(
        "archiveRanking"
      );

    const personModal =
      document.getElementById(
        "personModal"
      );

    const personClose =
      document.getElementById(
        "personClose"
      );

    const personModalTitle =
      document.getElementById(
        "personModalTitle"
      );

    const historyListEl =
      document.getElementById(
        "historyList"
      );

    const compareOptionsEl =
      document.getElementById(
        "compareOptions"
      );

    const compareChartEl =
      document.getElementById(
        "compareChart"
      );


    /* =====================================================
       FETCH
       ===================================================== */

    async function api(params) {

      const url =
        new URL(
          API_URL
        );


      Object
        .entries(params)
        .forEach(
          ([key, value]) => {

            url.searchParams.set(
              key,
              value
            );
          }
        );


      /*
        Не используем браузерный кеш.
      */

      url.searchParams.set(
        "_",
        Date.now()
      );


      const response =
        await fetch(
          url.toString(),
          {
            cache:
              "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );
      }


      const data =
        await response.json();


      if (
        data &&
        data.ok === false
      ) {

        throw new Error(
          data.error ||
          "Ошибка API"
        );
      }


      return data;
    }


    /* =====================================================
       CURRENT MONTH
       ===================================================== */

    function getCurrentPeriod() {

      const now =
        new Date();


      const month =
        now.getMonth();


      const year =
        now.getFullYear();


      return {
        key:
          MONTH_KEYS[month] +
          year,

        month:
          month + 1,

        year:
          year,

        label:
          MONTH_NAMES[month] +
          " " +
          year
      };
    }


    async function loadCurrentMonth(
      silent = false
    ) {

      if (state.currentMonthLoading) {
        return;
      }

      state.currentMonthLoading = true;

      const period =
        getCurrentPeriod();

      const monthChanged =
        state.currentPeriod &&
        state.currentPeriod.key !== period.key;

      if (monthChanged) {
        state.archivePeriods = null;
        state.archiveSelectedYear = null;
        state.archiveSelectedPeriod = null;
        state.archiveRankingCache.clear();
        state.historyData = null;
        state.historyLoading = null;
        state.currentPeople = [];
        rankingEl.innerHTML = "";
      }

      state.currentPeriod = period;
      currentPeriodEl.textContent = period.label;

      if (!silent && !rankingEl.children.length) {
        showRankingLoader(rankingEl);
      }

      setStatus("");

      try {

        /*
          fresh=1 предназначен для текущего месяца.
          После небольшого изменения Code.gs он
          заставит сервер отдавать свежие данные,
          не используя 20-секундный live-cache.
        */
        const data = await api({
          mode: "month",
          period: period.key,
          fresh: "1"
        });

        const actualPeriod = getCurrentPeriod();

        if (actualPeriod.key !== period.key) {
          return;
        }

        const people = sanitizePeople(
          getRankingArray(data)
        );

        if (!rankingEl.querySelector(".rank-card")) {
          renderRanking(
            rankingEl,
            people,
            { clickableScale: true }
          );
        } else {
          updateLiveRanking(people);
        }

        state.currentPeople = people;
        setStatus("");

      } catch (error) {

        console.error(
          "Ошибка обновления текущего месяца:",
          error
        );

        if (!state.currentPeople.length) {
          setStatus(
            "Ошибка загрузки данных",
            true
          );

          showEmpty(
            rankingEl,
            "Не удалось получить данные текущего месяца"
          );
        }

      } finally {
        state.currentMonthLoading = false;
      }
    }


    /* =====================================================
       LIVE RANKING UPDATE

       Не удаляем карточки при каждом обновлении.
       Меняем существующие элементы и используем
       FLIP-анимацию для перемещения по рейтингу.
       ===================================================== */

    function updateLiveRanking(people) {

      if (!Array.isArray(people) || !people.length) {
        return;
      }

      const existingCards = new Map();
      const firstPositions = new Map();

      Array.from(
        rankingEl.querySelectorAll(".rank-card")
      ).forEach(card => {

        const name =
          card.dataset.personName || "";

        if (!name) {
          return;
        }

        existingCards.set(name, card);
        firstPositions.set(
          name,
          card.getBoundingClientRect()
        );
      });

      const incomingNames =
        new Set(
          people.map(person => person.name)
        );

      existingCards.forEach(
        (card, name) => {
          if (!incomingNames.has(name)) {
            card.remove();
          }
        }
      );

      people.forEach(
        (person, index) => {

          let card =
            existingCards.get(person.name);

          if (!card) {
            card = createRankingCard(
              person,
              index,
              true
            );

            card.classList.add("new-card");
            rankingEl.appendChild(card);
          } else {
            updateRankingCard(
              card,
              person,
              index
            );
          }

          rankingEl.appendChild(card);
        }
      );

      /*
        После перестановки измеряем новые позиции
        и визуально стартуем со старой позиции.
      */
      const movements = [];

      Array.from(
        rankingEl.querySelectorAll(".rank-card")
      ).forEach(card => {

        const name =
          card.dataset.personName || "";

        const first =
          firstPositions.get(name);

        if (!first) {
          return;
        }

        const last =
          card.getBoundingClientRect();

        const deltaY =
          first.top - last.top;

        if (Math.abs(deltaY) < 1) {
          return;
        }

        card.style.transition = "none";
        card.style.transform =
          `translateY(${deltaY}px)`;

        movements.push(card);
      });

      if (!movements.length) {
        return;
      }

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {

          movements.forEach(card => {
            card.style.transition =
              "transform 0.65s cubic-bezier(.2,.8,.2,1), border-color .3s ease, box-shadow .3s ease, opacity .3s ease";

            card.style.transform = "";
          });
        });
      });
    }


    function createRankingCard(
      person,
      index,
      clickableScale = true
    ) {

      const card =
        document.createElement("article");

      card.className = "rank-card";
      card.dataset.personName = person.name;
      card.dataset.percent = String(
        clampPercent(person.percent)
      );

      card.innerHTML = `
        <div class="place"></div>

        <div
          class="person-name"
          title="${escapeHtml(person.name)}">
          ${escapeHtml(person.name)}
        </div>

        <div
          class="bar-wrap"
          ${clickableScale ? 'tabindex="0" role="button"' : ""}>

          <div class="bar">
            <div class="bar-fill"></div>
          </div>

          ${
            clickableScale
              ? '<span class="bar-hint">нажмите для истории</span>'
              : ""
          }
        </div>

        <div class="percent"></div>
      `;

      if (clickableScale) {
        const scale =
          card.querySelector(".bar-wrap");

        const activate = () => {
          openPersonDetails(person.name);
        };

        scale.addEventListener("click", activate);

        scale.addEventListener(
          "keydown",
          event => {

              event.key === "Enter" ||
              event.key === " "
            ) {
              event.preventDefault();
              activate();
            }
          }
        );
      }

      updateRankingCard(
        card,
        person,
        index,
        true
      );

      return card;
    }


    function updateRankingCard(
      card,
      person,
      index,
      immediate = false
    ) {

      const newPercent =
        clampPercent(person.percent);

      const oldPercent =
        Number(card.dataset.percent);

      card.dataset.personName = person.name;

      card.classList.toggle("first", index === 0);
      card.classList.toggle("second", index === 1);
      card.classList.toggle("third", index === 2);

      const placeEl =
        card.querySelector(".place");

      const nameEl =
        card.querySelector(".person-name");

      const fillEl =
        card.querySelector(".bar-fill");

      const percentEl =
        card.querySelector(".percent");

      if (placeEl) {
        placeEl.textContent =
          getPlaceIcon(index);
      }

      if (nameEl) {
        nameEl.textContent = person.name;
        nameEl.title = person.name;
      }

      if (
        immediate ||
        !Number.isFinite(oldPercent)
      ) {
        if (fillEl) {
          fillEl.style.width =
            newPercent + "%";
        }

        if (percentEl) {
          percentEl.textContent =
            formatPercent(newPercent);
        }

        card.dataset.percent =
          String(newPercent);

      } else if (
        Math.abs(oldPercent - newPercent) > 0.0001
      ) {

        if (fillEl) {
          fillEl.style.width =
            newPercent + "%";
        }

        animatePercentValue(
          percentEl,
          oldPercent,
          newPercent,
          650
        );

        if (percentEl) {
          percentEl.classList.add(
            "value-changed"
          );

          setTimeout(
            () => {
              percentEl.classList.remove(
                "value-changed"
              );
            },
            260
          );
        }

        card.dataset.percent =
          String(newPercent);
      }

      if (percentEl) {
        percentEl.classList.toggle(
          "green",
          newPercent >= 90
        );
      }
    }


    function animatePercentValue(
      element,
      from,
      to,
      duration = 650
    ) {

      if (!element) {
        return;
      }

      const animationId =
        String(Date.now()) + Math.random();

      element.dataset.animationId =
        animationId;

      const start =
        performance.now();

      function frame(now) {

        if (
          element.dataset.animationId !==
          animationId
        ) {
          return;
        }

        const progress =
          Math.min(
            1,
            (now - start) / duration
          );

        const eased =
          1 - Math.pow(1 - progress, 3);

        const value =
          from +
          (to - from) * eased;

        element.textContent =
          formatPercent(value);

        if (progress < 1) {
          requestAnimationFrame(frame);
        } else {
          element.textContent =
            formatPercent(to);
        }
      }

      requestAnimationFrame(frame);
    }

    async function loadArchiveMonth(
      period
    ) {

      showRankingLoader(
        archiveRankingEl
      );


      /*
        Если пользователь уже открывал
        этот месяц, используем
        клиентский кеш.
      */

      if (
        state.archiveRankingCache
          .has(period.key)
      ) {

        const cached =
          state.archiveRankingCache
            .get(period.key);


        renderArchiveMonthResult(
          period,
          cached
        );

        return;
      }


      try {

        const data =
          await api({
            mode:
              "month",

            period:
              period.key
          });


        const people =
          sanitizePeople(
            getRankingArray(
              data
            )
          );


        state.archiveRankingCache
          .set(
            period.key,
            people
          );


        renderArchiveMonthResult(
          period,
          people
        );


      } catch (error) {

        console.error(
          error
        );


        showEmpty(
          archiveRankingEl,
          "Не удалось загрузить этот месяц"
        );
      }
    }

    async function ensureHistoryData() {

      if (
        state.historyData
      ) {
        return;
      }


      /*
        Защита от нескольких
        одновременных запросов.
      */

      if (
        state.historyLoading
      ) {

        return state.historyLoading;
      }


      state.historyLoading =
        (async () => {

          const data =
            await api({
              mode:
                "all"
            });


          state.historyData =
            normalizeHistoryData(
              data
            );

        })();


      try {

        await state.historyLoading;

      } finally {

        state.historyLoading =
          null;
      }
    }


    /* =====================================================
       HISTORY
       ===================================================== */

    function normalizeHistoryData(
      data
    ) {

      const result = {
        people: {},
        periods: []
      };


      const periodMap =
        new Map();


      /*
        Новый формат Code.gs:

        people: [
          {
            name,
            history:[...]
          }
        ]
      */

      if (
        Array.isArray(
          data.people
        )
      ) {

        data.people.forEach(
          person => {

            const name =
              String(
                person.name || ""
              ).trim();


            if (!name) {
              return;
            }


            const rows =
              normalizeHistoryRows(
                person.history
              );


            result.people[name] =
              rows;


            rows.forEach(
              row => {

                periodMap.set(
                  row.period,
                  {
                    key:
                      row.period,

                    year:
                      row.year,

                    month:
                      row.month,

                    sort:
                      row.sort
                  }
                );
              }
            );
          }
        );
      }


      /*
        Совместимость со старым
        форматом объекта.
      */

      else if (
        data.people &&
        typeof data.people ===
          "object"
      ) {

        Object
          .entries(
            data.people
          )
          .forEach(
            ([name, rows]) => {

              const normalized =
                normalizeHistoryRows(
                  rows
                );


              result.people[name] =
                normalized;


              normalized.forEach(
                row => {

                  periodMap.set(
                    row.period,
                    {
                      key:
                        row.period,

                      year:
                        row.year,

                      month:
                        row.month,

                      sort:
                        row.sort
                    }
                  );
                }
              );
            }
          );
      }


      result.periods =
        [
          ...periodMap.values()
        ]
          .sort(
            (a, b) =>
              a.sort -
              b.sort
          );


      return result;
    }


    function normalizeHistoryRows(
      rows
    ) {

      if (
        !Array.isArray(
          rows
        )
      ) {
        return [];
      }


      return rows
        .map(
          row => {

            const year =
              Number(
                row.year
              );


            const month =
              Number(
                row.month
              );


            const percent =
              Number(
                row.percent
              );


            return {
              period:
                String(
                  row.period || ""
                ),

              year:
                year,

              month:
                month,

              sort:
                Number(
                  row.sort ||
                  (
                    year *
                    100 +
                    month
                  )
                ),

              percent:
                percent,

              label:
                row.label ||
                (
                  MONTH_NAMES[
                    month - 1
                  ] +
                  " " +
                  year
                )
            };
          }
        )
        .filter(
          row =>
            row.period &&
            Number.isFinite(
              row.year
            ) &&
            Number.isFinite(
              row.month
            ) &&
            isSafePercent(
              row.percent
            )
        )
        .sort(
          (a, b) =>
            a.sort -
            b.sort
        );
    }

    function renderCompareOptions() {

    function renderCompareChart() {

      const svg =
        compareChartEl;


      svg.innerHTML =
        "";


      if (
        !state.historyData
      ) {
        return;
      }


      const selected =
        [
          ...state.selectedComparePeople
        ];


      if (
        selected.length === 0
      ) {

        addSvgText(
          svg,
          450,
          185,
          "Выберите участников для сравнения",
          "#8e9bb7",
          "middle",
          15
        );

        return;
      }


      const periods =
        Array.isArray(
          state.historyData.periods
        )
          ? state.historyData.periods
          : [];


      if (
        periods.length === 0
      ) {
        return;
      }


      const width =
        900;

      const height =
        370;

      const left =
        55;

      const right =
        22;

      const top =
        35;

      const bottom =
        55;

      const chartWidth =
        width -
        left -
        right;

      const chartHeight =
        height -
        top -
        bottom;


      const minY =
        70;

      const maxY =
        100;


      /*
        Y-шкала каждые 5%.
      */

      for (
        let value = 70;
        value <= 100;
        value += 5
      ) {

        const y =
          top +
          chartHeight *
          (
            1 -
            (
              value -
              minY
            ) /
            (
              maxY -
              minY
            )
          );


        addSvgLine(
          svg,
          left,
          y,
          width - right,
          y,
          "rgba(255,255,255,.09)"
        );


        addSvgText(
          svg,
          46,
          y + 4,
          value + "%",
          "#8e9bb7",
          "end",
          11
        );
      }


      periods.forEach(
        (period, index) => {

          if (
            periods.length > 14 &&
            index % 2 !== 0 &&
            index !==
              periods.length - 1
          ) {
            return;
          }


          const x =
            getChartX(
              index,
              periods.length,
              left,
              chartWidth
            );


          const label =
            MONTH_NAMES[
              period.month - 1
            ].slice(0, 3)
            +
            " "
            +
            String(
              period.year
            ).slice(-2);


          addSvgText(
            svg,
            x,
            height - 18,
            label,
            "#8e9bb7",
            "middle",
            10
          );
        }
      );


      selected.forEach(
        (name, seriesIndex) => {

          const rows =
            state.historyData.people[
              name
            ] || [];


          const map =
            new Map();


          rows.forEach(
            row => {

              if (
                isSafePercent(
                  row.percent
                )
              ) {

                map.set(
                  row.period,
                  Number(
                    row.percent
                  )
                );
              }
            }
          );


          const hue =
            (
              seriesIndex *
              71 +
              188
            ) %
            360;


          const color =
            `hsl(${hue} 75% 62%)`;


          let path =
            "";

          let started =
            false;


          periods.forEach(
            (period, index) => {

              const value =
                map.get(
                  period.key
                );


              if (
                value === undefined
              ) {

                started =
                  false;

                return;
              }


              const x =
                getChartX(
                  index,
                  periods.length,
                  left,
                  chartWidth
                );


              const clamped =
                Math.max(
                  minY,
                  Math.min(
                    maxY,
                    value
                  )
                );


              const y =
                top +
                chartHeight *
                (
                  1 -
                  (
                    clamped -
                    minY
                  ) /
                  (
                    maxY -
                    minY
                  )
                );


              if (!started) {

                path +=
                  `M ${x} ${y} `;

                started =
                  true;

              } else {

                path +=
                  `L ${x} ${y} `;
              }


              const circle =
                document.createElementNS(
                  "http://www.w3.org/2000/svg",
                  "circle"
                );


              circle.setAttribute(
                "cx",
                x
              );

              circle.setAttribute(
                "cy",
                y
              );

              circle.setAttribute(
                "r",
                "3.5"
              );

              circle.setAttribute(
                "fill",
                color
              );


              svg.appendChild(
                circle
              );
            }
          );


          const pathEl =
            document.createElementNS(
              "http://www.w3.org/2000/svg",
              "path"
            );


          pathEl.setAttribute(
            "d",
            path
          );

          pathEl.setAttribute(
            "fill",
            "none"
          );

          pathEl.setAttribute(
            "stroke",
            color
          );

          pathEl.setAttribute(
            "stroke-width",
            "2.5"
          );

          pathEl.setAttribute(
            "stroke-linecap",
            "round"
          );

          pathEl.setAttribute(
            "stroke-linejoin",
            "round"
          );


          svg.appendChild(
            pathEl
          );


          addSvgText(
            svg,
            left + 8,
            18 +
            seriesIndex * 16,
            name,
            color,
            "start",
            10
          );
        }
      );
    }


    /* =====================================================
       GENERIC RANKING RENDERER
       ===================================================== */

    function getRankingArray(
      data
    ) {

      if (
        Array.isArray(
          data.people
        )
      ) {
        return data.people;
      }


      if (
        Array.isArray(
          data.ranking
        )
      ) {
        return data.ranking;
      }


      return [];
    }


    function sanitizePeople(
      people
    ) {

      if (
        !Array.isArray(
          people
        )
      ) {
        return [];
      }


      return people
        .map(
          item => ({
            name:
              String(
                item.name || ""
              ).trim(),

            percent:
              Number(
                item.percent
              )
          })
        )
        .filter(
          item =>
            item.name &&
            isSafePercent(
              item.percent
            )
        )
        .sort(
          (a, b) =>
            b.percent -
            a.percent
        );
    }


    function renderRanking(
      target,
      people,
      options = {}
    ) {

      target.innerHTML = "";

      if (!people.length) {
        showEmpty(
          target,
          "За этот месяц статистика не найдена"
        );
        return;
      }

      people.forEach(
        (person, index) => {

          const card =
            createRankingCard(
              person,
              index,
              Boolean(options.clickableScale)
            );

          target.appendChild(card);
        }
      );
    }


    /* =====================================================
       PERIOD NORMALIZATION
       ===================================================== */

    function normalizePeriodObject(
      item
    ) {

      if (!item) {
        return null;
      }


      const year =
        Number(
          item.year
        );


      const month =
        Number(
          item.month
        );


      if (
        !item.key ||
        !Number.isFinite(
          year
        ) ||
        !Number.isFinite(
          month
        ) ||
        month < 1 ||
        month > 12
      ) {
        return null;
      }


      return {
        key:
          String(
            item.key
          ),

        year:
          year,

        month:
          month,

        sort:
          Number(
            item.sort ||
            (
              year *
              100 +
              month
            )
          ),

        label:
          item.label ||
          (
            MONTH_NAMES[
              month - 1
            ] +
            " " +
            year
          )
      };
    }


    /* =====================================================
       MODAL HELPERS
       ===================================================== */

    function openModal(
      modal
    ) {

      modal.classList.add(
        "visible"
      );


      modal.setAttribute(
        "aria-hidden",
        "false"
      );


      document.body
        .classList
        .add(
          "modal-open"
        );
    }


    function closeModal(
      modal
    ) {

      modal.classList.remove(
        "visible"
      );


      modal.setAttribute(
        "aria-hidden",
        "true"
      );


      if (
        !document.querySelector(
          ".modal.visible"
        )
      ) {

        document.body
          .classList
          .remove(
            "modal-open"
          );
      }
    }


    archiveClose.addEventListener(
      "click",
      () => {

        closeModal(
          archiveModal
        );
      }
    );


    personClose.addEventListener(
      "click",
      () => {

        closeModal(
          personModal
        );
      }
    );


    archiveModal.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          archiveModal
        ) {

          closeModal(
            archiveModal
          );
        }
      }
    );


    personModal.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          personModal
        ) {

          closeModal(
            personModal
          );
        }
      }
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key !==
          "Escape"
        ) {
          return;
        }


        if (
          personModal
            .classList
            .contains(
              "visible"
            )
        ) {

          closeModal(
            personModal
          );

          return;
        }


        if (
          archiveModal
            .classList
            .contains(
              "visible"
            )
        ) {

          closeModal(
            archiveModal
          );
        }
      }
    );


    /* =====================================================
       SVG HELPERS
       ===================================================== */

    function getChartX(
      index,
      count,
      left,
      width
    ) {

      if (
        count <= 1
      ) {

        return (
          left +
          width / 2
        );
      }


      return (
        left +
        width *
        index /
        (
          count - 1
        )
      );
    }


    function addSvgLine(
      svg,
      x1,
      y1,
      x2,
      y2,
      stroke
    ) {

      const line =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "line"
        );


      line.setAttribute(
        "x1",
        x1
      );

      line.setAttribute(
        "y1",
        y1
      );

      line.setAttribute(
        "x2",
        x2
      );

      line.setAttribute(
        "y2",
        y2
      );

      line.setAttribute(
        "stroke",
        stroke
      );

      line.setAttribute(
        "stroke-width",
        "1"
      );


      svg.appendChild(
        line
      );
    }


    function addSvgText(
      svg,
      x,
      y,
      text,
      fill,
      anchor,
      size
    ) {

      const element =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "text"
        );


      element.setAttribute(
        "x",
        x
      );

      element.setAttribute(
        "y",
        y
      );

      element.setAttribute(
        "fill",
        fill
      );

      element.setAttribute(
        "text-anchor",
        anchor
      );

      element.setAttribute(
        "font-size",
        size
      );


      element.textContent =
        text;


      svg.appendChild(
        element
      );
    }


    /* =====================================================
       UI HELPERS
       ===================================================== */

    function getPlaceIcon(
      index
    ) {

      if (index === 0) {
        return "🥇";
      }

      if (index === 1) {
        return "🥈";
      }

      if (index === 2) {
        return "🥉";
      }


      return String(
        index + 1
      );
    }


    function showRankingLoader(
      target
    ) {

      target.innerHTML =
        '<div class="loader"></div>';
    }


    function showEmpty(
      target,
      text
    ) {

      target.innerHTML =
        `<div class="empty">${escapeHtml(text)}</div>`;
    }


    function setStatus(
      text,
      error = false
    ) {

      statusEl.textContent =
        text || "";


      statusEl
        .classList
        .toggle(
          "error",
          Boolean(error)
        );
    }


    function isSafePercent(
      value
    ) {

      const number =
        Number(
          value
        );


      return (
        Number.isFinite(
          number
        ) &&
        number >= 0 &&
        number <= 100
      );
    }


    function clampPercent(
      value
    ) {

      const number =
        Number(
          value
        );


      if (
        !Number.isFinite(
          number
        )
      ) {
        return 0;
      }


      return Math.max(
        0,
        Math.min(
          100,
          number
        )
      );
    }


    function formatPercent(
      value
    ) {

      const number =
        Number(
          value
        );


      if (
        !isSafePercent(
          number
        )
      ) {
        return "—";
      }


      return (
        number
          .toFixed(1)
          .replace(
            ".",
            ","
          )
        +
        "%"
      );
    }


    function escapeHtml(
      value
    ) {

      return String(
        value || ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }


    /* =====================================================
       AUTO REFRESH

       Только главная страница.
       Каждые 2 секунды.
       Архив и история сюда не входят.
       ===================================================== */

    let lastKnownPeriodKey =
      getCurrentPeriod().key;

    setInterval(
      () => {

        if (document.hidden) {
          return;
        }

        if (state.currentMonthLoading) {
          return;
        }

        const actualPeriod =
          getCurrentPeriod();

        if (
          actualPeriod.key !==
          lastKnownPeriodKey
        ) {
          lastKnownPeriodKey =
            actualPeriod.key;

          state.archivePeriods = null;
          state.archiveSelectedYear = null;
          state.archiveSelectedPeriod = null;
          state.archiveRankingCache.clear();
          state.historyData = null;
          state.historyLoading = null;
        }

        loadCurrentMonth(true);
      },
      2000
    );


    document.addEventListener(
      "visibilitychange",
      () => {
        if (!document.hidden) {
          loadCurrentMonth(true);
        }
      }
    );


    /* =====================================================
       START
       ===================================================== */

    loadCurrentMonth();

  </script>
