    /* =====================================================
       PERIOD NORMALIZATION
       ===================================================== */

    function normalizePeriodObject(
      item
    ) {

      if (!item) {
        return null;
      }


      const year =
        Number(
          item.year
        );


      const month =
        Number(
          item.month
        );


      if (
        !item.key ||
        !Number.isFinite(
          year
        ) ||
        !Number.isFinite(
          month
        ) ||
        month < 1 ||
        month > 12
      ) {
        return null;
      }


      return {
        key:
          String(
            item.key
          ),

        year:
          year,

        month:
          month,

        sort:
          Number(
            item.sort ||
            (
              year *
              100 +
              month
            )
          ),

        label:
          item.label ||
          (
            MONTH_NAMES[
              month - 1
            ] +
            " " +
            year
          )
      };
    }

    archiveBack.addEventListener(
      "click",
      () => {
        showArchiveSelector();

      }
    );


    let archiveTouchStartX = 0;
    let archiveTouchStartY = 0;
    let archiveTouchDx = 0;
    let archiveTouchDragging = false;


    archiveDetail.addEventListener(
      "touchstart",
      event => {

        if (archiveSwipeAnimating) {
          return;
        }

        const touch =
          event.changedTouches[0];

        archiveTouchStartX =
          touch.clientX;

        archiveTouchStartY =
          touch.clientY;

        archiveTouchDx = 0;
        archiveTouchDragging = false;

        archiveRankingEl.style.transition =
          "none";
      },
      { passive: true }
    );


    archiveDetail.addEventListener(
      "touchmove",
      event => {

        if (archiveSwipeAnimating) {
          return;
        }

        const touch =
          event.changedTouches[0];

        const dx =
          touch.clientX -
          archiveTouchStartX;

        const dy =
          touch.clientY -
          archiveTouchStartY;


        /*
          Вертикальный скролл не перехватываем.
        */

        if (
          !archiveTouchDragging &&
          Math.abs(dx) <=
            Math.abs(dy) * 1.08
        ) {
          return;
        }


        archiveTouchDragging =
          true;

        archiveTouchDx =
          dx;


        /*
          Контент следует за пальцем,
          но с лёгким сопротивлением.
        */

        const width =
          Math.max(
            1,
            archiveDetail.clientWidth
          );

        const max =
          width * 0.78;

        const resisted =
          Math.max(
            -max,
            Math.min(
              max,
              dx * 0.82
            )
          );


        archiveSwipeCurrentX =
          resisted;

        archiveRankingEl.style.transform =
          `translate3d(${resisted}px, 0, 0)`;


        const opacity =
          Math.max(
            0.60,
            1 -
              Math.abs(resisted) /
              width *
              0.34
          );


        archiveRankingEl.style.opacity =
          String(opacity);


        event.preventDefault();
      },
      { passive: false }
    );


    archiveDetail.addEventListener(
      "touchend",
      async event => {

        if (archiveSwipeAnimating) {
          return;
        }

        const touch =
          event.changedTouches[0];

        const dx =
          archiveTouchDragging
            ? archiveTouchDx
            : touch.clientX -
              archiveTouchStartX;

        const dy =
          touch.clientY -
          archiveTouchStartY;


        const horizontal =
          Math.abs(dx) >
          Math.abs(dy) * 1.08;


        if (
          !horizontal ||
          Math.abs(dx) < 58
        ) {

          archiveRankingEl.style.transition =
            "transform 230ms cubic-bezier(.18,.82,.2,1), opacity 180ms ease";

          archiveRankingEl.style.transform =
            "translate3d(0, 0, 0)";

          archiveRankingEl.style.opacity =
            "1";

          archiveSwipeCurrentX = 0;

          return;
        }


        /*
          Никакого возврата в центр:
          после отпускания текущая информация продолжает
          лететь в ту же сторону прямо из положения пальца.
        */

        const startX =
          archiveSwipeCurrentX ||
          dx * 0.82;


        if (dx < 0) {
          await animateArchiveSwipe(
            1,
            startX
          );
        } else {
          await animateArchiveSwipe(
            -1,
            startX
          );
        }
      },
      { passive: true }
    );


    archiveDetail.addEventListener(
      "touchcancel",
      () => {

        archiveRankingEl.style.transition =
          "transform 220ms cubic-bezier(.18,.82,.2,1), opacity 180ms ease";

        archiveRankingEl.style.transform =
          "translate3d(0, 0, 0)";

        archiveRankingEl.style.opacity =
          "1";

        archiveSwipeCurrentX = 0;
      },
      { passive: true }

    /* =====================================================
       SVG HELPERS
       ===================================================== */

    function getChartX(
      index,
      count,
      left,
      width
    ) {

      if (
        count <= 1
      ) {

        return (
          left +
          width / 2
        );
      }


      return (
        left +
        width *
        index /
        (
          count - 1
        )
      );
    }


    function addSvgLine(
      svg,
      x1,
      y1,
      x2,
      y2,
      stroke
    ) {

      const line =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "line"
        );


      line.setAttribute(
        "x1",
        x1
      );

      line.setAttribute(
        "y1",
        y1
      );

      line.setAttribute(
        "x2",
        x2
      );

      line.setAttribute(
        "y2",
        y2
      );

      line.setAttribute(
        "stroke",
        stroke
      );

      line.setAttribute(
        "stroke-width",
        "1"
      );


      svg.appendChild(
        line
      );
    }


    function addSvgText(
      svg,
      x,
      y,
      text,
      fill,
      anchor,
      size
    ) {

      const element =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "text"
        );


      element.setAttribute(
        "x",
        x
      );

      element.setAttribute(
        "y",
        y
      );

      element.setAttribute(
        "fill",
        fill
      );

      element.setAttribute(
        "text-anchor",
        anchor
      );

      element.setAttribute(
        "font-size",
        size
      );


      element.textContent =
        text;


      svg.appendChild(
        element
      );
    }


    /* =====================================================
       UI HELPERS
       ===================================================== */

    function getPlaceIcon(
      index
    ) {

      if (index === 0) {
        return "1";
      }

      if (index === 1) {
        return "2";
      }

      if (index === 2) {
        return "3";
      }


      return String(
        index + 1
      );
    }


    function showRankingLoader(
      target
    ) {

      target.innerHTML =
        '<div class="loader"></div>';
    }


    function showEmpty(
      target,
      text
    ) {

      target.innerHTML =
        `<div class="empty">${escapeHtml(text)}</div>`;
    }


    function setStatus(
      text,
      error = false
    ) {

      statusEl.textContent =
        text || "";


      statusEl
        .classList
        .toggle(
          "error",
          Boolean(error)
        );
    }


    function isSafePercent(
      value
    ) {

      const number =
        Number(
          value
        );


      return (
        Number.isFinite(
          number
        ) &&
        number >= 0 &&
        number <= 100
      );
    }


    function clampPercent(
      value
    ) {

      const number =
        Number(
          value
        );


      if (
        !Number.isFinite(
          number
        )
      ) {
        return 0;
      }


      return Math.max(
        0,
        Math.min(
          100,
          number
        )
      );
    }


    function formatPercent(
      value
    ) {

      const number =
        Number(
          value
        );


      if (
        !isSafePercent(
          number
        )
      ) {
        return "—";
      }


      return (
        number
          .toFixed(2)
          .replace(
            ".",
            ","
          )
        +
        "%"
      );
    }


    function escapeHtml(
      value
    ) {

      return String(
        value || ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }


    /* =====================================================
       AUTO REFRESH

       Только главная страница.
       Каждые 2 секунды.
       Архив и история сюда не входят.
       ===================================================== */

    let lastKnownPeriodKey =
      getCurrentPeriod().key;

    setInterval(
      () => {

        if (document.hidden) {
          return;
        }

        if (state.currentMonthLoading) {
          return;
        }

        const actualPeriod =
          getCurrentPeriod();

        if (
          actualPeriod.key !==
          lastKnownPeriodKey
        ) {
          lastKnownPeriodKey =
            actualPeriod.key;

          state.archivePeriods = null;
          state.archiveSelectedYear = null;
          state.archiveSelectedPeriod = null;
          state.archiveRankingCache.clear();
          state.historyData = null;
          state.historyLoading = null;
        }

        loadCurrentMonth(true);
      },
      2000
    );


    document.addEventListener(
      "visibilitychange",
      () => {
        if (!document.hidden) {
          loadCurrentMonth(true);
        }
      }
    );


    /* =====================================================
       START
       ===================================================== */

    loadCurrentMonth();

  </script>


  <script>
    // v155 safety bootstrap:
    // after the page is fully initialized, if the current-month card is empty,
    // request the current month again. This does not affect archive mode.
    window.addEventListener("load", function () {
      setTimeout(function () {
        try {
          const archiveOpen =
            document.body &&
            document.body.classList.contains("archive-open");

          const hasCurrentData =
            document.querySelector(
              "[data-current-month-loaded='1'], .person-card, .rating-card, .team-row"
            );

          if (!archiveOpen && !hasCurrentData &&
              typeof loadCurrentMonth === "function") {
            Promise.resolve(loadCurrentMonth()).catch(function () {});
          }
        } catch (e) {}
      }, 900);
    });
  </script>


  <script>
    // v156 startup safety: previous month must not stay frozen in localStorage through day 5.
    window.addEventListener("load", function () {
      try {
        const nowParts = new Intl.DateTimeFormat("en-CA", {
          timeZone: "Europe/Moscow",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).formatToParts(new Date());
        const o = {};
        nowParts.forEach(function (p) {
          if (p.type !== "literal") o[p.type] = p.value;
        });
        const day = Number(o.day);
        let y = Number(o.year);
        let m = Number(o.month) - 1;
        if (m < 1) { m = 12; y -= 1; }
        const prevKey = String(y) + "-" + String(m).padStart(2, "0");

        if (day <= 5) {
          Object.keys(localStorage).forEach(function (k) {
            if (
              k.indexOf("ARCHIVE") !== -1 &&
              (k.indexOf(prevKey) !== -1 || k.indexOf(String(m).padStart(2, "0")) !== -1)
            ) {
              localStorage.removeItem(k);
            }
          });
        }
      } catch (e) {}
    });
  </script>
