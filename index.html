<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Рейтинг команды</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      padding: 36px 18px;
    }

    .wrap {
      width: 100%;
      max-width: 900px;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 42px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-top: 10px;
      margin-bottom: 28px;
      font-size: 16px;
    }

    #ranking {
      position: relative;
    }

    .card {
      display: grid;
      grid-template-columns: 70px 1fr 120px;
      gap: 16px;
      align-items: center;

      padding: 22px;
      margin-bottom: 14px;

      border-radius: 18px;
      background: #1e293b;

      box-shadow: 0 8px 24px rgba(0,0,0,.22);

      transition:
        transform .85s cubic-bezier(.22,.61,.36,1),
        border-color .4s ease,
        box-shadow .4s ease,
        background .4s ease;
    }

    .top1 {
      border: 1px solid #facc15;
    }

    .top2 {
      border: 1px solid #cbd5e1;
    }

    .top3 {
      border: 1px solid #fb923c;
    }

    .rank {
      font-size: 30px;
      font-weight: 700;
      text-align: center;
    }

    .name {
      font-size: 24px;
      font-weight: 700;
    }

    .percent {
      font-size: 28px;
      font-weight: 800;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .bar {
      grid-column: 2 / 4;
      height: 10px;
      background: #334155;
      border-radius: 999px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        #38bdf8,
        #22c55e
      );

      transition:
        width 1.6s cubic-bezier(.22,.61,.36,1);
    }

    .status {
      margin-top: 18px;
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
    }

    .pulse-up {
      animation: pulseUp .9s ease;
    }

    .pulse-down {
      animation: pulseDown .9s ease;
    }

    @keyframes pulseUp {
      0% {
        box-shadow: 0 8px 24px rgba(0,0,0,.22);
      }

      50% {
        box-shadow: 0 0 30px rgba(34,197,94,.4);
      }

      100% {
        box-shadow: 0 8px 24px rgba(0,0,0,.22);
      }
    }

    @keyframes pulseDown {
      0% {
        box-shadow: 0 8px 24px rgba(0,0,0,.22);
      }

      50% {
        box-shadow: 0 0 30px rgba(239,68,68,.3);
      }

      100% {
        box-shadow: 0 8px 24px rgba(0,0,0,.22);
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 30px;
      }

      .card {
        grid-template-columns: 50px 1fr 90px;
        padding: 16px;
      }

      .name {
        font-size: 18px;
      }

      .percent {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="wrap">

    <h1>🏆 Рейтинг команды</h1>

    <div class="subtitle">
      Актуальные результаты
    </div>

    <div id="ranking">
      Загрузка...
    </div>

    <div
      class="status"
      id="status">
    </div>

  </div>

  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbwYcG1OIZ_y2E3OZQw8oH0IuDMyk06lxL41oM6K1TtXN0Noxa5bV7kC_hsWOXTsTde_IA/exec";


    let isLoading = false;

    let displayedData = "";
    let candidateData = "";
    let candidateCount = 0;

    let currentPeople = [];


    function medal(index) {

      if (index === 0) return "🥇";
      if (index === 1) return "🥈";
      if (index === 2) return "🥉";

      return index + 1;
    }


    function formatPercent(value) {

      return (
        Number(value)
          .toFixed(1)
          .replace(".", ",")
        + "%"
      );
    }


    function animateNumber(
      element,
      from,
      to,
      duration = 1600
    ) {

      const start =
        performance.now();

      function frame(now) {

        const progress =
          Math.min(
            (now - start) / duration,
            1
          );

        const eased =
          1 -
          Math.pow(
            1 - progress,
            3
          );

        const value =
          from +
          (to - from) *
          eased;

        element.textContent =
          formatPercent(value);

        if (progress < 1) {

          requestAnimationFrame(
            frame
          );
        }
      }

      requestAnimationFrame(frame);
    }


    function createCard(
      person,
      index
    ) {

      const card =
        document.createElement("div");

      card.dataset.name =
        person.name;

      card.className =
        "card " +
        (
          index === 0
            ? "top1"
            : index === 1
            ? "top2"
            : index === 2
            ? "top3"
            : ""
        );

      card.innerHTML = `

        <div class="rank">
          ${medal(index)}
        </div>

        <div class="name">
          ${person.name}
        </div>

        <div
          class="percent">
          ${formatPercent(person.percent)}
        </div>

        <div class="bar">

          <div
            class="fill"
            style="
              width:
              ${Math.min(person.percent,100)}%
            ">
          </div>

        </div>
      `;

      return card;
    }


    function firstRender(people) {

      const ranking =
        document.getElementById(
          "ranking"
        );

      ranking.innerHTML = "";

      people.forEach(
        (person,index) => {

          ranking.appendChild(
            createCard(
              person,
              index
            )
          );

        }
      );

      currentPeople =
        JSON.parse(
          JSON.stringify(people)
        );

      updateStatus();
    }


    function updateStatus() {

      document
        .getElementById("status")
        .textContent =
          "Обновлено: " +
          new Date()
            .toLocaleTimeString(
              "ru-RU"
            );
    }


    function updateRanking(newPeople) {

      const ranking =
        document.getElementById(
          "ranking"
        );


      /*
        Запоминаем старые позиции
        карточек до перестановки
      */

      const oldRects = {};

      ranking
        .querySelectorAll(".card")
        .forEach(card => {

          oldRects[
            card.dataset.name
          ] =
            card
              .getBoundingClientRect();

        });


      /*
        Собираем текущие карточки
      */

      const cards = {};

      ranking
        .querySelectorAll(".card")
        .forEach(card => {

          cards[
            card.dataset.name
          ] =
            card;

        });


      /*
        Обновляем значения
        и меняем порядок
      */

      newPeople.forEach(
        (person,index) => {

          let card =
            cards[
              person.name
            ];

          if (!card) {

            card =
              createCard(
                person,
                index
              );
          }


          const oldPerson =
            currentPeople.find(
              p =>
                p.name ===
                person.name
            );


          const oldValue =
            oldPerson
              ? Number(oldPerson.percent)
              : Number(person.percent);


          const newValue =
            Number(person.percent);


          const percentElement =
            card.querySelector(
              ".percent"
            );


          animateNumber(
            percentElement,
            oldValue,
            newValue,
            1600
          );


          /*
            Плавно двигаем шкалу
          */

          card
            .querySelector(".fill")
            .style.width =
              Math.min(
                newValue,
                100
              ) + "%";


          /*
            Обновляем место
          */

          card
            .querySelector(
              ".rank"
            )
            .textContent =
              medal(index);


          /*
            Обновляем оформление
            топ-3
          */

          card.className =
            "card " +
            (
              index === 0
                ? "top1"
                : index === 1
                ? "top2"
                : index === 2
                ? "top3"
                : ""
            );


          /*
            Смотрим, поднялся
            или опустился участник
          */

          const oldIndex =
            currentPeople
              .findIndex(
                p =>
                  p.name ===
                  person.name
              );


          if (
            oldIndex !== -1 &&
            index < oldIndex
          ) {

            card.classList.add(
              "pulse-up"
            );

          }


          if (
            oldIndex !== -1 &&
            index > oldIndex
          ) {

            card.classList.add(
              "pulse-down"
            );

          }


          /*
            Переставляем карточку
            в новое место
          */

          ranking.appendChild(card);

        }
      );


      /*
        Получаем новые позиции
      */

      const newRects = {};

      ranking
        .querySelectorAll(".card")
        .forEach(card => {

          newRects[
            card.dataset.name
          ] =
            card
              .getBoundingClientRect();

        });


      /*
        FLIP-анимация
        перемещения карточек
      */

      ranking
        .querySelectorAll(".card")
        .forEach(card => {

          const name =
            card.dataset.name;

          const oldRect =
            oldRects[name];

          const newRect =
            newRects[name];


          if (
            !oldRect ||
            !newRect
          ) {
            return;
          }


          const deltaY =
            oldRect.top -
            newRect.top;


          if (
            Math.abs(deltaY) > 1
          ) {

            card.style.transition =
              "none";

            card.style.transform =
              `translateY(${deltaY}px)`;


            requestAnimationFrame(
              () => {

                requestAnimationFrame(
                  () => {

                    card.style.transition =
                      "transform .85s cubic-bezier(.22,.61,.36,1), border-color .4s ease, box-shadow .4s ease, background .4s ease";

                    card.style.transform =
                      "translateY(0)";

                  }
                );

              }
            );

          }

        });


      currentPeople =
        JSON.parse(
          JSON.stringify(
            newPeople
          )
        );


      updateStatus();
    }


    async function loadRanking() {

      if (isLoading) {
        return;
      }

      isLoading = true;


      try {

        const response =
          await fetch(
            API_URL +
            "?t=" +
            Date.now(),
            {
              cache:
                "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "Ошибка API"
          );

        }


        const data =
          await response.json();


        if (
          !data ||
          !Array.isArray(
            data.people
          )
        ) {

          throw new Error(
            "Некорректные данные"
          );

        }


        const people =
          data.people
            .map(person => ({
              name:
                String(
                  person.name || ""
                ).trim(),

              percent:
                Number(
                  person.percent || 0
                )
            }))

            .filter(
              person =>
                person.name &&
                person.percent > 0
            )

            .sort(
              (a,b) =>
                b.percent -
                a.percent
            )

            .slice(0,5);


        /*
          Защита от неполного
          ответа API
        */

        if (
          people.length !== 5
        ) {
          return;
        }


        const fingerprint =
          JSON.stringify(
            people
          );


        /*
          Первый запуск
        */

        if (!displayedData) {

          displayedData =
            fingerprint;

          firstRender(
            people
          );

          return;
        }


        /*
          Данные не изменились
        */

        if (
          fingerprint ===
          displayedData
        ) {

          candidateData = "";
          candidateCount = 0;

          return;
        }


        /*
          Подтверждаем новое
          состояние дважды
        */

        if (
          fingerprint ===
          candidateData
        ) {

          candidateCount++;

        } else {

          candidateData =
            fingerprint;

          candidateCount = 1;

        }


        /*
          Новые данные появились
          два раза подряд
        */

        if (
          candidateCount >= 2
        ) {

          displayedData =
            fingerprint;

          candidateData = "";
          candidateCount = 0;


          updateRanking(
            people
          );
        }

      }

      catch(error) {

        console.log(
          "Ошибка загрузки:",
          error
        );

        document
          .getElementById(
            "status"
          )
          .textContent =
            "Ошибка получения данных";

      }

      finally {

        isLoading = false;

      }
    }


    /*
      Первый запрос сразу
    */

    loadRanking();


    /*
      Проверяем новые значения
      каждые 2 секунды
    */

    setInterval(
      loadRanking,
      2000
    );

  </script>

</body>
</html>
