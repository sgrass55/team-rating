<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Рейтинг команды</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 18px 12px 35px;

  background:
    radial-gradient(
      circle at top,
      #172554,
      #07111f 55%
    );

  color: white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

.container {
  width: 100%;
  max-width: 820px;
  margin: auto;
}

h1 {
  margin: 0;
  text-align: center;
  font-size: 32px;
}

.subtitle {
  margin-top: 4px;
  text-align: center;
  color: #94a3b8;
  font-size: 13px;
}

.period-title {
  margin: 14px 0 12px;
  text-align: center;
  font-size: 22px;
  font-weight: 900;
}


/* КАРТОЧКИ */

.cards {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.card {
  display: grid;

  grid-template-columns:
    50px
    minmax(0,1fr)
    95px;

  gap: 10px;
  align-items: center;

  padding: 12px 15px;

  background:
    rgba(15,23,42,.78);

  border:
    1px solid rgba(255,255,255,.08);

  border-radius: 15px;

  cursor: pointer;

  transition:
    transform .2s ease,
    background .2s ease;
}

.card:hover {
  transform: translateY(-1px);
  background: rgba(30,41,59,.92);
}

.card.rank-1 {
  border-color: rgba(250,204,21,.7);
}

.card.rank-2 {
  border-color: rgba(203,213,225,.55);
}

.card.rank-3 {
  border-color: rgba(180,83,9,.7);
}

.rank {
  font-size: 24px;
  font-weight: 900;
}

.name {
  font-size: 18px;
  font-weight: 750;
}

.percent {
  text-align: right;
  font-size: 22px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}


/* ШКАЛА */

.bar-wrapper {
  margin-top: 7px;
}

.bar {
  position: relative;
  height: 10px;
  overflow: hidden;

  background:
    rgba(255,255,255,.08);

  border-radius: 50px;
}

.fill {
  position: absolute;
  inset: 0 auto 0 0;

  background:
    linear-gradient(
      90deg,
      #38bdf8,
      #22c55e
    );

  border-radius: 50px;

  transition: width .7s ease;
}

.ticks {
  position: absolute;
  inset: 0;

  background-image:
    repeating-linear-gradient(
      to right,
      transparent 0,
      transparent calc(5% - 1px),
      rgba(255,255,255,.25)
        calc(5% - 1px),
      rgba(255,255,255,.25) 5%
    );

  pointer-events: none;
}

.ticks-strong {
  position: absolute;
  inset: 0;

  background-image:
    repeating-linear-gradient(
      to right,
      transparent 0,
      transparent calc(10% - 1px),
      rgba(255,255,255,.5)
        calc(10% - 1px),
      rgba(255,255,255,.5) 10%
    );

  pointer-events: none;
}


/* ≥ 90 */

.good {
  color: #22c55e !important;
}


/* ПЕРИОД */

.period-selector {
  margin-top: 18px;
  padding-top: 14px;

  border-top:
    1px solid rgba(255,255,255,.08);
}

.selector-title {
  margin-bottom: 9px;
  text-align: center;
  color: #94a3b8;
  font-size: 12px;
}

.years,
.months {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 7px;
}

.months {
  margin-top: 8px;
}

.year-btn,
.month-btn,
.action-btn {

  min-height: 40px;
  padding: 8px 13px;

  color: white;

  background:
    rgba(255,255,255,.06);

  border:
    1px solid rgba(255,255,255,.12);

  border-radius: 11px;

  cursor: pointer;
}

.year-btn.active,
.month-btn.active {

  border-color: #38bdf8;

  background:
    rgba(56,189,248,.18);
}


/* НАВИГАЦИЯ */

.nav {
  display: flex;
  gap: 8px;
  justify-content: space-between;

  margin: 16px 0;
}

.action-btn {
  flex: 1;
}


/* ИСТОРИЯ */

.person-title {
  text-align: center;
  font-size: 26px;
  font-weight: 900;
}

.history {
  margin-top: 15px;

  display: flex;
  flex-direction: column;
  gap: 6px;
}

.history-row {
  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 10px 13px;

  background:
    rgba(255,255,255,.05);

  border-radius: 11px;
}

.history-value {
  font-weight: 900;
  font-size: 17px;
}


/* СРАВНЕНИЕ */

.compare-box {
  padding: 15px;

  background:
    rgba(15,23,42,.75);

  border:
    1px solid rgba(255,255,255,.08);

  border-radius: 15px;
}

.compare-box h2 {
  margin-top: 0;
  font-size: 20px;
}

.options {
  display: grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap: 7px;
}

.option {
  display: flex;
  align-items: center;
  gap: 8px;

  min-height: 42px;
  padding: 9px 10px;

  background:
    rgba(255,255,255,.05);

  border-radius: 10px;
}

.option input {
  width: 18px;
  height: 18px;
}

.compare-run {
  width: 100%;

  margin-top: 12px;

  background: #2563eb;

  border: 0;

  font-weight: 800;
}


/* ГРАФИК */

.chart-box {
  margin-top: 15px;
  padding: 12px;

  overflow-x: auto;

  background:
    rgba(15,23,42,.72);

  border:
    1px solid rgba(255,255,255,.07);

  border-radius: 15px;
}

.chart {
  display: block;
  height: 300px;
}

.grid-line {
  stroke: rgba(255,255,255,.1);
}

.axis-label {
  fill: #94a3b8;
  font-size: 11px;
}

.chart-line {
  fill: none;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.chart-dot {
  stroke: #07111f;
  stroke-width: 2;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;

  margin-top: 10px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;

  font-size: 12px;
}

.legend-dot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
}


/* СЛУЖЕБНОЕ */

.status {
  margin-top: 9px;

  text-align: center;

  color: #64748b;

  font-size: 10px;
}

.empty {
  padding: 25px;
  text-align: center;
  color: #94a3b8;
}

.hidden {
  display: none !important;
}


/* МОБИЛЬНЫЙ */

@media (max-width: 600px) {

  body {
    padding: 12px 8px 28px;
  }

  h1 {
    font-size: 26px;
  }

  .period-title {
    font-size: 19px;
    margin: 10px 0;
  }

  .card {
    grid-template-columns:
      38px
      minmax(0,1fr)
      72px;

    gap: 6px;

    padding: 10px 9px;
  }

  .rank {
    font-size: 20px;
  }

  .name {
    font-size: 15px;
  }

  .percent {
    font-size: 18px;
  }

  .bar {
    height: 9px;
  }

  .options {
    grid-template-columns: 1fr;
  }

  .person-title {
    font-size: 22px;
  }

  .year-btn,
  .month-btn {
    font-size: 12px;
    padding: 7px 10px;
  }

  .chart {
    height: 270px;
  }
}

</style>
</head>


<body>

<div class="container">

  <h1>🏆 Рейтинг команды</h1>

  <div class="subtitle">
    Актуальные результаты
  </div>


  <!-- ГЛАВНАЯ -->

  <section id="main-view">

    <div
      id="period-title"
      class="period-title"
    >
      Загрузка...
    </div>

    <div
      id="cards"
      class="cards"
    ></div>

    <div class="period-selector">

      <div class="selector-title">
        Выберите год и месяц
      </div>

      <div
        id="years"
        class="years"
      ></div>

      <div
        id="months"
        class="months"
      ></div>

    </div>

  </section>


  <!-- ЧЕЛОВЕК -->

  <section
    id="person-view"
    class="hidden"
  >

    <div class="nav">

      <button
        class="action-btn"
        onclick="showMain()"
      >
        ← К рейтингу
      </button>

      <button
        class="action-btn"
        onclick="openCompare()"
      >
        Сравнить
      </button>

    </div>

    <div
      id="person-title"
      class="person-title"
    ></div>

    <div
      id="person-chart"
      class="chart-box"
    ></div>

    <div
      id="history"
      class="history"
    ></div>

  </section>


  <!-- СРАВНЕНИЕ -->

  <section
    id="compare-view"
    class="hidden"
  >

    <div class="nav">

      <button
        class="action-btn"
        onclick="backFromCompare()"
      >
        ← Назад
      </button>

    </div>

    <div class="compare-box">

      <h2>
        Сравнение участников
      </h2>

      <div
        id="options"
        class="options"
      ></div>

      <button
        class="action-btn compare-run"
        onclick="runComparison()"
      >
        Показать сравнение
      </button>

    </div>

    <div
      id="compare-chart"
      class="chart-box hidden"
    ></div>

    <div
      id="legend"
      class="legend"
    ></div>

  </section>


  <div
    id="status"
    class="status"
  >
    Загрузка...
  </div>

</div>


<script>

/* API */

const API_URL =
"https://script.google.com/macros/s/AKfycbwYcG1OIZ_y2E3OZQw8oH0IuDMyk06lxL41oM6K1TtXN0Noxa5bV7kC_hsWOXTsTde_IA/exec";


const MONTHS = [
  "ЯНВАРЬ",
  "ФЕВРАЛЬ",
  "МАРТ",
  "АПРЕЛЬ",
  "МАЙ",
  "ИЮНЬ",
  "ИЮЛЬ",
  "АВГУСТ",
  "СЕНТЯБРЬ",
  "ОКТЯБРЬ",
  "НОЯБРЬ",
  "ДЕКАБРЬ"
];

const SHORT_MONTHS = [
  "Янв","Фев","Мар","Апр",
  "Май","Июн","Июл","Авг",
  "Сен","Окт","Ноя","Дек"
];

const COLORS = [
  "#38bdf8",
  "#f59e0b",
  "#a78bfa",
  "#fb7185",
  "#2dd4bf",
  "#f97316"
];


let periods = [];
let selectedYear = null;
let selectedPeriod = null;

let allData = null;
let currentPerson = null;

let loading = false;


/* API */

async function api(query) {

  const response =
    await fetch(
      API_URL +
      query +
      "&_=" +
      Date.now()
    );

  if (!response.ok) {
    throw new Error(
      "Ошибка загрузки"
    );
  }

  return response.json();
}


/* СТАРТ */

async function init() {

  try {

    await refreshPeriods();

    if (!periods.length) {
      document.getElementById(
        "cards"
      ).innerHTML =
        '<div class="empty">Нет данных</div>';

      return;
    }

    selectInitialPeriod();

  } catch (error) {

    errorStatus(error);
  }
}


/* ОБНОВЛЕНИЕ СПИСКА МЕСЯЦЕВ */

async function refreshPeriods() {

  const data =
    await api("?mode=months");

  const newPeriods =
    data.months || [];

  const changed =
    JSON.stringify(newPeriods) !==
    JSON.stringify(periods);

  periods = newPeriods;

  if (changed) {
    renderYears();
    renderMonths();
  }
}


/* ТЕКУЩИЙ МЕСЯЦ */

function currentPeriodKey() {

  const now = new Date();

  return (
    MONTHS[now.getMonth()] +
    now.getFullYear()
  );
}


function selectInitialPeriod() {

  const current =
    currentPeriodKey();

  const found =
    periods.find(
      p => p.key === current
    );

  const target =
    found ||
    periods[
      periods.length - 1
    ];

  selectedYear =
    target.year;

  renderYears();
  renderMonths();

  loadPeriod(target.key);
}


/* ГОДЫ */

function renderYears() {

  const root =
    document.getElementById(
      "years"
    );

  root.innerHTML = "";

  const years =
    [...new Set(
      periods.map(
        p => p.year
      )
    )]
    .sort((a,b) => b-a);

  years.forEach(year => {

    const button =
      document.createElement(
        "button"
      );

    button.className =
      "year-btn";

    button.textContent =
      year;

    if (
      year === selectedYear
    ) {
      button.classList.add(
        "active"
      );
    }

    button.onclick = () => {

      selectedYear = year;

      renderYears();
      renderMonths();
    };

    root.appendChild(button);
  });
}


/* МЕСЯЦЫ */

function renderMonths() {

  const root =
    document.getElementById(
      "months"
    );

  root.innerHTML = "";

  periods
    .filter(
      p =>
        p.year === selectedYear
    )
    .forEach(period => {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "month-btn";

      const month =
        MONTHS[
          period.month - 1
        ];

      button.textContent =
        month.charAt(0) +
        month
          .slice(1)
          .toLowerCase();

      if (
        period.key ===
        selectedPeriod
      ) {
        button.classList.add(
          "active"
        );
      }

      button.onclick = () =>
        loadPeriod(
          period.key
        );

      root.appendChild(button);
    });
}


/* РЕЙТИНГ */

async function loadPeriod(key) {

  if (loading) return;

  loading = true;

  selectedPeriod = key;

  const info =
    periods.find(
      p => p.key === key
    );

  if (info) {

    selectedYear =
      info.year;

    document.getElementById(
      "period-title"
    ).textContent =
      info.label;
  }

  renderYears();
  renderMonths();

  try {

    const data =
      await api(
        "?mode=month&period=" +
        encodeURIComponent(key)
      );

    renderRanking(
      data.people || []
    );

    status(
      "Данные обновлены"
    );

  } catch (error) {

    errorStatus(error);

  } finally {

    loading = false;
  }
}


function renderRanking(people) {

  const root =
    document.getElementById(
      "cards"
    );

  root.innerHTML = "";

  if (!people.length) {

    root.innerHTML =
      '<div class="empty">Нет данных за этот месяц</div>';

    return;
  }

  people.forEach(
    (person,index) => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "card rank-" +
        (index + 1);

      let rank =
        index + 1;

      if (rank === 1) rank = "🥇";
      if (rank === 2) rank = "🥈";
      if (rank === 3) rank = "🥉";

      const good =
        person.percent >= 90
          ? "good"
          : "";

      card.innerHTML = `

        <div class="rank">
          ${rank}
        </div>

        <div>

          <div class="name">
            ${escapeHtml(person.name)}
          </div>

          <div class="bar-wrapper">

            <div class="bar">

              <div
                class="fill"
                style="
                  width:${clamp(person.percent)}%
                "
              ></div>

              <div class="ticks"></div>

              <div class="ticks-strong"></div>

            </div>

          </div>

        </div>

        <div
          class="percent ${good}"
          style="
            color:${percentColor(person.percent)}
          "
        >
          ${formatPercent(person.percent)}
        </div>
      `;

      card.onclick = () =>
        openPerson(
          person.name
        );

      root.appendChild(card);
    });
}


/* ВСЯ ИСТОРИЯ */

async function getAllData(
  force = false
) {

  if (
    allData &&
    !force
  ) {
    return allData;
  }

  status(
    "Загрузка истории..."
  );

  allData =
    await api(
      "?mode=all"
    );

  status(
    "История загружена"
  );

  return allData;
}


/* ЧЕЛОВЕК */

async function openPerson(name) {

  currentPerson = name;

  showView(
    "person-view"
  );

  document.getElementById(
    "person-title"
  ).textContent =
    name;

  try {

    const data =
      await getAllData();

    const history =
      data.people[name] || [];

    renderHistory(
      history
    );

    renderChart(
      document.getElementById(
        "person-chart"
      ),
      [{
        name: name,
        values: history
      }]
    );

  } catch (error) {

    errorStatus(error);
  }
}


function renderHistory(history) {

  const root =
    document.getElementById(
      "history"
    );

  root.innerHTML = "";

  history
    .slice()
    .sort(
      (a,b) =>
        b.sort - a.sort
    )
    .forEach(item => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "history-row";

      row.innerHTML = `

        <span>
          ${escapeHtml(item.label)}
        </span>

        <span
          class="
            history-value
            ${
              item.percent >= 90
                ? "good"
                : ""
            }
          "
        >
          ${formatPercent(item.percent)}
        </span>
      `;

      root.appendChild(row);
    });
}


/* СРАВНЕНИЕ */

async function openCompare() {

  showView(
    "compare-view"
  );

  try {

    const data =
      await getAllData();

    const root =
      document.getElementById(
        "options"
      );

    root.innerHTML = "";

    Object.keys(
      data.people
    )
    .forEach(name => {

      const label =
        document.createElement(
          "label"
        );

      label.className =
        "option";

      label.innerHTML = `

        <input
          type="checkbox"
          value="${escapeHtml(name)}"
          ${
            name === currentPerson
              ? "checked"
              : ""
          }
        >

        <span>
          ${escapeHtml(name)}
        </span>
      `;

      root.appendChild(label);
    });

  } catch (error) {

    errorStatus(error);
  }
}


function runComparison() {

  const selected =
    Array.from(
      document.querySelectorAll(
        "#options input:checked"
      )
    )
    .map(input =>
      input.value
    );

  if (!selected.length) {

    alert(
      "Выберите участников"
    );

    return;
  }

  const series =
    selected.map(name => ({
      name: name,
      values:
        allData.people[name] || []
    }));

  const chart =
    document.getElementById(
      "compare-chart"
    );

  chart.classList.remove(
    "hidden"
  );

  renderChart(
    chart,
    series
  );

  renderLegend(
    selected
  );
}


/* ГРАФИК */

function renderChart(root,series) {

  const periodMap =
    new Map();

  series.forEach(s =>
    s.values.forEach(v =>
      periodMap.set(
        v.sort,
        v
      )
    )
  );

  const chartPeriods =
    Array.from(
      periodMap.values()
    )
    .sort(
      (a,b) =>
        a.sort - b.sort
    );

  if (!chartPeriods.length) {

    root.innerHTML =
      '<div class="empty">Нет данных</div>';

    return;
  }

  const width =
    Math.max(
      620,
      chartPeriods.length * 75
    );

  const height = 300;

  const left = 45;
  const right = 20;
  const top = 20;
  const bottom = 50;

  const cw =
    width - left - right;

  const ch =
    height - top - bottom;

  const minY = 70;
  const maxY = 100;


  function x(index) {

    if (
      chartPeriods.length === 1
    ) {
      return left + cw / 2;
    }

    return (
      left +
      index *
      cw /
      (
        chartPeriods.length - 1
      )
    );
  }


  function y(value) {

    const safe =
      Math.max(
        minY,
        Math.min(
          maxY,
          value
        )
      );

    return (
      top +
      ch -
      (
        (safe-minY) /
        (maxY-minY)
      ) *
      ch
    );
  }


  let svg = `
    <svg
      class="chart"
      viewBox="0 0 ${width} ${height}"
      style="width:${width}px"
    >
  `;


  [
    70,75,80,85,90,95,100
  ]
  .forEach(value => {

    const yy =
      y(value);

    svg += `

      <line
        class="grid-line"
        x1="${left}"
        y1="${yy}"
        x2="${width-right}"
        y2="${yy}"
      />

      <text
        class="axis-label"
        x="4"
        y="${yy+4}"
      >
        ${value}%
      </text>
    `;
  });


  chartPeriods.forEach(
    (period,index) => {

      svg += `

        <text
          class="axis-label"
          text-anchor="middle"
          x="${x(index)}"
          y="${height-18}"
        >
          ${
            SHORT_MONTHS[
              period.month-1
            ]
          } ${String(period.year).slice(-2)}
        </text>
      `;
    }
  );


  series.forEach(
    (serie,sIndex) => {

      const color =
        COLORS[
          sIndex %
          COLORS.length
        ];

      const map =
        new Map(
          serie.values.map(
            v => [
              v.sort,
              v
            ]
          )
        );

      let path = "";
      let started = false;

      chartPeriods.forEach(
        (period,index) => {

          const value =
            map.get(
              period.sort
            );

          if (!value) {

            started = false;

            return;
          }

          const px =
            x(index);

          const py =
            y(value.percent);

          if (!started) {

            path +=
              `M ${px} ${py}`;

            started = true;

          } else {

            path +=
              ` L ${px} ${py}`;
          }
        }
      );


      svg += `

        <path
          class="chart-line"
          stroke="${color}"
          d="${path}"
        />
      `;


      chartPeriods.forEach(
        (period,index) => {

          const value =
            map.get(
              period.sort
            );

          if (!value) return;

          const dot =
            value.percent >= 90
              ? "#22c55e"
              : color;

          svg += `

            <circle
              class="chart-dot"
              cx="${x(index)}"
              cy="${y(value.percent)}"
              r="5"
              fill="${dot}"
            >
              <title>
                ${escapeHtml(serie.name)}
                —
                ${escapeHtml(period.label)}
                —
                ${formatPercent(value.percent)}
              </title>
            </circle>
          `;
        }
      );
    }
  );


  svg += "</svg>";

  root.innerHTML = svg;
}


/* ЛЕГЕНДА */

function renderLegend(names) {

  const root =
    document.getElementById(
      "legend"
    );

  root.innerHTML = "";

  names.forEach(
    (name,index) => {

      root.innerHTML += `

        <div class="legend-item">

          <span
            class="legend-dot"
            style="
              background:
              ${
                COLORS[
                  index %
                  COLORS.length
                ]
              }
            "
          ></span>

          ${escapeHtml(name)}

        </div>
      `;
    }
  );
}


/* ЭКРАНЫ */

function showView(id) {

  [
    "main-view",
    "person-view",
    "compare-view"
  ]
  .forEach(view =>
    document
      .getElementById(view)
      .classList.add(
        "hidden"
      )
  );

  document
    .getElementById(id)
    .classList.remove(
      "hidden"
    );

  window.scrollTo(
    0,
    0
  );
}


function showMain() {

  showView(
    "main-view"
  );
}


function backFromCompare() {

  if (currentPerson) {

    showView(
      "person-view"
    );

  } else {

    showMain();
  }
}


/* ЦВЕТ ПРОЦЕНТА */

function percentColor(value) {

  if (value >= 90)
    return "#22c55e";

  if (value <= 80)
    return "#ef4444";

  if (value <= 85)
    return "#f59e0b";

  return "#eab308";
}


/* УТИЛИТЫ */

function formatPercent(value) {

  return (
    Number(value)
      .toFixed(1)
      .replace(".",",")
    +
    "%"
  );
}


function clamp(value) {

  return Math.max(
    0,
    Math.min(
      100,
      Number(value) || 0
    )
  );
}


function escapeHtml(value) {

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function status(text) {

  document.getElementById(
    "status"
  ).textContent =
    text;
}


function errorStatus(error) {

  console.error(error);

  status(
    "Ошибка загрузки данных"
  );
}


/* =====================================
   АВТООБНОВЛЕНИЕ ТЕКУЩЕГО РЕЙТИНГА
   каждые 5 секунд
===================================== */

setInterval(() => {

  const visible =
    !document
      .getElementById(
        "main-view"
      )
      .classList
      .contains(
        "hidden"
      );

  if (
    visible &&
    selectedPeriod
  ) {
    loadPeriod(
      selectedPeriod
    );
  }

},5000);


/* =====================================
   ПОИСК НОВЫХ МЕСЯЦЕВ
   раз в 60 секунд
===================================== */

setInterval(async () => {

  try {

    const before =
      JSON.stringify(
        periods
      );

    await refreshPeriods();

    const after =
      JSON.stringify(
        periods
      );

    if (before !== after) {

      /*
        Сбрасываем кэш истории,
        потому что появился новый месяц.
      */

      allData = null;

      status(
        "Обнаружены новые данные"
      );
    }

  } catch (error) {

    console.error(error);
  }

},60000);


/* СТАРТ */

init();

</script>
