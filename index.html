<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Рейтинг команды</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      padding: 36px 18px;
    }

    .wrap {
      width: 100%;
      max-width: 900px;
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 42px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-top: 10px;
      margin-bottom: 28px;
    }

    #ranking {
      position: relative;
    }

    .card {
      display: grid;
      grid-template-columns: 70px 1fr 120px;
      gap: 16px;
      align-items: center;

      padding: 22px;
      margin-bottom: 14px;

      border-radius: 18px;
      background: #1e293b;

      box-shadow: 0 8px 24px rgba(0,0,0,.22);

      transition:
        transform .75s cubic-bezier(.22,.61,.36,1),
        border-color .45s ease,
        background .45s ease,
        box-shadow .45s ease;
    }

    .top1 {
      border: 1px solid #facc15;
    }

    .top2 {
      border: 1px solid #cbd5e1;
    }

    .top3 {
      border: 1px solid #fb923c;
    }

    .rank {
      font-size: 30px;
      font-weight: 700;
      text-align: center;
      transition: transform .4s ease;
    }

    .name {
      font-size: 24px;
      font-weight: 700;
    }

    .percent {
      font-size: 28px;
      font-weight: 800;
      text-align: right;
      font-variant-numeric: tabular-nums;
      min-width: 110px;
    }

    .bar {
      grid-column: 2 / 4;
      height: 10px;
      background: #334155;
      border-radius: 999px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          #38bdf8,
          #22c55e
        );

      transition:
        width 1.5s cubic-bezier(.22,.61,.36,1);
    }

    .status {
      margin-top: 18px;
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
    }

    .pulse-up {
      animation: pulseUp .8s ease;
    }

    .pulse-down {
      animation: pulseDown .8s ease;
    }

    @keyframes pulseUp {
      0% {
        box-shadow: 0 8px 24px rgba(0,0,0,.22);
      }

      50% {
        box-shadow: 0 0 28px rgba(34,197,94,.45);
      }

      100% {
        box-shadow: 0 8px 24px rgba(0,0,0,.22);
      }
    }

    @keyframes pulseDown {
      0% {
        box-shadow: 0 8px 24px rgba(0,0,0,.22);
      }

      50% {
        box-shadow: 0 0 28px rgba(239,68,68,.35);
      }

      100% {
        box-shadow: 0 8px 24px rgba(0,0,0,.22);
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 30px;
      }

      .card {
        grid-template-columns: 50px 1fr 90px;
        padding: 16px;
      }

      .name {
        font-size: 18px;
      }

      .percent {
        font-size: 22px;
        min-width: 80px;
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1>🏆 Рейтинг команды</h1>

  </div>

  <div id="ranking">

  </div>

  <div

</div>

function parseCSV(text) {

  const rows = [];

  let row = [];
  let cell = "";
  let inQuotes = false;

  for (
    let i = 0;
    i < text.length;
    i++
  ) {

    const char = text[i];
    const next = text[i + 1];

    if (char === '"') {

      if (
        inQuotes &&
        next === '"'
      ) {

        cell += '"';
        i++;

      } else {

        inQuotes = !inQuotes;

      }

    }

    else if (
      char === "," &&
      !inQuotes
    ) {

      row.push(cell);
      cell = "";

    }

    else if (
      (char === "\n" ||
       char === "\r") &&
      !inQuotes
    ) {

      if (
        char === "\r" &&
        next === "\n"
      ) {
        i++;
      }

      row.push(cell);
      rows.push(row);

      row = [];
      cell = "";

    }

    else {

      cell += char;

    }

  }

  if (
    cell.length ||
    row.length
  ) {

    row.push(cell);
    rows.push(row);

  }

  return rows;
}


function parsePercent(value) {

  if (!value) {
    return 0;
  }

  return (
    parseFloat(
      value
        .replace("%","")
        .replace(/\s/g,"")
        .replace(",",".")
    ) || 0
  );

}


function medal(index) {

  if (index === 0) {
    return "🥇";
  }

  if (index === 1) {
    return "🥈";
  }

  if (index === 2) {
    return "🥉";
  }

  return index + 1;

}


function formatPercent(value) {

  return (
    value
      .toFixed(1)
      .replace(".",",")
    + "%"
  );

}


function animateNumber(
  element,
  from,
  to,
  duration = 1400
) {

  const start =
    performance.now();

  function frame(now) {

    const progress =
      Math.min(
        (now - start) /
        duration,
        1
      );

    const eased =
      1 -
      Math.pow(
        1 - progress,
        3
      );

    const value =
      from +
      (to - from) *
      eased;

    element.textContent =
      formatPercent(value);

    if (progress < 1) {

      requestAnimationFrame(
        frame
      );

    }

  }

  requestAnimationFrame(frame);

}
