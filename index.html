<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Рейтинг команды</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #06101f;
      --bg2: #0c1730;
      --card: rgba(22, 36, 63, 0.9);
      --border: rgba(255, 255, 255, 0.12);

      --text: #f5f7ff;
      --muted: #8e9bb7;

      --blue: #37bff5;
      --green: #31d879;

      --gold: #f6c626;
      --silver: #bac4d1;
      --bronze: #cf7b30;

      --danger: #ff6174;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 50% 0%,
          #172959 0%,
          #0b162b 32%,
          #050c18 72%
        );

      background-attachment: fixed;
    }

    button,
    select {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      min-height: 100vh;
      padding: 22px 16px 60px;
    }

    .container {
      width: min(920px, 100%);
      margin: 0 auto;
    }

    /* HEADER */

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    .title {
      margin: 0;

      font-size: 34px;
      line-height: 1.1;

      font-weight: 850;
      letter-spacing: -1px;
    }

    .subtitle {
      margin-top: 7px;

      color: var(--muted);
      font-size: 14px;
    }

    .current-period {
      margin-top: 12px;

      font-size: 25px;
      font-weight: 850;
    }

    .status {
      min-height: 18px;
      margin-top: 7px;

      font-size: 12px;
      color: var(--muted);
    }

    .status.error {
      color: var(--danger);
    }

    /* RANKING */

    .ranking {
      display: grid;
      gap: 9px;

      margin-top: 15px;
    }

    .rank-card {
      display: grid;

      grid-template-columns:
        44px
        minmax(150px, 1.2fr)
        minmax(220px, 4fr)
        auto;

      align-items: center;

      min-height: 66px;

      padding: 10px 15px;

      border:
        1px solid
        var(--border);

      border-radius: 17px;

      background:
        linear-gradient(
          90deg,
          rgba(30, 45, 74, 0.94),
          rgba(15, 26, 47, 0.92)
        );

      transition:
        transform 0.15s ease,
        border-color 0.15s ease;
    }

    .rank-card:hover {
      transform: translateY(-1px);
    }

    .rank-card.first {
      border-color:
        rgba(246, 198, 38, 0.75);
    }

    .rank-card.second {
      border-color:
        rgba(186, 196, 209, 0.55);
    }

    .rank-card.third {
      border-color:
        rgba(207, 123, 48, 0.7);
    }

    .place {
      text-align: center;
      font-size: 20px;
    }

    .person-name {
      min-width: 0;

      overflow: hidden;

      white-space: nowrap;
      text-overflow: ellipsis;

      font-size: 16px;
      font-weight: 780;
    }

    .percent {
      padding-left: 13px;

      white-space: nowrap;

      font-size: 21px;
      line-height: 1;

      font-weight: 850;
      color: var(--blue);
    }

    .percent.green {
      color: var(--green);
    }

    /* PROGRESS */

    .bar-wrap {
      padding: 0 7px;
    }

    .bar {
      position: relative;

      height: 11px;

      overflow: hidden;

      border-radius: 999px;

      background:
        rgba(255, 255, 255, 0.08);
    }

    /*
      Деления каждые 5%
    */

    .bar::after {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      background:
        repeating-linear-gradient(
          to right,
          transparent 0,
          transparent calc(5% - 1px),
          rgba(255, 255, 255, 0.18)
            calc(5% - 1px),
          rgba(255, 255, 255, 0.18)
            5%
        );
    }

    .bar-fill {
      position: absolute;

      left: 0;
      top: 0;
      bottom: 0;

      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          #37bff5,
          #31d879
        );

      transition:
        width 0.25s ease;
    }

    /* PERIODS */

    .period-panel {
      margin-top: 19px;
      padding-top: 17px;

      border-top:
        1px solid
        rgba(255, 255, 255, 0.08);

      text-align: center;
    }

    .period-label {
      margin-bottom: 10px;

      font-size: 12px;
      color: var(--muted);
    }

    .years,
    .months {
      display: flex;

      justify-content: center;
      flex-wrap: wrap;

      gap: 7px;
    }

    .months {
      margin-top: 9px;
    }

    .period-button {
      appearance: none;

      padding: 9px 14px;

      border:
        1px solid
        rgba(255, 255, 255, 0.13);

      border-radius: 11px;

      color: var(--text);

      background:
        rgba(255, 255, 255, 0.07);

      cursor: pointer;

      transition:
        transform 0.15s ease,
        background 0.15s ease,
        border-color 0.15s ease;
    }

    .period-button:hover {
      transform: translateY(-1px);

      background:
        rgba(255, 255, 255, 0.11);
    }

    .period-button.active {
      border-color: var(--blue);

      background:
        rgba(55, 191, 245, 0.17);

      box-shadow:
        inset 0 0 0 1px
        rgba(55, 191, 245, 0.12);
    }

    /* EXTRA */

    .extra-actions {
      display: flex;

      justify-content: center;
      flex-wrap: wrap;

      gap: 8px;

      margin-top: 20px;
    }

    .secondary-btn {
      padding: 9px 15px;

      border:
        1px solid
        rgba(255, 255, 255, 0.13);

      border-radius: 11px;

      color: var(--text);

      background:
        rgba(255, 255, 255, 0.06);

      cursor: pointer;
    }

    .secondary-btn:hover {
      background:
        rgba(255, 255, 255, 0.1);
    }

    /* SECTIONS */

    .section {
      display: none;

      margin-top: 22px;

      padding: 17px;

      border:
        1px solid
        rgba(255, 255, 255, 0.1);

      border-radius: 18px;

      background:
        rgba(12, 23, 43, 0.82);
    }

    .section.visible {
      display: block;
    }

    .section-title {
      margin: 0 0 13px;

      font-size: 20px;
      font-weight: 800;
    }

    /* HISTORY */

    .person-select {
      width: 100%;

      padding: 11px 12px;

      outline: none;

      border:
        1px solid
        rgba(255, 255, 255, 0.13);

      border-radius: 11px;

      color: var(--text);

      background: #15213b;
    }

    .history-list {
      display: grid;
      gap: 7px;

      margin-top: 13px;
    }

    .history-row {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 14px;

      padding: 9px 12px;

      border-radius: 11px;

      background:
        rgba(255, 255, 255, 0.05);
    }

    .history-period {
      color: #dbe4f7;
    }

    .history-percent {
      font-weight: 850;
      color: var(--blue);
    }

    .history-percent.green {
      color: var(--green);
    }

    /* COMPARE */

    .compare-options {
      display: flex;
      flex-wrap: wrap;

      gap: 8px;

      margin-bottom: 17px;
    }

    .compare-option {
      display: flex;

      align-items: center;

      gap: 7px;

      padding: 8px 10px;

      border-radius: 10px;

      background:
        rgba(255, 255, 255, 0.05);

      cursor: pointer;
    }

    .chart-wrap {
      overflow-x: auto;
    }

    #compareChart {
      min-width: 720px;
    }

    /* LOADER */

    .loader {
      width: 32px;
      height: 32px;

      margin: 35px auto;

      border:
        3px solid
        rgba(255, 255, 255, 0.14);

      border-top-color:
        var(--blue);

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .empty {
      padding: 30px 15px;

      text-align: center;

      color: var(--muted);
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .page {
        padding:
          17px
          10px
          40px;
      }

      .title {
        font-size: 28px;
      }

      .current-period {
        font-size: 21px;
      }

      .rank-card {
        grid-template-columns:
          34px
          1fr
          auto;

        grid-template-areas:
          "place name percent"
          ". bar bar";

        gap: 8px;

        padding: 10px 12px;
      }

      .place {
        grid-area: place;
      }

      .person-name {
        grid-area: name;
      }

      .percent {
        grid-area: percent;

        padding-left: 5px;

        font-size: 18px;
      }

      .bar-wrap {
        grid-area: bar;

        padding: 0 0 2px;
      }

      .period-button {
        padding: 8px 10px;

        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="container">

      <header class="header">

        <h1 class="title">
          🏆 Рейтинг команды
        </h1>

        <div class="subtitle">
          Актуальные результаты
        </div>

        <div
          class="current-period"
          id="currentPeriod">
          —
        </div>

        <div
          class="status"
          id="status">
        </div>

      </header>


      <section
        class="ranking"
        id="ranking">
      </section>


      <section class="period-panel">

        <div class="period-label">
          Выберите год и месяц
        </div>

        <div
          class="years"
          id="years">
        </div>

        <div
          class="months"
          id="months">
        </div>

      </section>


      <div class="extra-actions">

        <button
          type="button"
          class="secondary-btn"
          id="historyBtn">
          История участника
        </button>

        <button
          type="button"
          class="secondary-btn"
          id="compareBtn">
          Сравнение
        </button>

      </div>


      <section
        class="section"
        id="historySection">

        <h2 class="section-title">
          История участника
        </h2>

        <select
          class="person-select"
          id="historyPerson">
        </select>

        <div
          class="history-list"
          id="historyList">
        </div>

      </section>


      <section
        class="section"
        id="compareSection">

        <h2 class="section-title">
          Сравнение участников
        </h2>

        <div
          class="compare-options"
          id="compareOptions">
        </div>

        <div class="chart-wrap">

          <svg
            id="compareChart"
            width="100%"
            height="370"
            viewBox="0 0 900 370"
            preserveAspectRatio="none">
          </svg>

        </div>

      </section>

    </div>

  </main>


  <script>

    /* =====================================================
       API
       ===================================================== */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbwYcG1OIZ_y2E3OZQw8oH0IuDMyk06lxL41oM6K1TtXN0Noxa5bV7kC_hsWOXTsTde_IA/exec";


    const MONTH_NAMES = [
      "Январь",
      "Февраль",
      "Март",
      "Апрель",
      "Май",
      "Июнь",
      "Июль",
      "Август",
      "Сентябрь",
      "Октябрь",
      "Ноябрь",
      "Декабрь"
    ];


    /* =====================================================
       STATE
       ===================================================== */

    const state = {

      periods: [],

      selectedYear: null,

      selectedPeriod: null,

      periodsLoaded: false,

      rankingRequestId: 0,

      historyData: null,

      historyLoadedAt: 0,

      historyLoading: false,

      selectedComparePeople:
        new Set()
    };


    /* =====================================================
       DOM
       ===================================================== */

    const rankingEl =
      document.getElementById(
        "ranking"
      );

    const yearsEl =
      document.getElementById(
        "years"
      );

    const monthsEl =
      document.getElementById(
        "months"
      );

    const currentPeriodEl =
      document.getElementById(
        "currentPeriod"
      );

    const statusEl =
      document.getElementById(
        "status"
      );

    const historyBtn =
      document.getElementById(
        "historyBtn"
      );

    const compareBtn =
      document.getElementById(
        "compareBtn"
      );

    const historySection =
      document.getElementById(
        "historySection"
      );

    const compareSection =
      document.getElementById(
        "compareSection"
      );

    const historyPersonEl =
      document.getElementById(
        "historyPerson"
      );

    const historyListEl =
      document.getElementById(
        "historyList"
      );

    const compareOptionsEl =
      document.getElementById(
        "compareOptions"
      );

    const compareChartEl =
      document.getElementById(
        "compareChart"
      );


    /* =====================================================
       API FETCH
       ===================================================== */

    async function api(params) {

      const url =
        new URL(API_URL);


      Object
        .entries(params)
        .forEach(
          ([key, value]) => {

            url.searchParams.set(
              key,
              value
            );
          }
        );


      /*
        Защита от кеша браузера.
      */

      url.searchParams.set(
        "_",
        Date.now()
      );


      const response =
        await fetch(
          url.toString(),
          {
            cache: "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );
      }


      const data =
        await response.json();


      if (
        data &&
        data.ok === false
      ) {

        throw new Error(
          data.error ||
          "Ошибка API"
        );
      }


      return data;
    }


    /* =====================================================
       INIT
       ===================================================== */

    async function init() {

      showRankingLoader();

      setStatus(
        "Загрузка…"
      );


      try {

        await refreshPeriods(
          true
        );


        if (
          state.selectedPeriod
        ) {

          await loadRanking(
            state.selectedPeriod
          );
        }


      } catch (error) {

        showMainError(
          error
        );
      }


      /*
        Проверяем появление
        новых месяцев раз в минуту.
      */

      setInterval(
        () => {

          refreshPeriods(
            false
          ).catch(
            console.error
          );

        },
        60000
      );


      /*
        Обновляем выбранный рейтинг
        раз в 20 секунд.
      */

      setInterval(
        () => {

          if (
            document.hidden ||
            !state.selectedPeriod
          ) {
            return;
          }


          loadRanking(
            state.selectedPeriod,
            true
          );

        },
        20000
      );
    }


    /* =====================================================
       PERIODS
       ===================================================== */

    async function refreshPeriods(
      initial
    ) {

      const data =
        await api({
          mode: "months"
        });


      /*
        Поддерживаем оба формата API:
        months
        periods
      */

      let periods = [];


      if (
        Array.isArray(
          data.months
        )
      ) {

        periods =
          data.months;

      } else if (
        Array.isArray(
          data.periods
        )
      ) {

        periods =
          data.periods;
      }


      state.periods =
        periods
          .map(
            item => ({
              key:
                String(
                  item.key || ""
                ),

              year:
                Number(
                  item.year
                ),

              month:
                Number(
                  item.month
                ),

              sort:
                Number(
                  item.sort ||
                  (
                    Number(item.year) *
                    100 +
                    Number(item.month)
                  )
                ),

              label:
                item.label ||
                makePeriodLabel(
                  Number(item.month),
                  Number(item.year)
                )
            })
          )
          .filter(
            item =>
              item.key &&
              Number.isFinite(
                item.year
              ) &&
              Number.isFinite(
                item.month
              ) &&
              item.month >= 1 &&
              item.month <= 12
          )
          .sort(
            (a, b) =>
              a.sort -
              b.sort
          );


      if (
        state.periods.length === 0
      ) {

        state.selectedYear =
          null;

        state.selectedPeriod =
          null;

        renderPeriodControls();

        showEmptyRanking(
          "Месяцы пока не найдены"
        );

        return;
      }


      /*
        Первый запуск.
      */

      if (
        initial ||
        !state.periodsLoaded
      ) {

        const start =
          chooseInitialPeriod(
            state.periods
          );


        state.selectedYear =
          start.year;

        state.selectedPeriod =
          start.key;

        state.periodsLoaded =
          true;
      }


      /*
        Если выбранный месяц
        вдруг исчез из API.
      */

      else {

        const exists =
          state.periods.some(
            item =>
              item.key ===
              state.selectedPeriod
          );


        if (!exists) {

          const sameYear =
            getPeriodsForYear(
              state.selectedYear
            );


          if (
            sameYear.length
          ) {

            const latest =
              sameYear[
                sameYear.length - 1
              ];

            state.selectedPeriod =
              latest.key;

          } else {

            const latest =
              state.periods[
                state.periods.length - 1
              ];

            state.selectedYear =
              latest.year;

            state.selectedPeriod =
              latest.key;
          }
        }
      }


      renderPeriodControls();
    }


    /* =====================================================
       INITIAL PERIOD
       ===================================================== */

    function chooseInitialPeriod(
      periods
    ) {

      const now =
        new Date();


      const current =
        periods.find(
          item =>
            item.year ===
              now.getFullYear() &&
            item.month ===
              now.getMonth() + 1
        );


      if (current) {
        return current;
      }


      return periods[
        periods.length - 1
      ];
    }


    /* =====================================================
       PERIOD UI
       ===================================================== */

    function renderPeriodControls() {

      renderYears();

      renderMonths();

      renderCurrentPeriodLabel();
    }


    function renderYears() {

      yearsEl.innerHTML =
        "";


      const years =
        [
          ...new Set(
            state.periods.map(
              item =>
                item.year
            )
          )
        ]
          .sort(
            (a, b) =>
              b - a
          );


      years.forEach(
        year => {

          const button =
            document.createElement(
              "button"
            );


          button.type =
            "button";

          button.className =
            "period-button";

          button.textContent =
            String(year);


          if (
            year ===
            state.selectedYear
          ) {

            button.classList.add(
              "active"
            );
          }


          button.addEventListener(
            "click",
            () => {

              selectYear(
                year
              );
            }
          );


          yearsEl.appendChild(
            button
          );
        }
      );
    }


    function selectYear(year) {

      const oldPeriod =
        getPeriodByKey(
          state.selectedPeriod
        );


      state.selectedYear =
        Number(year);


      const available =
        getPeriodsForYear(
          state.selectedYear
        );


      if (
        available.length === 0
      ) {
        return;
      }


      let next = null;


      /*
        Стараемся оставить
        тот же месяц.
      */

      if (oldPeriod) {

        next =
          available.find(
            item =>
              item.month ===
              oldPeriod.month
          );
      }


      /*
        Если такого месяца нет —
        выбираем последний существующий.
      */

      if (!next) {

        next =
          available[
            available.length - 1
          ];
      }


      state.selectedPeriod =
        next.key;


      renderPeriodControls();


      loadRanking(
        next.key
      );
    }


    /*
      ВАЖНО:

      Показываем только
      реально существующие месяцы.

      Неактивных будущих блоков
      здесь вообще нет.
    */

    function renderMonths() {

      monthsEl.innerHTML =
        "";


      if (
        !state.selectedYear
      ) {
        return;
      }


      const periods =
        getPeriodsForYear(
          state.selectedYear
        );


      periods.forEach(
        period => {

          const button =
            document.createElement(
              "button"
            );


          button.type =
            "button";

          button.className =
            "period-button";


          button.textContent =
            MONTH_NAMES[
              period.month - 1
            ];


          if (
            period.key ===
            state.selectedPeriod
          ) {

            button.classList.add(
              "active"
            );
          }


          button.addEventListener(
            "click",
            () => {

              state.selectedPeriod =
                period.key;


              renderPeriodControls();


              loadRanking(
                period.key
              );
            }
          );


          monthsEl.appendChild(
            button
          );
        }
      );
    }


    function getPeriodsForYear(
      year
    ) {

      return state.periods
        .filter(
          item =>
            item.year ===
            Number(year)
        )
        .sort(
          (a, b) =>
            a.month -
            b.month
        );
    }


    function getPeriodByKey(
      key
    ) {

      if (!key) {
        return null;
      }


      return (
        state.periods.find(
          item =>
            item.key ===
            key
        ) ||
        null
      );
    }


    function renderCurrentPeriodLabel() {

      const period =
        getPeriodByKey(
          state.selectedPeriod
        );


      currentPeriodEl.textContent =
        period
          ? period.label
          : "—";
    }


    function makePeriodLabel(
      month,
      year
    ) {

      if (
        !month ||
        !year
      ) {
        return "—";
      }


      return (
        MONTH_NAMES[
          month - 1
        ] +
        " " +
        year
      );
    }


    /* =====================================================
       RANKING
       ===================================================== */

    async function loadRanking(
      period,
      silent = false
    ) {

      if (!period) {
        return;
      }


      const requestId =
        ++state.rankingRequestId;


      if (!silent) {

        showRankingLoader();

        setStatus(
          "Загрузка…"
        );
      }


      try {

        const data =
          await api({
            mode: "month",
            period: period
          });


        if (
          requestId !==
          state.rankingRequestId
        ) {
          return;
        }


        if (
          period !==
          state.selectedPeriod
        ) {
          return;
        }


        /*
          Поддерживаем:
          people
          ranking
        */

        const source =
          Array.isArray(
            data.people
          )
            ? data.people
            : Array.isArray(
                data.ranking
              )
              ? data.ranking
              : [];


        const people =
          sanitizePeople(
            source
          );


        renderRanking(
          people
        );


        setStatus(
          "Данные обновлены"
        );


      } catch (error) {

        if (
          requestId !==
          state.rankingRequestId
        ) {
          return;
        }


        if (!silent) {

          showMainError(
            error
          );
        }
      }
    }


    function sanitizePeople(
      people
    ) {

      if (
        !Array.isArray(
          people
        )
      ) {
        return [];
      }


      return people
        .map(
          item => {

            const percent =
              Number(
                item.percent
              );


            return {
              name:
                String(
                  item.name || ""
                ).trim(),

              percent:
                percent
            };
          }
        )
        .filter(
          item =>
            item.name &&
            Number.isFinite(
              item.percent
            ) &&
            item.percent >= 0 &&
            item.percent <= 100
        )
        .sort(
          (a, b) =>
            b.percent -
            a.percent
        );
    }


    function renderRanking(
      people
    ) {

      rankingEl.innerHTML =
        "";


      if (
        people.length === 0
      ) {

        showEmptyRanking(
          "За этот месяц статистика не найдена"
        );

        return;
      }


      people.forEach(
        (person, index) => {

          const card =
            document.createElement(
              "article"
            );


          card.className =
            "rank-card";


          if (index === 0) {
            card.classList.add(
              "first"
            );
          }

          if (index === 1) {
            card.classList.add(
              "second"
            );
          }

          if (index === 2) {
            card.classList.add(
              "third"
            );
          }


          const percent =
            clampPercent(
              person.percent
            );


          const percentClass =
            percent >= 90
              ? "percent green"
              : "percent";


          card.innerHTML = `

            <div class="place">
              ${getPlaceIcon(index)}
            </div>

            <div
              class="person-name"
              title="${escapeHtml(person.name)}">
              ${escapeHtml(person.name)}
            </div>

            <div class="bar-wrap">

              <div class="bar">

                <div
                  class="bar-fill"
                  style="width:${percent}%">
                </div>

              </div>

            </div>

            <div class="${percentClass}">
              ${formatPercent(percent)}
            </div>
          `;


          rankingEl.appendChild(
            card
          );
        }
      );
    }


    function getPlaceIcon(
      index
    ) {

      if (index === 0) {
        return "🥇";
      }

      if (index === 1) {
        return "🥈";
      }

      if (index === 2) {
        return "🥉";
      }


      return String(
        index + 1
      );
    }


    /* =====================================================
       HISTORY DATA
       ===================================================== */

    async function ensureHistoryData() {

      if (
        state.historyData &&
        Date.now() -
          state.historyLoadedAt <
          60000
      ) {
        return;
      }


      if (
        state.historyLoading
      ) {
        return;
      }


      state.historyLoading =
        true;


      try {

        const data =
          await api({
            mode: "all"
          });


        state.historyData =
          normalizeHistoryData(
            data
          );


        state.historyLoadedAt =
          Date.now();


      } finally {

        state.historyLoading =
          false;
      }
    }


    /*
      Приводим новый Apps Script
      к удобной структуре:

      {
        people: {
          "Имя": [...]
        },
        periods: [...]
      }
    */

    function normalizeHistoryData(
      data
    ) {

      const result = {
        people: {},
        periods: []
      };


      const periodMap =
        new Map();


      /*
        Новый формат:
        people = [
          {
            name,
            history:[]
          }
        ]
      */

      if (
        Array.isArray(
          data.people
        )
      ) {

        data.people.forEach(
          person => {

            const name =
              String(
                person.name || ""
              ).trim();


            if (!name) {
              return;
            }


            const history =
              Array.isArray(
                person.history
              )
                ? person.history
                : [];


            result.people[name] =
              normalizeHistoryRows(
                history
              );


            result.people[name]
              .forEach(
                row => {

                  periodMap.set(
                    row.period,
                    {
                      key:
                        row.period,

                      year:
                        row.year,

                      month:
                        row.month,

                      sort:
                        row.sort
                    }
                  );
                }
              );
          }
        );
      }


      /*
        Поддержка старого формата:
        people = {
          Имя:[...]
        }
      */

      else if (
        data.people &&
        typeof data.people ===
          "object"
      ) {

        Object
          .entries(
            data.people
          )
          .forEach(
            ([name, rows]) => {

              result.people[name] =
                normalizeHistoryRows(
                  rows
                );


              result.people[name]
                .forEach(
                  row => {

                    periodMap.set(
                      row.period,
                      {
                        key:
                          row.period,

                        year:
                          row.year,

                        month:
                          row.month,

                        sort:
                          row.sort
                      }
                    );
                  }
                );
            }
          );
      }


      result.periods =
        [
          ...periodMap.values()
        ]
          .sort(
            (a, b) =>
              a.sort -
              b.sort
          );


      return result;
    }


    function normalizeHistoryRows(
      rows
    ) {

      if (
        !Array.isArray(
          rows
        )
      ) {
        return [];
      }


      return rows
        .map(
          row => {

            const year =
              Number(
                row.year
              );

            const month =
              Number(
                row.month
              );

            const percent =
              Number(
                row.percent
              );


            return {
              period:
                String(
                  row.period || ""
                ),

              year:
                year,

              month:
                month,

              sort:
                Number(
                  row.sort ||
                  (
                    year *
                    100 +
                    month
                  )
                ),

              percent:
                percent,

              label:
                row.label ||
                makePeriodLabel(
                  month,
                  year
                )
            };
          }
        )
        .filter(
          row =>
            row.period &&
            Number.isFinite(
              row.year
            ) &&
            Number.isFinite(
              row.month
            ) &&
            isSafePercent(
              row.percent
            )
        )
        .sort(
          (a, b) =>
            a.sort -
            b.sort
        );
    }


    /* =====================================================
       HISTORY UI
       ===================================================== */

    historyBtn.addEventListener(
      "click",
      async () => {

        const opening =
          !historySection
            .classList
            .contains(
              "visible"
            );


        historySection
          .classList
          .toggle(
            "visible"
          );


        if (!opening) {
          return;
        }


        compareSection
          .classList
          .remove(
            "visible"
          );


        historyListEl.innerHTML =
          '<div class="loader"></div>';


        try {

          await ensureHistoryData();

          renderHistoryPeople();


        } catch (error) {

          historyListEl.innerHTML =
            '<div class="empty">Не удалось загрузить историю</div>';
        }
      }
    );


    function renderHistoryPeople() {

      historyPersonEl.innerHTML =
        "";

      historyListEl.innerHTML =
        "";


      if (
        !state.historyData ||
        !state.historyData.people
      ) {

        showHistoryEmpty();

        return;
      }


      const names =
        Object.keys(
          state.historyData.people
        );


      if (
        names.length === 0
      ) {

        showHistoryEmpty();

        return;
      }


      names.forEach(
        name => {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            name;

          option.textContent =
            name;


          historyPersonEl.appendChild(
            option
          );
        }
      );


      historyPersonEl.onchange =
        () => {

          renderPersonHistory(
            historyPersonEl.value
          );
        };


      renderPersonHistory(
        names[0]
      );
    }


    function renderPersonHistory(
      name
    ) {

      historyListEl.innerHTML =
        "";


      const rows =
        state.historyData &&
        state.historyData.people &&
        Array.isArray(
          state.historyData.people[
            name
          ]
        )
          ? state.historyData.people[
              name
            ]
          : [];


      if (
        rows.length === 0
      ) {

        showHistoryEmpty();

        return;
      }


      rows
        .slice()
        .sort(
          (a, b) =>
            b.sort -
            a.sort
        )
        .forEach(
          item => {

            const percent =
              Number(
                item.percent
              );


            const row =
              document.createElement(
                "div"
              );


            row.className =
              "history-row";


            row.innerHTML = `

              <span class="history-period">
                ${escapeHtml(item.label)}
              </span>

              <span class="${
                percent >= 90
                  ? "history-percent green"
                  : "history-percent"
              }">
                ${formatPercent(percent)}
              </span>
            `;


            historyListEl.appendChild(
              row
            );
          }
        );
    }


    function showHistoryEmpty() {

      historyListEl.innerHTML =
        '<div class="empty">История отсутствует</div>';
    }


    /* =====================================================
       COMPARISON
       ===================================================== */

    compareBtn.addEventListener(
      "click",
      async () => {

        const opening =
          !compareSection
            .classList
            .contains(
              "visible"
            );


        compareSection
          .classList
          .toggle(
            "visible"
          );


        if (!opening) {
          return;
        }


        historySection
          .classList
          .remove(
            "visible"
          );


        compareOptionsEl.innerHTML =
          '<div class="loader"></div>';


        try {

          await ensureHistoryData();

          renderCompareOptions();

          renderCompareChart();


        } catch (error) {

          compareOptionsEl.innerHTML =
            '<div class="empty">Не удалось загрузить данные</div>';
        }
      }
    );


    function renderCompareOptions() {

      compareOptionsEl.innerHTML =
        "";


      if (
        !state.historyData ||
        !state.historyData.people
      ) {
        return;
      }


      const names =
        Object.keys(
          state.historyData.people
        );


      names.forEach(
        name => {

          const label =
            document.createElement(
              "label"
            );


          label.className =
            "compare-option";


          const checkbox =
            document.createElement(
              "input"
            );


          checkbox.type =
            "checkbox";


          checkbox.checked =
            state
              .selectedComparePeople
              .has(name);


          checkbox.addEventListener(
            "change",
            () => {

              if (
                checkbox.checked
              ) {

                state
                  .selectedComparePeople
                  .add(name);

              } else {

                state
                  .selectedComparePeople
                  .delete(name);
              }


              renderCompareChart();
            }
          );


          const span =
            document.createElement(
              "span"
            );


          span.textContent =
            name;


          label.appendChild(
            checkbox
          );

          label.appendChild(
            span
          );


          compareOptionsEl.appendChild(
            label
          );
        }
      );
    }


    /* =====================================================
       SVG CHART
       ===================================================== */

    function renderCompareChart() {

      const svg =
        compareChartEl;


      svg.innerHTML =
        "";


      if (
        !state.historyData
      ) {
        return;
      }


      const selected =
        [
          ...state.selectedComparePeople
        ];


      if (
        selected.length === 0
      ) {

        svg.innerHTML = `

          <text
            x="450"
            y="185"
            text-anchor="middle"
            fill="#8e9bb7"
            font-size="15">
            Выберите участников для сравнения
          </text>
        `;

        return;
      }


      const periods =
        Array.isArray(
          state.historyData.periods
        )
          ? state.historyData.periods
          : [];


      if (
        periods.length === 0
      ) {
        return;
      }


      const width =
        900;

      const height =
        370;

      const left =
        55;

      const right =
        22;

      const top =
        30;

      const bottom =
        55;

      const chartWidth =
        width -
        left -
        right;

      const chartHeight =
        height -
        top -
        bottom;


      /*
        Масштаб 70–100%
      */

      const minY =
        70;

      const maxY =
        100;


      /*
        Горизонтальные линии
        каждые 5%.
      */

      for (
        let value = 70;
        value <= 100;
        value += 5
      ) {

        const y =
          top +
          chartHeight *
          (
            1 -
            (
              value -
              minY
            ) /
            (
              maxY -
              minY
            )
          );


        addSvgLine(
          svg,
          left,
          y,
          width - right,
          y,
          "rgba(255,255,255,.09)"
        );


        addSvgText(
          svg,
          46,
          y + 4,
          value + "%",
          "#8e9bb7",
          "end",
          11
        );
      }


      /*
        Подписи месяцев.
      */

      periods.forEach(
        (period, index) => {

          if (
            periods.length > 14 &&
            index % 2 !== 0 &&
            index !==
            periods.length - 1
          ) {
            return;
          }


          const x =
            getChartX(
              index,
              periods.length,
              left,
              chartWidth
            );


          const label =
            MONTH_NAMES[
              period.month - 1
            ].slice(0, 3)
            +
            " "
            +
            String(
              period.year
            ).slice(-2);


          addSvgText(
            svg,
            x,
            height - 18,
            label,
            "#8e9bb7",
            "middle",
            10
          );
        }
      );


      selected.forEach(
        (name, seriesIndex) => {

          const rows =
            state.historyData.people[
              name
            ] || [];


          const map =
            new Map();


          rows.forEach(
            row => {

              if (
                isSafePercent(
                  row.percent
                )
              ) {

                map.set(
                  row.period,
                  Number(
                    row.percent
                  )
                );
              }
            }
          );


          const hue =
            (
              seriesIndex *
              71 +
              188
            ) %
            360;


          const color =
            `hsl(${hue} 75% 62%)`;


          let path =
            "";

          let started =
            false;


          periods.forEach(
            (period, index) => {

              const value =
                map.get(
                  period.key
                );


              if (
                value === undefined
              ) {

                started =
                  false;

                return;
              }


              const x =
                getChartX(
                  index,
                  periods.length,
                  left,
                  chartWidth
                );


              const clamped =
                Math.max(
                  minY,
                  Math.min(
                    maxY,
                    value
                  )
                );


              const y =
                top +
                chartHeight *
                (
                  1 -
                  (
                    clamped -
                    minY
                  ) /
                  (
                    maxY -
                    minY
                  )
                );


              if (!started) {

                path +=
                  `M ${x} ${y} `;

                started =
                  true;

              } else {

                path +=
                  `L ${x} ${y} `;
              }


              const circle =
                document.createElementNS(
                  "http://www.w3.org/2000/svg",
                  "circle"
                );


              circle.setAttribute(
                "cx",
                x
              );

              circle.setAttribute(
                "cy",
                y
              );

              circle.setAttribute(
                "r",
                "3.5"
              );

              circle.setAttribute(
                "fill",
                color
              );


              svg.appendChild(
                circle
              );
            }
          );


          const pathEl =
            document.createElementNS(
              "http://www.w3.org/2000/svg",
              "path"
            );


          pathEl.setAttribute(
            "d",
            path
          );

          pathEl.setAttribute(
            "fill",
            "none"
          );

          pathEl.setAttribute(
            "stroke",
            color
          );

          pathEl.setAttribute(
            "stroke-width",
            "2.5"
          );

          pathEl.setAttribute(
            "stroke-linecap",
            "round"
          );

          pathEl.setAttribute(
            "stroke-linejoin",
            "round"
          );


          svg.appendChild(
            pathEl
          );


          addSvgText(
            svg,
            left + 8,
            17 +
            seriesIndex * 16,
            name,
            color,
            "start",
            10
          );
        }
      );
    }


    function getChartX(
      index,
      count,
      left,
      width
    ) {

      if (
        count <= 1
      ) {

        return (
          left +
          width / 2
        );
      }


      return (
        left +
        width *
        index /
        (
          count - 1
        )
      );
    }


    function addSvgLine(
      svg,
      x1,
      y1,
      x2,
      y2,
      stroke
    ) {

      const line =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "line"
        );


      line.setAttribute(
        "x1",
        x1
      );

      line.setAttribute(
        "y1",
        y1
      );

      line.setAttribute(
        "x2",
        x2
      );

      line.setAttribute(
        "y2",
        y2
      );

      line.setAttribute(
        "stroke",
        stroke
      );

      line.setAttribute(
        "stroke-width",
        "1"
      );


      svg.appendChild(
        line
      );
    }


    function addSvgText(
      svg,
      x,
      y,
      text,
      fill,
      anchor,
      size
    ) {

      const el =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "text"
        );


      el.setAttribute(
        "x",
        x
      );

      el.setAttribute(
        "y",
        y
      );

      el.setAttribute(
        "fill",
        fill
      );

      el.setAttribute(
        "text-anchor",
        anchor
      );

      el.setAttribute(
        "font-size",
        size
      );


      el.textContent =
        text;


      svg.appendChild(
        el
      );
    }


    /* =====================================================
       HELPERS
       ===================================================== */

    function showRankingLoader() {

      rankingEl.innerHTML =
        '<div class="loader"></div>';
    }


    function showEmptyRanking(
      text
    ) {

      rankingEl.innerHTML =
        `<div class="empty">${escapeHtml(text)}</div>`;
    }


    function setStatus(
      text,
      error = false
    ) {

      statusEl.textContent =
        text || "";


      statusEl
        .classList
        .toggle(
          "error",
          Boolean(error)
        );
    }


    function showMainError(
      error
    ) {

      console.error(
        error
      );


      setStatus(
        "Ошибка загрузки данных",
        true
      );


      showEmptyRanking(
        "Не удалось получить данные"
      );
    }


    function isSafePercent(
      value
    ) {

      const number =
        Number(value);


      return (
        Number.isFinite(
          number
        ) &&
        number >= 0 &&
        number <= 100
      );
    }


    function clampPercent(
      value
    ) {

      const number =
        Number(value);


      if (
        !Number.isFinite(
          number
        )
      ) {
        return 0;
      }


      return Math.max(
        0,
        Math.min(
          100,
          number
        )
      );
    }


    function formatPercent(
      value
    ) {

      const number =
        Number(value);


      if (
        !isSafePercent(
          number
        )
      ) {
        return "—";
      }


      return (
        number
          .toFixed(1)
          .replace(
            ".",
            ","
          )
        +
        "%"
      );
    }


    function escapeHtml(
      value
    ) {

      return String(
        value || ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }


    /* =====================================================
       PAGE VISIBILITY
       ===================================================== */

    document.addEventListener(
      "visibilitychange",
      () => {

        if (
          !document.hidden &&
          state.selectedPeriod
        ) {

          loadRanking(
            state.selectedPeriod,
            true
          );
        }
      }
    );


    /* =====================================================
       START
       ===================================================== */

    init();

  </script>
