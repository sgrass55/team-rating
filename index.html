<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Статистика команды</title>


  <style>

    * {
      box-sizing: border-box;
    }


    :root {

      --bg: #050c18;

      --card:
        rgba(
          22,
          36,
          63,
          0.92
        );

      --border:
        rgba(
          255,
          255,
          255,
          0.11
        );

      --text: #f5f7ff;

      --muted: #8e9bb7;

      --blue: #37bff5;

      --green: #31d879;

      --gold: #f6c626;

      --silver: #bac4d1;

      --bronze: #cf7b30;

      --danger: #ff6174;

    }



    html,
    body {

      margin: 0;

      min-height: 100%;

    }



    body {

      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      color:
        var(--text);

      background:
        radial-gradient(
          circle at 50% 0%,
          #172959 0%,
          #0b162b 34%,
          #050c18 75%
        );

      background-attachment:
        fixed;

    }



    body.modal-open {

      overflow: hidden;

    }



    button,
    input {

      font: inherit;

    }



    button {

      -webkit-tap-highlight-color:
        transparent;

    }



    /* =====================================================
       ОСНОВНАЯ СТРАНИЦА
       ===================================================== */


    .page {

      min-height: 100vh;

      padding:
        24px
        16px
        60px;

    }



    .container {

      width:
        min(
          920px,
          100%
        );

      margin:
        0 auto;

    }



    /* =====================================================
       HEADER
       ===================================================== */


    .header {

      text-align:
        center;

      margin-bottom:
        18px;

    }



    .subtitle {

      color:
        var(--muted);

      font-size:
        14px;

    }



    .current-period {

      margin-top:
        8px;

      font-size:
        27px;

      line-height:
        1.2;

      font-weight:
        850;

      letter-spacing:
        -0.4px;

    }



    .status {

      min-height:
        0;

      margin-top:
        0;

      font-size:
        12px;

      color:
        var(--muted);

    }



    .status:not(:empty) {

      min-height:
        18px;

      margin-top:
        7px;

    }



    .status.error {

      color:
        var(--danger);

    }



    /* =====================================================
       РЕЙТИНГ
       ===================================================== */


    .ranking {

      display:
        grid;

      gap:
        9px;

      margin-top:
        16px;

    }



    .rank-card {

      display:
        grid;

      grid-template-columns:
        44px
        minmax(150px, 1.2fr)
        minmax(220px, 4fr)
        auto;

      align-items:
        center;

      min-height:
        66px;

      padding:
        10px
        15px;

      border:
        1px solid
        var(--border);

      border-radius:
        17px;

      background:
        linear-gradient(
          90deg,
          rgba(
            30,
            45,
            74,
            0.94
          ),
          rgba(
            15,
            26,
            47,
            0.92
          )
        );

      transition:
        transform .15s ease,
        border-color .15s ease;

    }



    .rank-card:hover {

      transform:
        translateY(-1px);

    }



    .rank-card.first {

      border-color:
        rgba(
          246,
          198,
          38,
          .75
        );

    }



    .rank-card.second {

      border-color:
        rgba(
          186,
          196,
          209,
          .55
        );

    }



    .rank-card.third {

      border-color:
        rgba(
          207,
          123,
          48,
          .72
        );

    }



    .place {

      text-align:
        center;

      font-size:
        20px;

    }



    .person-name {

      min-width:
        0;

      overflow:
        hidden;

      white-space:
        nowrap;

      text-overflow:
        ellipsis;

      font-size:
        16px;

      font-weight:
        780;

    }



    .percent {

      padding-left:
        13px;

      white-space:
        nowrap;

      font-size:
        21px;

      line-height:
        1;

      font-weight:
        850;

      color:
        var(--blue);

    }



    .percent.green {

      color:
        var(--green);

    }



    /* =====================================================
       ШКАЛА
       ===================================================== */


    .bar-wrap {

      position:
        relative;

      padding:
        12px
        7px;

      border-radius:
        12px;

      cursor:
        pointer;

      outline:
        none;

      transition:
        background .15s ease;

    }



    .bar-wrap:hover {

      background:
        rgba(
          255,
          255,
          255,
          .035
        );

    }



    .bar-wrap:focus-visible {

      box-shadow:
        0 0 0 2px
        rgba(
          55,
          191,
          245,
          .5
        );

    }



    .bar {

      position:
        relative;

      height:
        12px;

      overflow:
        hidden;

      border-radius:
        999px;

      background:
        rgba(
          255,
          255,
          255,
          .08
        );

    }



    /*
      Деления каждые 5%
    */

    .bar::after {

      content: "";

      position:
        absolute;

      inset:
        0;

      pointer-events:
        none;

      background:
        repeating-linear-gradient(
          to right,

          transparent 0,

          transparent
          calc(5% - 1px),

          rgba(
            255,
            255,
            255,
            .18
          )
          calc(5% - 1px),

          rgba(
            255,
            255,
            255,
            .18
          )
          5%
        );

    }



    .bar-fill {

      position:
        absolute;

      left:
        0;

      top:
        0;

      bottom:
        0;

      border-radius:
        inherit;

      background:
        linear-gradient(
          90deg,
          #37bff5,
          #31d879
        );

      transition:
        width .3s ease;

    }



    .bar-hint {

      position:
        absolute;

      left:
        50%;

      bottom:
        -1px;

      transform:
        translateX(-50%);

      opacity:
        0;

      pointer-events:
        none;

      white-space:
        nowrap;

      font-size:
        9px;

      color:
        var(--muted);

      transition:
        opacity .15s ease;

    }



    .bar-wrap:hover
    .bar-hint {

      opacity:
        1;

    }



    /* =====================================================
       ССЫЛКА АРХИВ
       ===================================================== */


    .archive-link-wrap {

      display:
        flex;

      justify-content:
        center;

      margin-top:
        24px;

    }



    .archive-link {

      appearance:
        none;

      padding:
        8px
        14px;

      border:
        0;

      background:
        transparent;

      color:
        #cbd7ed;

      cursor:
        pointer;

      font-size:
        14px;

      font-weight:
        700;

      text-decoration:
        underline;

      text-decoration-color:
        rgba(
          203,
          215,
          237,
          .45
        );

      text-underline-offset:
        4px;

    }



    .archive-link:hover {

      color:
        #ffffff;

    }



    /* =====================================================
       MODAL
       ===================================================== */


    .modal {

      display:
        none;

      position:
        fixed;

      inset:
        0;

      z-index:
        1000;

      padding:
        18px;

      background:
        rgba(
          2,
          8,
          18,
          .78
        );

      backdrop-filter:
        blur(10px);

      -webkit-backdrop-filter:
        blur(10px);

    }



    .modal.visible {

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

    }



    .modal-card {

      width:
        min(
          960px,
          100%
        );

      max-height:
        calc(
          100vh - 36px
        );

      overflow-y:
        auto;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          .13
        );

      border-radius:
        22px;

      background:
        linear-gradient(
          180deg,
          rgba(
            17,
            31,
            57,
            .99
          ),
          rgba(
            8,
            18,
            34,
            .99
          )
        );

      box-shadow:
        0 30px 100px
        rgba(
          0,
          0,
          0,
          .42
        );

    }



    .modal-head {

      position:
        sticky;

      top:
        0;

      z-index:
        3;

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      gap:
        14px;

      padding:
        17px
        18px;

      border-bottom:
        1px solid
        rgba(
          255,
          255,
          255,
          .08
        );

      background:
        rgba(
          12,
          25,
          46,
          .96
        );

      backdrop-filter:
        blur(12px);

      -webkit-backdrop-filter:
        blur(12px);

    }



    .modal-title {

      min-width:
        0;

      margin:
        0;

      overflow:
        hidden;

      white-space:
        nowrap;

      text-overflow:
        ellipsis;

      font-size:
        21px;

      font-weight:
        850;

    }



    .close-btn {

      flex:
        0 0 auto;

      width:
        36px;

      height:
        36px;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          .11
        );

      border-radius:
        50%;

      color:
        var(--text);

      background:
        rgba(
          255,
          255,
          255,
          .06
        );

      cursor:
        pointer;

      font-size:
        20px;

      line-height:
        1;

    }



    .close-btn:hover {

      background:
        rgba(
          255,
          255,
          255,
          .11
        );

    }



    .modal-body {

      padding:
        18px;

    }



    .panel {

      padding:
        15px;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          .09
        );

      border-radius:
        17px;

      background:
        rgba(
          255,
          255,
          255,
          .035
        );

    }



    .panel + .panel {

      margin-top:
        15px;

    }



    .section-title {

      margin:
        0
        0
        12px;

      font-size:
        18px;

      font-weight:
        820;

    }



    .subtle {

      color:
        var(--muted);

      font-size:
        12px;

    }



    /* =====================================================
       АРХИВ
       ===================================================== */


    .archive-years,
    .archive-months {

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        7px;

    }



    .archive-months {

      margin-top:
        10px;

    }



    .period-button {

      appearance:
        none;

      padding:
        9px
        13px;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          .12
        );

      border-radius:
        11px;

      color:
        var(--text);

      background:
        rgba(
          255,
          255,
          255,
          .06
        );

      cursor:
        pointer;

    }



    .period-button:hover {

      background:
        rgba(
          255,
          255,
          255,
          .10
        );

    }



    .period-button.active {

      border-color:
        var(--blue);

      background:
        rgba(
          55,
          191,
          245,
          .16
        );

    }



    .archive-ranking {

      margin-top:
        16px;

    }



    .archive-placeholder {

      padding:
        30px
        14px;

      text-align:
        center;

      color:
        var(--muted);

    }



    /* =====================================================
       ИСТОРИЯ
       ===================================================== */


    .history-list {

      display:
        grid;

      gap:
        7px;

    }



    .history-row {

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      gap:
        14px;

      padding:
        9px
        11px;

      border-radius:
        11px;

      background:
        rgba(
          255,
          255,
          255,
          .05
        );

    }



    .history-period {

      color:
        #dbe4f7;

    }



    .history-percent {

      font-weight:
        850;

      color:
        var(--blue);

    }



    .history-percent.green {

      color:
        var(--green);

    }



    /* =====================================================
       СРАВНЕНИЕ
       ===================================================== */


    .compare-options {

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        8px;

      margin-bottom:
        14px;

    }



    .compare-option {

      display:
        flex;

      align-items:
        center;

      gap:
        7px;

      padding:
        8px
        10px;

      border-radius:
        10px;

      background:
        rgba(
          255,
          255,
          255,
          .05
        );

      cursor:
        pointer;

    }



    .compare-option input {

      cursor:
        pointer;

    }



    .chart-wrap {

      width:
        100%;

      overflow-x:
        auto;

    }



    #compareChart {

      min-width:
        760px;

      display:
        block;

    }



    /* =====================================================
       LOADER
       ===================================================== */


    .loader {

      width:
        32px;

      height:
        32px;

      margin:
        35px
        auto;

      border:
        3px solid
        rgba(
          255,
          255,
          255,
          .14
        );

      border-top-color:
        var(--blue);

      border-radius:
        50%;

      animation:
        spin .8s linear infinite;

    }



    @keyframes spin {

      to {

        transform:
          rotate(360deg);

      }

    }



    .empty {

      padding:
        28px
        14px;

      text-align:
        center;

      color:
        var(--muted);

    }



    /* =====================================================
       MOBILE
       ===================================================== */


    @media
    (max-width: 700px) {


      .page {

        padding:
          17px
          10px
          40px;

      }



      .current-period {

        font-size:
          23px;

      }



      .rank-card {

        grid-template-columns:
          34px
          1fr
          auto;

        grid-template-areas:

          "place name percent"

          ". bar bar";

        gap:
          4px
          8px;

        padding:
          9px
          11px
          5px;

      }



      .place {

        grid-area:
          place;

      }



      .person-name {

        grid-area:
          name;

      }



      .percent {

        grid-area:
          percent;

        padding-left:
          4px;

        font-size:
          18px;

      }



      .bar-wrap {

        grid-area:
          bar;

        padding:
          10px
          0
          12px;

      }



      .bar-hint {

        display:
          none;

      }



      .modal {

        padding:
          8px;

      }



      .modal-card {

        max-height:
          calc(
            100vh - 16px
          );

        border-radius:
          17px;

      }



      .modal-head {

        padding:
          13px
          14px;

      }



      .modal-body {

        padding:
          13px;

      }



      .modal-title {

        font-size:
          18px;

      }

    }

  </style>

</head>



<body>


  <!-- =====================================================
       ГЛАВНАЯ
       ===================================================== -->


  <main class="page">

    <div class="container">


      <header class="header">


        <div class="subtitle">

          Текущий месяц

        </div>


        <div
          class="current-period"
          id="currentPeriod"
        >

          —

        </div>


        <div
          class="status"
          id="status"
        ></div>


      </header>



      <section
        class="ranking"
        id="ranking"
      ></section>



      <div class="archive-link-wrap">


        <button
          class="archive-link"
          id="archiveBtn"
          type="button"
        >

          Архив

        </button>


      </div>


    </div>

  </main>



  <!-- =====================================================
       АРХИВ
       ===================================================== -->


  <div
    class="modal"
    id="archiveModal"
    aria-hidden="true"
  >


    <div
      class="modal-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="archiveTitle"
    >


      <div class="modal-head">


        <h2
          class="modal-title"
          id="archiveTitle"
        >

          Архив

        </h2>


        <button
          class="close-btn"
          id="archiveClose"
          type="button"
          aria-label="Закрыть"
        >

          ×

        </button>


      </div>



      <div class="modal-body">


        <div class="panel">


          <h3 class="section-title">

            Выберите месяц

          </h3>


          <div
            class="archive-years"
            id="archiveYears"
          ></div>


          <div
            class="archive-months"
            id="archiveMonths"
          ></div>


        </div>



        <div
          class="archive-ranking"
          id="archiveRanking"
        >


          <div class="archive-placeholder">

            Выберите архивный месяц

          </div>


        </div>


      </div>


    </div>


  </div>



  <!-- =====================================================
       СТАТИСТИКА ЧЕЛОВЕКА
       ===================================================== -->


  <div
    class="modal"
    id="personModal"
    aria-hidden="true"
  >


    <div
      class="modal-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="personModalTitle"
    >


      <div class="modal-head">


        <h2
          class="modal-title"
          id="personModalTitle"
        >

          Статистика участника

        </h2>


        <button
          class="close-btn"
          id="personClose"
          type="button"
          aria-label="Закрыть"
        >

          ×

        </button>


      </div>



      <div class="modal-body">


        <div class="panel">


          <h3 class="section-title">

            История статистики

          </h3>


          <div
            class="history-list"
            id="historyList"
          ></div>


        </div>



        <div class="panel">


          <h3 class="section-title">

            Сравнение участников

          </h3>


          <div
            class="compare-options"
            id="compareOptions"
          ></div>


          <div class="chart-wrap">


            <svg
              id="compareChart"
              width="100%"
              height="390"
              viewBox="0 0 900 390"
              preserveAspectRatio="none"
            ></svg>


          </div>


        </div>


      </div>


    </div>


  </div>



  <script>


    /* =====================================================
       API
       ===================================================== */


    const API_URL =
      "https://script.google.com/macros/s/AKfycbwYcG1OIZ_y2E3OZQw8oH0IuDMyk06lxL41oM6K1TtXN0Noxa5bV7kC_hsWOXTsTde_IA/exec";



    const MONTH_KEYS = [

      "ЯНВАРЬ",

      "ФЕВРАЛЬ",

      "МАРТ",

      "АПРЕЛЬ",

      "МАЙ",

      "ИЮНЬ",

      "ИЮЛЬ",

      "АВГУСТ",

      "СЕНТЯБРЬ",

      "ОКТЯБРЬ",

      "НОЯБРЬ",

      "ДЕКАБРЬ"

    ];



    const MONTH_NAMES = [

      "Январь",

      "Февраль",

      "Март",

      "Апрель",

      "Май",

      "Июнь",

      "Июль",

      "Август",

      "Сентябрь",

      "Октябрь",

      "Ноябрь",

      "Декабрь"

    ];



    /* =====================================================
       STATE
       ===================================================== */


    const state = {


      currentPeriod:
        null,


      currentPeople:
        [],


      archivePeriods:
        null,


      archiveSelectedYear:
        null,


      archiveSelectedPeriod:
        null,


      archiveRankingCache:
        new Map(),


      historyData:
        null,


      historyLoading:
        null,


      selectedPerson:
        null,


      selectedComparePeople:
        new Set(),


      mainRequestId:
        0


    };



    /* =====================================================
       DOM
       ===================================================== */


    const rankingEl =
      document.getElementById(
        "ranking"
      );


    const currentPeriodEl =
      document.getElementById(
        "currentPeriod"
      );


    const statusEl =
      document.getElementById(
        "status"
      );


    const archiveBtn =
      document.getElementById(
        "archiveBtn"
      );


    const archiveModal =
      document.getElementById(
        "archiveModal"
      );


    const archiveClose =
      document.getElementById(
        "archiveClose"
      );


    const archiveYearsEl =
      document.getElementById(
        "archiveYears"
      );


    const archiveMonthsEl =
      document.getElementById(
        "archiveMonths"
      );


    const archiveRankingEl =
      document.getElementById(
        "archiveRanking"
      );


    const personModal =
      document.getElementById(
        "personModal"
      );


    const personClose =
      document.getElementById(
        "personClose"
      );


    const personModalTitle =
      document.getElementById(
        "personModalTitle"
      );


    const historyListEl =
      document.getElementById(
        "historyList"
      );


    const compareOptionsEl =
      document.getElementById(
        "compareOptions"
      );


    const compareChartEl =
      document.getElementById(
        "compareChart"
      );



    /* =====================================================
       API
       ===================================================== */


    async function api(
      params
    ) {


      const url =
        new URL(
          API_URL
        );


      Object.entries(
        params
      ).forEach(

        ([key, value]) => {


          url.searchParams.set(
            key,
            value
          );


        }

      );


      url.searchParams.set(
        "_",
        Date.now()
      );


      const response =
        await fetch(

          url.toString(),

          {

            cache:
              "no-store"

          }

        );


      if (
        !response.ok
      ) {


        throw new Error(

          "HTTP " +
          response.status

        );


      }


      const data =
        await response.json();


      if (
        data &&
        data.ok === false
      ) {


        throw new Error(

          data.error ||
          "Ошибка API"

        );


      }


      return data;


    }



    /* =====================================================
       ТЕКУЩИЙ МЕСЯЦ
       ===================================================== */


    function getCurrentPeriod() {


      const now =
        new Date();


      const monthIndex =
        now.getMonth();


      const year =
        now.getFullYear();


      return {


        key:
          MONTH_KEYS[
            monthIndex
          ] +
          year,


        month:
          monthIndex + 1,


        year:
          year,


        label:
          MONTH_NAMES[
            monthIndex
          ] +
          " " +
          year


      };


    }



    /* =====================================================
       ГЛАВНАЯ
       ===================================================== */


    async function loadCurrentMonth(
      silent = false
    ) {


      const period =
        getCurrentPeriod();


      const monthChanged =
        state.currentPeriod &&
        state.currentPeriod.key !==
          period.key;


      /*
        Если наступил новый месяц,
        старый список Архива
        сбрасывается.

        Благодаря этому
        предыдущий месяц
        появится в Архиве.
      */

      if (
        monthChanged
      ) {


        state.archivePeriods =
          null;


        state.archiveSelectedYear =
          null;


        state.archiveSelectedPeriod =
          null;


        state.archiveRankingCache
          .clear();


        state.historyData =
          null;


        state.historyLoading =
          null;


      }



      state.currentPeriod =
        period;



      currentPeriodEl.textContent =
        period.label;



      const requestId =
        ++state.mainRequestId;



      if (
        !silent
      ) {


        showLoader(
          rankingEl
        );


      }



      /*
        Никакой надписи
        "Данные обновлены"
        не показываем.
      */

      setStatus(
        ""
      );



      try {


        /*
          При открытии сайта
          загружается только
          текущий месяц.
        */

        const data =
          await api({


            mode:
              "month",


            period:
              period.key


          });



        if (
          requestId !==
          state.mainRequestId
        ) {


          return;


        }



        const people =
          sanitizePeople(

            getRankingArray(
              data
            )

          );



        state.currentPeople =
          people;



        renderRanking(

          rankingEl,

          people,

          true

        );



        /*
          После загрузки
          ничего не пишем.
        */

        setStatus(
          ""
        );


      }

      catch (
        error
      ) {


        if (
          requestId !==
          state.mainRequestId
        ) {


          return;


        }



        console.error(
          error
        );



        setStatus(

          "Ошибка загрузки данных",

          true

        );



        showEmpty(

          rankingEl,

          "Не удалось получить данные текущего месяца"

        );


      }


    }



    /* =====================================================
       АРХИВ

       При нажатии Архив
       загружается ТОЛЬКО
       список месяцев.

       Статистика людей
       не загружается.
       ===================================================== */


    archiveBtn.addEventListener(

      "click",

      async () => {


        openModal(
          archiveModal
        );



        archiveRankingEl.innerHTML =
          '<div class="archive-placeholder">Выберите архивный месяц</div>';



        /*
          Если список месяцев
          уже получили —
          используем кеш.
        */

        if (
          state.archivePeriods
        ) {


          renderArchiveControls();


          return;


        }



        archiveYearsEl.innerHTML =
          '<div class="loader"></div>';



        archiveMonthsEl.innerHTML =
          "";



        try {


          /*
            ВАЖНО:

            mode=months возвращает
            только перечень периодов.
          */

          const data =
            await api({


              mode:
                "months"


            });



          const source =
            Array.isArray(
              data.months
            )

              ? data.months

              : Array.isArray(
                  data.periods
                )

                ? data.periods

                : [];



          const current =
            getCurrentPeriod();



          const currentSort =
            current.year *
            100 +
            current.month;



          /*
            В Архиве показываем
            только предыдущие месяцы.

            Текущий месяц
            сюда не попадает.
          */

          state.archivePeriods =
            source

              .map(
                normalizePeriodObject
              )

              .filter(

                period =>
                  period &&
                  period.sort <
                    currentSort

              )

              .sort(

                (a, b) =>
                  a.sort -
                  b.sort

              );



          chooseArchiveStartYear();



          /*
            Здесь появляются
            только ссылки месяцев.
          */

          renderArchiveControls();


        }

        catch (
          error
        ) {


          console.error(
            error
          );



          archiveYearsEl.innerHTML =
            "";



          archiveMonthsEl.innerHTML =
            "";



          showEmpty(

            archiveRankingEl,

            "Не удалось загрузить список месяцев"

          );


        }


      }

    );



    function chooseArchiveStartYear() {


      const periods =
        state.archivePeriods ||
        [];



      if (
        periods.length === 0
      ) {


        state.archiveSelectedYear =
          null;


        return;


      }



      const latest =
        periods[
          periods.length - 1
        ];



      state.archiveSelectedYear =
        latest.year;


    }

      renderArchiveYears();


      renderArchiveMonths();


    }

        [

          );

    function renderArchiveMonths() {


      archiveMonthsEl.innerHTML =
        "";



      if (
        !state.archiveSelectedYear
      ) {


        return;


      }



      const periods =
        (
          state.archivePeriods ||
          []
        )

          .filter(

            period =>

          )

            ];

          ) {

            );

          button.addEventListener(

              */

              );

          archiveMonthsEl.appendChild(

          );

    /* =====================================================
       АРХИВНЫЙ МЕСЯЦ
       ===================================================== */

    ) {

      );

    async function ensureHistoryData() {


      if (
        state.historyData
      ) {


        return;


      }



      if (
        state.historyLoading
      ) {


        return state.historyLoading;


      }



      state.historyLoading =
        (

          async () => {


            const data =
              await api({


                mode:
                  "all"


              });



            state.historyData =
              normalizeHistoryData(
                data
              );


          }

        )();



      try {


        await state.historyLoading;


      }

      finally {


        state.historyLoading =
          null;


      }


    }



    /* =====================================================
       НОРМАЛИЗАЦИЯ ИСТОРИИ
       ===================================================== */


    function normalizeHistoryData(
      data
    ) {


      const result = {


        people:
          {},


        periods:
          []


      };



      const periodMap =
        new Map();



      if (
        Array.isArray(
          data.people
        )
      ) {


        data.people.forEach(

          person => {


            const name =
              String(

                person.name ||
                ""

              ).trim();



            if (
              !name
            ) {


              return;


            }



            const rows =
              normalizeHistoryRows(

                person.history

              );



            result.people[
              name
            ] =
              rows;



            rows.forEach(

              row => {


                periodMap.set(

                  row.period,

                  {


                    key:
                      row.period,


                    year:
                      row.year,


                    month:
                      row.month,


                    sort:
                      row.sort,


                    label:
                      row.label


                  }

                );


              }

            );


          }

        );


      }



      else if (

        data.people &&

        typeof data.people ===
          "object"

      ) {


        Object.entries(
          data.people
        ).forEach(

          ([name, rows]) => {


            const normalized =
              normalizeHistoryRows(
                rows
              );



            result.people[
              name
            ] =
              normalized;



            normalized.forEach(

              row => {


                periodMap.set(

                  row.period,

                  {


                    key:
                      row.period,


                    year:
                      row.year,


                    month:
                      row.month,


                    sort:
                      row.sort,


                    label:
                      row.label


                  }

                );


              }

            );


          }

        );


      }



      if (
        Array.isArray(
          data.history
        )
      ) {


        data.history.forEach(

          item => {


            const name =
              String(

                item.name ||
                ""

              ).trim();



            const row =
              normalizeHistoryRow(
                item
              );



            if (
              !name ||
              !row
            ) {


              return;


            }



            if (
              !result.people[
                name
              ]
            ) {


              result.people[
                name
              ] =
                [];


            }



            const exists =
              result.people[
                name
              ].some(

                old =>
                  old.period ===
                  row.period

              );



            if (
              !exists
            ) {


              result.people[
                name
              ].push(
                row
              );


            }



            periodMap.set(

              row.period,

              {


                key:
                  row.period,


                year:
                  row.year,


                month:
                  row.month,


                sort:
                  row.sort,


                label:
                  row.label


              }

            );


          }

        );


      }



      Object.values(
        result.people
      ).forEach(

        rows => {


          rows.sort(

            (a, b) =>
              a.sort -
              b.sort

          );


        }

      );



      result.periods =
        [

          ...periodMap.values()

        ]

          .sort(

            (a, b) =>
              a.sort -
              b.sort

          );



      return result;


    }



    function normalizeHistoryRows(
      rows
    ) {


      if (
        !Array.isArray(
          rows
        )
      ) {


        return [];


      }



      return rows

        .map(
          normalizeHistoryRow
        )

        .filter(
          Boolean
        )

        .sort(

          (a, b) =>
            a.sort -
            b.sort

        );


    }



    function normalizeHistoryRow(
      row
    ) {


      if (
        !row
      ) {


        return null;


      }



      const year =
        Number(
          row.year
        );



      const month =
        Number(
          row.month
        );



      const percent =
        Number(
          row.percent
        );



      if (

        !Number.isFinite(
          year
        ) ||

        !Number.isFinite(
          month
        ) ||

        month < 1 ||

        month > 12 ||

        !isSafePercent(
          percent
        )

      ) {


        return null;


      }



      const period =
        String(

          row.period ||

          (

            MONTH_KEYS[
              month - 1
            ] +

            year

          )

        );



      return {


        period:
          period,


        year:
          year,


        month:
          month,


        sort:
          Number(

            row.sort ||

            (

              year *
              100 +

              month

            )

          ),


        percent:
          percent,


        label:
          row.label ||

          (

            MONTH_NAMES[
              month - 1
            ] +

            " " +

            year

          )


      };


    }



    /* =====================================================
       ИСТОРИЯ ЧЕЛОВЕКА

                }"

            );

    /* =====================================================
       СРАВНЕНИЕ

                  );

    function renderCompareChart() {


      const svg =
        compareChartEl;



      svg.innerHTML =
        "";



      if (
        !state.historyData
      ) {


        return;


      }



      const selected =
        [

          ...state.selectedComparePeople

        ];



      if (
        selected.length === 0
      ) {


        addSvgText(

          svg,

          450,

          195,

          "Выберите участников для сравнения",

          "#8e9bb7",

          "middle",

          15

        );


        return;


      }



      const periods =

        Array.isArray(
          state.historyData.periods
        )

          ? state.historyData.periods

          : [];



      if (
        periods.length === 0
      ) {


        addSvgText(

          svg,

          450,

          195,

          "Нет данных для сравнения",

          "#8e9bb7",

          "middle",

          15

        );


        return;


      }



      const width =
        900;



      const height =
        390;



      const left =
        55;



      const right =
        25;



      const top =
        60;



      const bottom =
        55;



      const chartWidth =

        width -
        left -
        right;



      const chartHeight =

        height -
        top -
        bottom;



      const minY =
        60;



      const maxY =
        100;



      /*
        Горизонтальные линии
        через каждые 5%.
      */

      for (

        let value = minY;

        value <= maxY;

        value += 5

      ) {


        const y =
          valueToY(

            value,

            minY,

            maxY,

            top,

            chartHeight

          );



        addSvgLine(

          svg,

          left,

          y,

          width - right,

          y,

          "rgba(255,255,255,.09)"

        );



        addSvgText(

          svg,

          46,

          y + 4,

          value + "%",

          "#8e9bb7",

          "end",

          11

        );


      }



      periods.forEach(

        (period, index) => {


          if (

            periods.length > 16 &&

            index % 2 !== 0 &&

            index !==
              periods.length - 1

          ) {


            return;


          }



          const x =
            getChartX(

              index,

              periods.length,

              left,

              chartWidth

            );



          const monthName =

            MONTH_NAMES[
              period.month - 1
            ] ||

            "";



          const label =

            monthName.slice(
              0,
              3
            ) +

            " " +

            String(
              period.year
            ).slice(
              -2
            );



          addSvgText(

            svg,

            x,

            height - 18,

            label,

            "#8e9bb7",

            "middle",

            10

          );


        }

      );



      selected.forEach(

        (

          name,

          seriesIndex

        ) => {


          const rows =

            state.historyData.people[
              name
            ] ||

            [];



          const values =
            new Map();



          rows.forEach(

            row => {


              if (
                isSafePercent(
                  row.percent
                )
              ) {


                values.set(

                  row.period,

                  Number(
                    row.percent
                  )

                );


              }


            }

          );



          const hue =

            (

              190 +

              seriesIndex *
              67

            ) %

            360;



          const color =

            `hsl(${hue} 78% 62%)`;



          const legendY =

            18 +

            seriesIndex *
            17;



          addSvgText(

            svg,

            left + 8,

            legendY,

            name,

            color,

            "start",

            10

          );



          let path =
            "";



          let started =
            false;



          const circles =
            [];



          periods.forEach(

            (

              period,

              index

            ) => {


              const value =

                values.get(
                  period.key
                );



              if (
                value === undefined
              ) {


                started =
                  false;


                return;


              }



              const x =
                getChartX(

                  index,

                  periods.length,

                  left,

                  chartWidth

                );



              const chartValue =

                Math.max(

                  minY,

                  Math.min(

                    maxY,

                    value

                  )

                );



              const y =
                valueToY(

                  chartValue,

                  minY,

                  maxY,

                  top,

                  chartHeight

                );



              if (
                !started
              ) {


                path +=
                  `M ${x} ${y} `;



                started =
                  true;


              }

              else {


                path +=
                  `L ${x} ${y} `;


              }



              circles.push({

                x,

                y,

                value

              });


            }

          );



          const pathElement =

            document.createElementNS(

              "http://www.w3.org/2000/svg",

              "path"

            );



          pathElement.setAttribute(

            "d",

            path

          );



          pathElement.setAttribute(

            "fill",

            "none"

          );



          pathElement.setAttribute(

            "stroke",

            color

          );



          pathElement.setAttribute(

            "stroke-width",

            "2.5"

          );



          pathElement.setAttribute(

            "stroke-linecap",

            "round"

          );



          pathElement.setAttribute(

            "stroke-linejoin",

            "round"

          );



          svg.appendChild(
            pathElement
          );



          circles.forEach(

            point => {


              const circle =

                document.createElementNS(

                  "http://www.w3.org/2000/svg",

                  "circle"

                );



              circle.setAttribute(

                "cx",

                point.x

              );



              circle.setAttribute(

                "cy",

                point.y

              );



              circle.setAttribute(

                "r",

                "3.5"

              );



              circle.setAttribute(

                "fill",

                color

              );



              const title =

                document.createElementNS(

                  "http://www.w3.org/2000/svg",

                  "title"

                );



              title.textContent =

                name +

                ": " +

                formatPercent(
                  point.value
                );



              circle.appendChild(
                title
              );



              svg.appendChild(
                circle
              );


            }

          );


        }

      );


    }



    function valueToY(

      value,

      min,

      max,

      top,

      height

    ) {


      return (

        top +

        height *

        (

          1 -

          (

            value -
            min

          ) /

          (

            max -
            min

          )

        )

      );


    }



    /* =====================================================
       РЕНДЕР РЕЙТИНГА
       ===================================================== */


    function getRankingArray(
      data
    ) {


      if (
        Array.isArray(
          data.people
        )
      ) {


        return data.people;


      }



      if (
        Array.isArray(
          data.ranking
        )
      ) {


        return data.ranking;


      }



      return [];


    }



    function sanitizePeople(
      people
    ) {


      if (
        !Array.isArray(
          people
        )
      ) {


        return [];


      }



      return people

        .map(

          item => {


            return {


              name:
                String(

                  item.name ||
                  ""

                ).trim(),


              percent:
                Number(
                  item.percent
                )


            };


          }

        )

        .filter(

          item =>
            item.name &&
            isSafePercent(
              item.percent
            )

        )

        .sort(

          (a, b) =>
            b.percent -
            a.percent

        );


    }



    function renderRanking(

      target,

      people,

      clickable = true

    ) {


      target.innerHTML =
        "";



      if (
        people.length === 0
      ) {


        showEmpty(

          target,

          "За этот месяц статистика не найдена"

        );


        return;


      }



      people.forEach(

        (

          person,

          index

        ) => {


          const card =
            document.createElement(
              "article"
            );



          card.className =
            "rank-card";



          if (
            index === 0
          ) {


            card.classList.add(
              "first"
            );


          }



          if (
            index === 1
          ) {


            card.classList.add(
              "second"
            );


          }



          if (
            index === 2
          ) {


            card.classList.add(
              "third"
            );


          }



          const percent =
            clampPercent(
              person.percent
            );



          const percentClass =

            percent >= 90

              ? "percent green"

              : "percent";



          card.innerHTML = `


            <div class="place">

              ${getPlaceIcon(index)}

            </div>



            <div
              class="person-name"
              title="${escapeHtml(person.name)}"
            >

              ${escapeHtml(person.name)}

            </div>



            <div
              class="bar-wrap"

              ${
                clickable

                  ? 'tabindex="0" role="button"'

                  : ""
              }
            >


              <div class="bar">


                <div
                  class="bar-fill"
                  style="width:${percent}%"
                ></div>


              </div>


              ${
                clickable

                  ? '<span class="bar-hint">нажмите для статистики</span>'

                  : ""
              }


            </div>



            <div
              class="${percentClass}"
            >

              ${formatPercent(percent)}

            </div>


          `;



          if (
            clickable
          ) {


            const scale =
              card.querySelector(
                ".bar-wrap"
              );



            const open =
              () => {


                openPersonDetails(
                  person.name
                );


              };



            scale.addEventListener(

              "click",

              open

            );



            scale.addEventListener(

              "keydown",

              event => {


                if (

                  event.key ===
                    "Enter" ||

                  event.key ===
                    " "

                ) {


                  event.preventDefault();


                  open();


                }


              }

            );


          }



          target.appendChild(
            card
          );


        }

      );


    }



    /* =====================================================
       ПЕРИОДЫ
       ===================================================== */


    function normalizePeriodObject(
      item
    ) {


      if (
        !item
      ) {


        return null;


      }



      const year =
        Number(
          item.year
        );



      const month =
        Number(
          item.month
        );



      if (

        !item.key ||

        !Number.isFinite(
          year
        ) ||

        !Number.isFinite(
          month
        ) ||

        month < 1 ||

        month > 12

      ) {


        return null;


      }



      return {


        key:
          String(
            item.key
          ),


        year:
          year,


        month:
          month,


        sort:
          Number(

            item.sort ||

            (

              year *
              100 +

              month

            )

          ),


        label:
          item.label ||

          (

            MONTH_NAMES[
              month - 1
            ] +

            " " +

            year

          )


      };


    }



    /* =====================================================
       MODAL
       ===================================================== */


    function openModal(
      modal
    ) {


      modal.classList.add(
        "visible"
      );



      modal.setAttribute(

        "aria-hidden",

        "false"

      );



      document.body.classList.add(
        "modal-open"
      );


    }



    function closeModal(
      modal
    ) {


      modal.classList.remove(
        "visible"
      );



      modal.setAttribute(

        "aria-hidden",

        "true"

      );



      if (

        !document.querySelector(
          ".modal.visible"
        )

      ) {


        document.body.classList.remove(
          "modal-open"
        );


      }


    }



    archiveClose.addEventListener(

      "click",

      () => {


        closeModal(
          archiveModal
        );


      }

    );



    personClose.addEventListener(

      "click",

      () => {


        closeModal(
          personModal
        );


      }

    );



    archiveModal.addEventListener(

      "click",

      event => {


        if (
          event.target ===
          archiveModal
        ) {


          closeModal(
            archiveModal
          );


        }


      }

    );



    personModal.addEventListener(

      "click",

      event => {


        if (
          event.target ===
          personModal
        ) {


          closeModal(
            personModal
          );


        }


      }

    );



    document.addEventListener(

      "keydown",

      event => {


        if (
          event.key !==
          "Escape"
        ) {


          return;


        }



        if (

          personModal.classList.contains(
            "visible"
          )

        ) {


          closeModal(
            personModal
          );


          return;


        }



        if (

          archiveModal.classList.contains(
            "visible"
          )

        ) {


          closeModal(
            archiveModal
          );


        }


      }

    );



    /* =====================================================
       SVG
       ===================================================== */


    function getChartX(

      index,

      count,

      left,

      width

    ) {


      if (
        count <= 1
      ) {


        return (

          left +

          width / 2

        );


      }



      return (

        left +

        width *

        index /

        (

          count - 1

        )

      );


    }



    function addSvgLine(

      svg,

      x1,

      y1,

      x2,

      y2,

      stroke

    ) {


      const line =

        document.createElementNS(

          "http://www.w3.org/2000/svg",

          "line"

        );



      line.setAttribute(
        "x1",
        x1
      );


      line.setAttribute(
        "y1",
        y1
      );


      line.setAttribute(
        "x2",
        x2
      );


      line.setAttribute(
        "y2",
        y2
      );


      line.setAttribute(
        "stroke",
        stroke
      );


      line.setAttribute(
        "stroke-width",
        "1"
      );



      svg.appendChild(
        line
      );


    }



    function addSvgText(

      svg,

      x,

      y,

      text,

      fill,

      anchor,

      size

    ) {


      const element =

        document.createElementNS(

          "http://www.w3.org/2000/svg",

          "text"

        );



      element.setAttribute(
        "x",
        x
      );


      element.setAttribute(
        "y",
        y
      );


      element.setAttribute(
        "fill",
        fill
      );


      element.setAttribute(
        "text-anchor",
        anchor
      );


      element.setAttribute(
        "font-size",
        size
      );



      element.textContent =
        text;



      svg.appendChild(
        element
      );


    }



    /* =====================================================
       HELPERS
       ===================================================== */


    function getPlaceIcon(
      index
    ) {


      if (
        index === 0
      ) {


        return "🥇";


      }



      if (
        index === 1
      ) {


        return "🥈";


      }



      if (
        index === 2
      ) {


        return "🥉";


      }



      return String(
        index + 1
      );


    }



    function showLoader(
      target
    ) {


      target.innerHTML =
        '<div class="loader"></div>';


    }



    function showEmpty(
      target,
      text
    ) {


      target.innerHTML =
        `<div class="empty">${escapeHtml(text)}</div>`;


    }



    function setStatus(

      text,

      error = false

    ) {


      statusEl.textContent =
        text ||
        "";



      statusEl.classList.toggle(

        "error",

        Boolean(
          error
        )

      );


    }



    function isSafePercent(
      value
    ) {


      const number =
        Number(
          value
        );



      return (

        Number.isFinite(
          number
        ) &&

        number >= 0 &&

        number <= 100

      );


    }



    function clampPercent(
      value
    ) {


      const number =
        Number(
          value
        );



      if (
        !Number.isFinite(
          number
        )
      ) {


        return 0;


      }



      return Math.max(

        0,

        Math.min(

          100,

          number

        )

      );


    }



    function formatPercent(
      value
    ) {


      const number =
        Number(
          value
        );



      if (
        !isSafePercent(
          number
        )
      ) {


        return "—";


      }



      return (

        number

          .toFixed(
            1
          )

          .replace(
            ".",
            ","
          )

        +

        "%"

      );


    }



    function escapeHtml(
      value
    ) {


      return String(

        value ||
        ""

      )

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );


    }



    /* =====================================================
       АВТООБНОВЛЕНИЕ
       ===================================================== */


    let lastKnownPeriodKey =
      getCurrentPeriod().key;



    /*
      Каждые 20 секунд
      обновляется только
      текущий месяц.

      Архив не загружается.
      История не загружается.
    */

    setInterval(

      async () => {


        if (
          document.hidden
        ) {


          return;


        }



        const actualPeriod =
          getCurrentPeriod();



        /*
          Если наступил
          новый календарный месяц.
        */

        if (

          actualPeriod.key !==
          lastKnownPeriodKey

        ) {


          lastKnownPeriodKey =
            actualPeriod.key;



          state.archivePeriods =
            null;



          state.archiveSelectedYear =
            null;



          state.archiveSelectedPeriod =
            null;



          state.archiveRankingCache
            .clear();



          state.historyData =
            null;



          state.historyLoading =
            null;



          /*
            Главная автоматически
            переключается
            на новый месяц.
          */

          await loadCurrentMonth(
            false
          );



          /*
            Если в момент смены
            месяца был открыт Архив —
            закрываем его.

            При следующем открытии
            список месяцев загрузится
            заново и старый текущий
            месяц появится там.
          */

          if (

            archiveModal.classList
              .contains(
                "visible"
              )

          ) {


            closeModal(
              archiveModal
            );


          }



          return;


        }



        loadCurrentMonth(
          true
        );


      },

      20000

    );



    /* =====================================================
       ВОЗВРАТ НА ВКЛАДКУ
       ===================================================== */


    document.addEventListener(

      "visibilitychange",

      () => {


        if (
          document.hidden
        ) {


          return;


        }



        const actualPeriod =
          getCurrentPeriod();



        /*
          Если пользователь
          открыл сайт вчера,
          а вернулся уже
          в новом месяце.
        */

        if (

          actualPeriod.key !==
          lastKnownPeriodKey

        ) {


          lastKnownPeriodKey =
            actualPeriod.key;



          state.archivePeriods =
            null;



          state.archiveSelectedYear =
            null;



          state.archiveSelectedPeriod =
            null;



          state.archiveRankingCache
            .clear();



          state.historyData =
            null;



          state.historyLoading =
            null;



          loadCurrentMonth(
            false
          );



          return;


        }



        loadCurrentMonth(
          true
        );


      }

    );



    /* =====================================================
       START
       ===================================================== */


    lastKnownPeriodKey =
      getCurrentPeriod().key;



    /*
      При первом открытии сайта
      единственный запрос —
      статистика текущего месяца.
    */

    loadCurrentMonth();


  </script>
