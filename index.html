<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Рейтинг команды</title>

  <!-- Telegram Mini App bridge: нужен только когда сайт открыт из кнопки бота -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #050c18;
      --bg2: #0c1730;
      --card: rgba(22, 36, 63, 0.92);
      --card2: rgba(14, 27, 49, 0.96);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f5f7ff;
      --muted: #8e9bb7;
      --blue: #37bff5;
      --green: #31d879;
      --gold: #f6c626;
      --silver: #bac4d1;
      --bronze: #cf7b30;
      --danger: #ff6174;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 50% 0%,
          #172959 0%,
          #0b162b 32%,
          #050c18 72%
        );

      background-attachment: fixed;
    }

    body.modal-open {
      overflow: hidden;
    }

    button {
      font: inherit;
    }

    .page {
      min-height: 100vh;
      padding: 24px 16px 60px;
    }

    .container {
      width: min(920px, 100%);
      margin: 0 auto;
    }

    /* =====================================================
       HEADER
       ===================================================== */

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    .title {
      margin: 0;

      font-size: 34px;
      line-height: 1.1;

      font-weight: 850;
      letter-spacing: -1px;
    }

    .subtitle {
      margin-top: 7px;

      font-size: 14px;
      color: var(--muted);
    }

    .current-period {
      margin-top: 12px;

      font-size: 25px;
      font-weight: 850;
    }

    .status {
      min-height: 18px;
      margin-top: 7px;

      font-size: 12px;
      color: var(--muted);
    }

    .status.error {
      color: var(--danger);
    }

    /* =====================================================
       RANKING
       ===================================================== */

    .ranking {
      display: grid;
      gap: 9px;

      margin-top: 16px;
    }

    .rank-card {
      display: grid;

      grid-template-columns:
        44px
        minmax(150px, 1.2fr)
        minmax(220px, 4fr)
        auto;

      align-items: center;

      min-height: 66px;

      padding: 10px 15px;

      border:
        1px solid
        var(--border);

      border-radius: 17px;

      background:
        linear-gradient(
          90deg,
          rgba(30, 45, 74, 0.94),
          rgba(15, 26, 47, 0.92)
        );

      transition:
        transform 3s cubic-bezier(.16,.78,.18,1),
        border-color 0.3s ease,
        box-shadow 0.3s ease,
        opacity 0.3s ease;

      will-change: transform;
    }

    .rank-card:hover {
      transform: translateY(-1px);
    }

    .rank-card.first {
      border-color:
        rgba(246, 198, 38, 0.75);
    }

    .rank-card.second {
      border-color:
        rgba(186, 196, 209, 0.55);
    }

    .rank-card.third {
      border-color:
        rgba(207, 123, 48, 0.72);
    }

    .place {
      text-align: center;
      font-size: 20px;
    }

    .person-name {
      min-width: 0;

      overflow: hidden;

      white-space: nowrap;
      text-overflow: ellipsis;

      font-size: 16px;
      font-weight: 780;
    }

    .percent {
      padding-left: 13px;

      white-space: nowrap;

      font-size: 21px;
      line-height: 1;

      font-weight: 850;
      color: var(--blue);
    }

    .percent.green {
      color: var(--green);
    }

    .percent {
      transition:
        color 0.35s ease,
        transform 0.25s ease;
    }

    .percent.value-changed {
      transform: scale(1.08);
    }

    .rank-card.new-card {
      animation: cardAppear 0.45s ease both;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* =====================================================
       CLICKABLE SCALE
       ===================================================== */

    .bar-wrap {
      position: relative;

      padding: 12px 7px;

      cursor: pointer;

      border-radius: 12px;

      outline: none;
    }

    .bar-wrap:hover {
      background:
        rgba(255, 255, 255, 0.035);
    }

    .bar-wrap:focus-visible {
      box-shadow:
        0 0 0 2px
        rgba(55, 191, 245, 0.5);
    }

    .bar {
      position: relative;

      height: 12px;

      overflow: hidden;

      border-radius: 999px;

      background:
        rgba(255, 255, 255, 0.08);
    }

    /*
      Вертикальные деления каждые 5%.
    */

    .bar::after {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      background:
        repeating-linear-gradient(
          to right,
          transparent 0,
          transparent calc(5% - 1px),
          rgba(255, 255, 255, 0.18)
            calc(5% - 1px),
          rgba(255, 255, 255, 0.18)
            5%
        );
    }

    .bar-fill {
      position: absolute;

      left: 0;
      top: 0;
      bottom: 0;

      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          #37bff5,
          #31d879
        );

      transition: none;

      will-change: width;
    }

    .bar-hint {
      position: absolute;

      left: 50%;
      bottom: -1px;

      transform: translateX(-50%);

      opacity: 0;

      pointer-events: none;

      white-space: nowrap;

      font-size: 9px;
      color: var(--muted);

      transition:
        opacity 0.15s ease;
    }

    .bar-wrap:hover .bar-hint {
      opacity: 1;
    }

    /* =====================================================
       ARCHIVE LINK
       ===================================================== */

    .archive-link-wrap {
      display: flex;
      justify-content: center;

      margin-top: 22px;
    }

    .archive-link {
      appearance: none;

      border: 0;
      padding: 6px 12px;

      color: #cbd7ed;

      background: transparent;

      cursor: pointer;

      font-size: 14px;
      font-weight: 700;

      text-decoration: underline;
      text-decoration-color:
        rgba(203, 215, 237, 0.45);
      text-underline-offset: 4px;
    }

    .archive-link:hover {
      color: #ffffff;
    }

    /* =====================================================
       MODALS
       ===================================================== */

    .modal {
      display: none;

      position: fixed;
      inset: 0;

      z-index: 1000;

      padding: 18px;

      background:
        rgba(2, 8, 18, 0.76);

      backdrop-filter:
        blur(10px);
      -webkit-backdrop-filter:
        blur(10px);
    }

    .modal.visible {
      display: flex;

      align-items: center;
      justify-content: center;
    }

    .modal-card {
      width: min(960px, 100%);
      max-height: calc(100vh - 36px);

      overflow-y: auto;

      border:
        1px solid
        rgba(255, 255, 255, 0.13);

      border-radius: 22px;

      background:
        linear-gradient(
          180deg,
          rgba(17, 31, 57, 0.99),
          rgba(8, 18, 34, 0.99)
        );

      box-shadow:
        0 30px 100px
        rgba(0, 0, 0, 0.42);
    }

    .modal-head {
      position: sticky;
      top: 0;

      z-index: 3;

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 14px;

      padding: 17px 18px;

      border-bottom:
        1px solid
        rgba(255, 255, 255, 0.08);

      background:
        rgba(12, 25, 46, 0.96);

      backdrop-filter:
        blur(12px);
      -webkit-backdrop-filter:
        blur(12px);
    }

    .modal-title {
      min-width: 0;

      margin: 0;

      overflow: hidden;

      white-space: nowrap;
      text-overflow: ellipsis;

      font-size: 21px;
      font-weight: 850;
    }

    .close-btn {
      flex: 0 0 auto;

      width: 36px;
      height: 36px;

      border:
        1px solid
        rgba(255, 255, 255, 0.11);

      border-radius: 50%;

      color: var(--text);

      background:
        rgba(255, 255, 255, 0.06);

      cursor: pointer;

      font-size: 20px;
      line-height: 1;
    }

    .close-btn:hover {
      background:
        rgba(255, 255, 255, 0.11);
    }

    .modal-body {
      padding: 18px;
    }

    .section-title {
      margin:
        0
        0
        12px;

      font-size: 18px;
      font-weight: 820;
    }

    .subtle {
      color: var(--muted);
      font-size: 12px;
    }

    .panel {
      padding: 15px;

      border:
        1px solid
        rgba(255, 255, 255, 0.09);

      border-radius: 17px;

      background:
        rgba(255, 255, 255, 0.035);
    }

    .panel + .panel {
      margin-top: 15px;
    }

    /* =====================================================
       ARCHIVE
       ===================================================== */

    .archive-years,
    .archive-months {
      display: flex;
      flex-wrap: wrap;

      gap: 7px;
    }

    .archive-months {
      margin-top: 10px;
    }

    .period-button {
      appearance: none;

      padding: 9px 13px;

      border:
        1px solid
        rgba(255, 255, 255, 0.12);

      border-radius: 11px;

      color: var(--text);

      background:
        rgba(255, 255, 255, 0.06);

      cursor: pointer;
    }

    .period-button:hover {
      background:
        rgba(255, 255, 255, 0.1);
    }

    .period-button.active {
      border-color:
        var(--blue);

      background:
        rgba(55, 191, 245, 0.16);
    }

    .archive-ranking {
      display: grid;
      gap: 9px;

      margin-top: 0;
    }

    .archive-view-header {
      text-align: center;
      margin: 2px 0 8px;
    }

    .archive-view-header .subtitle {
      margin-top: 0;
    }

    .archive-view-header .current-period {
      margin-top: 8px;
    }

    .archive-controls-panel {
      margin-top: 22px;
    }

    .archive-placeholder {
      padding: 32px 15px;

      text-align: center;
      color: var(--muted);
    }

    #archiveModal .archive-modal-head {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr) 40px;
      align-items: center;
      gap: 10px;
    }

    #archiveModal .archive-modal-head .modal-title {
      grid-column: 2;
      text-align: center;
    }

    #archiveModal .close-btn {
      grid-column: 3;
      justify-self: end;
    }

    .archive-back-btn {
      grid-column: 1;
      justify-self: start;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 50%;
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      cursor: pointer;
      font-size: 24px;
      line-height: 1;
    }

    .archive-back-btn.hidden,
    .archive-detail.hidden,
    .archive-selector.hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .archive-detail.hidden,
    .archive-selector.hidden {
      display: none;
    }

    .archive-back-btn.hidden {
      opacity: 0;
    }

    .archive-month-title {
      margin-top: 22px;
    }

    .archive-swipe-hint {
      margin: 16px 0 4px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    #archiveDetail {
      touch-action: pan-y;
    }

    /* =====================================================
       HISTORY
       ===================================================== */

    .history-list {
      display: grid;
      gap: 7px;
    }

    .history-row {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 14px;

      padding: 9px 11px;

      border-radius: 11px;

      background:
        rgba(255, 255, 255, 0.05);
    }

    .history-period {
      color: #dbe4f7;
    }

    .history-percent {
      font-weight: 850;
      color: var(--blue);
    }

    .history-percent.green {
      color: var(--green);
    }

    /* =====================================================
       COMPARISON
       ===================================================== */

    .compare-options {
      display: flex;
      flex-wrap: wrap;

      gap: 8px;

      margin-bottom: 14px;
    }

    .compare-option {
      display: flex;
      align-items: center;

      gap: 7px;

      padding: 8px 10px;

      border-radius: 10px;

      background:
        rgba(255, 255, 255, 0.05);

      cursor: pointer;
    }

    .chart-wrap {
      overflow-x: auto;
    }

    #compareChart {
      min-width: 760px;
    }

    /* =====================================================
       LOADER / EMPTY
       ===================================================== */

    .loader {
      width: 32px;
      height: 32px;

      margin: 35px auto;

      border:
        3px solid
        rgba(255, 255, 255, 0.14);

      border-top-color:
        var(--blue);

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .empty {
      padding: 28px 14px;

      text-align: center;
      color: var(--muted);
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 700px) {

      .page {
        padding:
          17px
          10px
          40px;
      }

      .title {
        font-size: 28px;
      }

      .current-period {
        font-size: 21px;
      }

      .rank-card {
        grid-template-columns:
          34px
          1fr
          auto;

        grid-template-areas:
          "place name percent"
          ". bar bar";

        gap: 4px 8px;

        padding:
          9px
          11px
          5px;
      }

      .place {
        grid-area: place;
      }

      .person-name {
        grid-area: name;
      }

      .percent {
        grid-area: percent;

        padding-left: 4px;

        font-size: 18px;
      }

      .bar-wrap {
        grid-area: bar;

        padding:
          10px
          0
          12px;
      }

      /* Архив: экран выбора периода прокручивается вертикально,
         а месяцы и годы остаются крупными кнопками. */
      #archiveModal .archive-controls-panel {
        position: static;
        margin: 0;
        padding: 15px;
        background: rgba(255, 255, 255, 0.035);
        box-shadow: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      #archiveModal .archive-years,
      #archiveModal .archive-months {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
        overflow: visible;
        touch-action: auto;
      }

      #archiveModal .period-button {
        width: 100%;
        min-width: 0;
        min-height: 46px;
      }

      .modal {
        padding:
          max(46px, calc(env(safe-area-inset-top) + 28px))
          8px
          max(8px, env(safe-area-inset-bottom));
      }

      .modal.visible {
        align-items: flex-start;
      }

      .modal-card {
        max-height:
          calc(100vh - max(54px, calc(env(safe-area-inset-top) + 36px)));

        border-radius: 17px;
      }

      .modal-head {
        padding: 13px 14px;
      }

      .modal-body {
        padding: 13px;
      }

      .modal-title {
        font-size: 18px;
      }
    }
  
    .rank-card {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
    }

  
    /* =====================================================
       ARCHIVE — MOBILE POLISH + SWIPE
       ===================================================== */

    #archiveModal .modal-card {
      overflow: hidden;
    }

    #archiveModal .modal-body {
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    #archiveDetail {
      position: relative;
      overflow-x: hidden;
      touch-action: pan-y;
    }

    #archiveRanking {
      will-change: transform, opacity;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    #archiveModal .archive-modal-head {
      background:
        linear-gradient(
          180deg,
          rgba(17, 31, 57, 0.99),
          rgba(14, 27, 49, 0.96)
        );
    }

    #archiveModal .archive-back-btn,
    #archiveModal .close-btn {
      transition:
        transform 160ms ease,
        background 160ms ease,
        border-color 160ms ease;
    }

    #archiveModal .archive-back-btn:active,
    #archiveModal .close-btn:active {
      transform: scale(.92);
      background: rgba(255, 255, 255, 0.12);
    }

    #archiveModal .archive-swipe-hint {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: fit-content;
      max-width: calc(100% - 24px);

      margin:
        18px
        auto
        4px;

      padding:
        8px
        12px;

      border:
        1px solid
        rgba(255,255,255,.08);

      border-radius: 999px;

      background:
        rgba(255,255,255,.045);

      color:
        rgba(219, 228, 247, .62);

      font-size: 11px;
      line-height: 1.25;
    }

    #archiveModal .archive-view-header {
      margin:
        4px
        0
        18px;

      padding:
        4px
        0
        2px;
    }

    #archiveModal .archive-view-header .subtitle {
      font-size: 13px;
      letter-spacing: .01em;
    }

    #archiveModal .archive-view-header .current-period {
      margin-top: 7px;
      font-size: clamp(27px, 7vw, 38px);
      line-height: 1.04;
      letter-spacing: -.025em;
    }

    @media (max-width: 700px) {

      #archiveModal {
        box-sizing: border-box;

        padding:
          max(18px, env(safe-area-inset-top))
          8px
          max(14px, env(safe-area-inset-bottom));
      }

      #archiveModal.visible {
        align-items: stretch;
      }

      #archiveModal .modal-card {
        width: 100%;

        /*
          100dvh учитывает реальную видимую высоту Safari,
          включая изменение нижней панели браузера.
        */
        height:
          calc(
            100dvh
            - max(18px, env(safe-area-inset-top))
            - max(14px, env(safe-area-inset-bottom))
          );

        max-height: none;

        display: flex;
        flex-direction: column;

        border-radius: 22px;
      }

      @supports not (height: 100dvh) {
        #archiveModal .modal-card {
          height:
            calc(
              100vh
              - max(54px, calc(env(safe-area-inset-top) + 30px))
            );
        }
      }

      #archiveModal .modal-head {
        flex: 0 0 auto;

        min-height: 66px;

        padding:
          12px
          14px;

        border-bottom-color:
          rgba(255,255,255,.075);
      }

      #archiveModal .archive-modal-head {
        grid-template-columns:
          44px
          minmax(0, 1fr)
          44px;
      }

      #archiveModal .archive-back-btn,
      #archiveModal .close-btn {
        width: 42px;
        height: 42px;
      }

      #archiveModal .archive-back-btn {
        font-size: 27px;
      }

      #archiveModal .close-btn {
        font-size: 23px;
      }

      #archiveModal .modal-title {
        font-size: 22px;
        letter-spacing: -.01em;
      }

      #archiveModal .modal-body {
        flex: 1 1 auto;

        min-height: 0;

        padding:
          18px
          12px
          max(34px, calc(env(safe-area-inset-bottom) + 26px));

        /*
          Дополнительное пространство снизу — последняя карточка
          больше не прячется за панелью Safari.
        */
        scroll-padding-bottom:
          max(70px, calc(env(safe-area-inset-bottom) + 56px));
      }

      #archiveModal .archive-ranking {
        padding-bottom: 16px;
      }

      #archiveModal .ranking {
        gap: 11px;
      }

      #archiveModal .rank-card {
        border-radius: 19px;

        padding:
          11px
          12px
          7px;

        box-shadow:
          0 8px 24px
          rgba(0,0,0,.10);
      }

      #archiveModal .person-name {
        font-size: clamp(17px, 5.1vw, 23px);
      }

      #archiveModal .percent {
        font-size: clamp(17px, 4.9vw, 22px);
      }

      #archiveModal .archive-swipe-hint {
        margin-bottom:
          max(18px, env(safe-area-inset-bottom));
      }
    }

  
    /* =====================================================
       ARCHIVE V10 — CENTERED DETAIL
       ===================================================== */

    #archiveModal .modal-body {
      box-sizing: border-box;
    }

    #archiveDetail {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
    }

    #archiveRanking {
      width: 100%;
      max-width: 760px;
      margin-left: auto;
      margin-right: auto;
    }

    #archiveModal .archive-view-header {
      margin-top: 18px;
      margin-bottom: 22px;
      padding-top: 4px;
      text-align: center;
    }

    #archiveModal .archive-view-header .subtitle {
      margin: 0;
      text-align: center;
    }

    #archiveModal .archive-view-header .current-period {
      margin-top: 10px;
      text-align: center;
    }

    @media (max-width: 700px) {
      #archiveModal .modal-body {
        padding-left: 14px;
        padding-right: 14px;
      }

      #archiveDetail {
        width: 100%;
      }

      #archiveRanking {
        width: 100%;
        max-width: 100%;
        margin-left: auto;
        margin-right: auto;
      }

      #archiveModal .archive-view-header {
        margin-top: 26px;
        margin-bottom: 24px;
        padding-left: 8px;
        padding-right: 8px;
      }

      #archiveModal .archive-view-header .subtitle {
        font-size: 13px;
      }

      #archiveModal .archive-view-header .current-period {
        margin-top: 11px;
      }
    }

  
    /* =====================================================
       ARCHIVE V11 — MONTH ARROWS + CENTERING
       ===================================================== */

    #archiveModal .archive-detail {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

  <script>

    /* =====================================================
       API
       ===================================================== */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbwYcG1OIZ_y2E3OZQw8oH0IuDMyk06lxL41oM6K1TtXN0Noxa5bV7kC_hsWOXTsTde_IA/exec";


    const MONTH_KEYS = [
      "ЯНВАРЬ",
      "ФЕВРАЛЬ",
      "МАРТ",
      "АПРЕЛЬ",
      "МАЙ",
      "ИЮНЬ",
      "ИЮЛЬ",
      "АВГУСТ",
      "СЕНТЯБРЬ",
      "ОКТЯБРЬ",
      "НОЯБРЬ",
      "ДЕКАБРЬ"
    ];


    const MONTH_NAMES = [
      "Январь",
      "Февраль",
      "Март",
      "Апрель",
      "Май",
      "Июнь",
      "Июль",
      "Август",
      "Сентябрь",
      "Октябрь",
      "Ноябрь",
      "Декабрь"
    ];


    /* =====================================================
       STATE
       ===================================================== */

    const state = {

      currentPeriod:
        null,

      currentPeople:
        [],

      archivePeriods:
        null,

      archiveSelectedYear:
        null,

      archiveSelectedPeriod:
        null,

      /*
        Архивные рейтинги кешируем
        только ПОСЛЕ первого клика.
      */

      archiveRankingCache:
        new Map(),

      /*
        v152:
        один общий Promise для загрузки archivebundle,
        чтобы не запускать несколько одинаковых запросов одновременно.
      */
      archiveBundleLoading:
        null,

      /*
        История + сравнение тоже
        НЕ грузятся при открытии сайта.

        Загружаются только после
        клика по шкале участника.
      */

      historyData:
        null,

      historyLoading:
        null,

      selectedPerson:
        null,

      selectedComparePeople:
        new Set(),

      currentMonthLoading:
        false,

      rankingAnimationRunning:
        false,

      pendingRankingPeople:
        null
    };

    // v156 — previous month stays LIVE through day 5 (Moscow time).
    // From day 6 it is treated as frozen archive.
    function getMoscowNowV156() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Europe/Moscow",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());

      const obj = {};
      parts.forEach(function (p) {
        if (p.type !== "literal") obj[p.type] = p.value;
      });

      return {
        year: Number(obj.year),
        month: Number(obj.month),
        day: Number(obj.day)
      };
    }

    function getPreviousMonthKeyV156() {
      const now = getMoscowNowV156();
      let year = now.year;
      let month = now.month - 1;
      if (month < 1) {
        month = 12;
        year -= 1;
      }
      return String(year) + "-" + String(month).padStart(2, "0");
    }

    function isPreviousMonthStillLiveV156(periodOrKey) {
      const now = getMoscowNowV156();

      if (now.day > 5) {
        return false;
      }

      let prevYear = now.year;
      let prevMonth = now.month - 1;

      if (prevMonth < 1) {
        prevMonth = 12;
        prevYear -= 1;
      }

      /*
        Основной формат архива — объект:
        { key: "АВГУСТ2026", month: 8, year: 2026 }

        Старый v156 ошибочно сравнивал весь объект со строкой
        "2026-08", поэтому условие никогда не срабатывало.
      */
      if (
        periodOrKey &&
        typeof periodOrKey === "object"
      ) {
        return (
          Number(periodOrKey.year) === prevYear &&
          Number(periodOrKey.month) === prevMonth
        );
      }

      const value =
        String(periodOrKey || "");

      const russianKey =
        MONTH_KEYS[prevMonth - 1] +
        prevYear;

      const isoKey =
        String(prevYear) +
        "-" +
        String(prevMonth).padStart(2, "0");

      return (
        value === russianKey ||
        value === isoKey
      );
    }



    /* =====================================================
           v154 — FAST ARCHIVE INSIDE MAIN APP SCRIPT
    
           Внешний вид и анимации v29 НЕ меняются.
           Оптимизируется только получение архивных данных:
           один archivebundle + localStorage + фоновый прогрев.
           ===================================================== */
    
        const ARCHIVE_STORAGE_PREFIX_V152 =
          "team-rating-archive-v152:";
    
    
        function getArchiveStoragePhaseV147() {
    
          const now =
            new Date();
    
          const year =
            now.getFullYear();
    
          const month =
            String(
              now.getMonth() + 1
            ).padStart(
              2,
              "0"
            );
    
          const phase =
            now.getDate() <= 5
              ? "pre6"
              : "post6";
    
    
          return (
            year +
            "-" +
            month +
            "-" +
            phase
          );
        }
    
    
        function getArchiveStorageKeyV147() {
    
          return (
            ARCHIVE_STORAGE_PREFIX_V152 +
            getArchiveStoragePhaseV147()
          );
        }
    
    
        function readArchiveBundleLocalV147() {
    
          try {
    
            const raw =
              localStorage.getItem(
                getArchiveStorageKeyV147()
              );
    
    
            if (!raw) {
              return null;
            }
    
    
            const parsed =
              JSON.parse(
                raw
              );
    
    
            if (
              !parsed ||
              parsed.ok !== true ||
              !Array.isArray(
                parsed.periods
              ) ||
              !parsed.rankings ||
              typeof parsed.rankings !==
                "object"
            ) {
    
              return null;
            }
    
    
            return parsed;
    
          } catch (error) {
    
            return null;
          }
        }
    
    
        function writeArchiveBundleLocalV147(
          data
        ) {
    
          try {
    
            /*
              Удаляем старые версии/фазы этого же архива,
              чтобы localStorage не рос бесконечно.
            */
            for (
              let i =
                localStorage.length - 1;
              i >= 0;
              i--
            ) {
    
              const key =
                localStorage.key(i);
    
    
              if (
                key &&
                key.indexOf(
                  ARCHIVE_STORAGE_PREFIX_V152
                ) === 0 &&
                key !==
                  getArchiveStorageKeyV147()
              ) {
    
                localStorage.removeItem(
                  key
                );
              }
            }
    
    
            localStorage.setItem(
              getArchiveStorageKeyV147(),
              JSON.stringify(
                data
              )
            );
    
          } catch (error) {
    
            /*
              Без localStorage всё продолжит работать
              через обычный серверный запрос.
            */
          }
        }
    
    
        function hydrateArchiveBundleV147(
          data
        ) {
    
          const source =
            Array.isArray(
              data && data.periods
            )
              ? data.periods
              : Array.isArray(
                  data && data.months
                )
                  ? data.months
                  : [];
    
    
          const currentKey =
            getCurrentPeriod()
              .key;
    
    
          state.archivePeriods =
            source
              .map(
                normalizePeriodObject
              )
              .filter(
                item =>
                  item &&
                  item.key !==
                    currentKey
              )
              .sort(
                (a, b) =>
                  a.sort -
                  b.sort
              );
    
    
          const rankings =
            data &&
            data.rankings &&
            typeof data.rankings ===
              "object"
              ? data.rankings
              : {};
    
    
          Object
            .keys(
              rankings
            )
            .forEach(
              periodKey => {
    
                const people =
                  sanitizePeople(
                    Array.isArray(
                      rankings[
                        periodKey
                      ]
                    )
                      ? rankings[
                          periodKey
                        ]
                      : []
                  );
    
    
                state.archiveRankingCache
                  .set(
                    periodKey,
                    people
                  );
              }
            );
        }
    
    
        async function ensureArchiveBundleV147() {
    
          if (
            state.archivePeriods
          ) {
    
            return true;
          }
    
    
          const local =
            readArchiveBundleLocalV147();

    async function api(params) {

      const url =
        new URL(
          API_URL
        );


      Object
        .entries(params)
        .forEach(
          ([key, value]) => {

            url.searchParams.set(
              key,
              value
            );
          }
        );


      /*
        Не используем браузерный кеш.
      */

      url.searchParams.set(
        "_",
        Date.now()
      );


      const response =
        await fetch(
          url.toString(),
          {
            cache:
              "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );
      }


      const data =
        await response.json();


      if (
        data &&
        data.ok === false
      ) {

        throw new Error(
          data.error ||
          "Ошибка API"
        );
      }


      return data;
    }

          year,

        month:
          month + 1,

        year:

        label:

    /* =====================================================
       LIVE RANKING UPDATE

       Не удаляем карточки при каждом обновлении.
       Меняем существующие элементы и используем
       FLIP-анимацию для перемещения по рейтингу.
       ===================================================== */

    function updateLiveRanking(people) {

      if (!Array.isArray(people) || !people.length) {
        return;
      }

      /*
        Храним только самое свежее положение рейтинга.
        Если новый ответ API пришёл, пока карточки ещё
        переставляются, после текущего шага анимация
        продолжится уже к новому порядку.
      */
      state.pendingRankingPeople =
        people.map(person => ({ ...person }));

      const existingCards =
        new Map();

      Array.from(
        rankingEl.querySelectorAll(".rank-card")
      ).forEach(card => {
        const name =
          card.dataset.personName || "";

        if (name) {
          existingCards.set(name, card);
        }
      });

      const incomingNames =
        new Set(
          people.map(person => person.name)
        );

      existingCards.forEach((card, name) => {
        if (!incomingNames.has(name)) {
          card.remove();
        }
      });

      /*
        Проценты меняем сразу и плавно, но место/медаль
        пока оставляем соответствующими текущему визуальному
        положению карточки.
      */
      people.forEach(person => {
        let card =
          existingCards.get(person.name);

        if (!card) {
          card = createRankingCard(
            person,
            rankingEl.querySelectorAll(".rank-card").length,
            true
          );

          card.classList.add("new-card");
          rankingEl.appendChild(card);
          existingCards.set(person.name, card);
        }

        const currentCards =
          Array.from(
            rankingEl.querySelectorAll(".rank-card")
          );

        const currentIndex =
          Math.max(
            0,
            currentCards.indexOf(card)
          );

        updateRankingCard(
          card,
          person,
          currentIndex
        );
      });

      refreshRankingPlaces();
      runRankingReorderQueue();
    }


    const RANKING_ANIMATION_MS = 3000;
    const RANKING_EASING =
      "cubic-bezier(.22,.72,.18,1)";

    /*
      Процент двигается с адаптивной скоростью.
      Чем больше разница между старым и новым значением,
      тем больше времени даём анимации, чтобы даже большой
      скачок выглядел спокойно и плавно.
    */
    const PERCENT_ANIMATION_MIN_MS = 3000;
    const PERCENT_ANIMATION_MAX_MS = 7500;

    function getPercentAnimationDuration(from, to) {
      const delta =
        Math.abs(
          Number(to) - Number(from)
        );

      if (!Number.isFinite(delta)) {
        return PERCENT_ANIMATION_MIN_MS;
      }

      /*
        До 4 процентных пунктов — стандартные 3 секунды.
        Дальше постепенно добавляем время.
        Примеры:
        4 п.п.  → 3.0 с
        10 п.п. → 3.7 с
        20 п.п. → 4.9 с
        40 п.п. → 7.3 с
      */
      return Math.min(
        PERCENT_ANIMATION_MAX_MS,
        PERCENT_ANIMATION_MIN_MS +
          Math.max(0, delta - 4) * 120
      );
    }


    function buildAdjacentSwapPlan(
      currentNames,
      targetPeople
    ) {

      const targetNames =
        targetPeople.map(
          person => person.name
        );

      const targetPercentByName =
        new Map(
          targetPeople.map(
            person => [
              person.name,
              clampPercent(person.percent)
            ]
          )
        );

      const working =
        currentNames.slice();

      const plan = [];


      /*
        Формируем последовательность соседних обгонов.

        Дополнительно каждому обгону назначаем "расстояние
        по процентной шкале". Чем дальше друг от друга
        проценты двух соседних участников, тем медленнее
        проходит этот участок движения. Если проценты рядом —
        обгон происходит быстрее.

        В итоге карточка движется не одинаковыми шагами
        по списку, а словно по невидимой шкале процентов.
      */

      for (
        let targetIndex = 0;
        targetIndex < targetNames.length;
        targetIndex++
      ) {

        const wantedName =
          targetNames[targetIndex];

        let currentIndex =
          working.indexOf(wantedName);

        if (currentIndex < 0) {
          continue;
        }


        while (
          currentIndex >
          targetIndex
        ) {

          const upperIndex =
            currentIndex - 1;

          const displacedName =
            working[upperIndex];

          const movingPercent =
            targetPercentByName.get(
              wantedName
            );

          const displacedPercent =
            targetPercentByName.get(
              displacedName
            );

          /*
            Небольшой минимальный "метр" нужен, чтобы
            равные или почти равные проценты всё равно
            давали заметный, но короткий визуальный обгон.
          */
          const scaleGap =
            Number.isFinite(movingPercent) &&
            Number.isFinite(displacedPercent)
              ? Math.max(
                  0.35,
                  Math.abs(
                    movingPercent -
                    displacedPercent
                  )
                )
              : 1;


          plan.push({
            movingName: wantedName,
            displacedName,
            scaleGap
          });


          working[upperIndex] =
            wantedName;

          working[currentIndex] =
            displacedName;

          currentIndex--;
        }
      }


      return plan;
    }


    function getRankingScaleAnimationDuration(
      targetPeople
    ) {

      /*
        Общая длительность перемещения карточек берётся
        из той же логики, что и анимация процентов.

        Если кто-то изменился сильно — вся перестановка
        получает больше времени. Это позволяет движению
        карточек и изменению чисел ощущаться как одна шкала.
      */

      let maxDuration =
        PERCENT_ANIMATION_MIN_MS;


      targetPeople.forEach(person => {

        const card =
          Array.from(
            rankingEl.querySelectorAll(
              ".rank-card"
            )
          ).find(
            item =>
              item.dataset.personName ===
              person.name
          );

        if (!card) {
          return;
        }

        const visual =
          Number(
            card.dataset.visualPercent
          );

        const stored =
          Number(
            card.dataset.percent
          );

        const from =
          Number.isFinite(visual)
            ? visual
            : stored;

        const to =
          clampPercent(person.percent);

        if (
          Number.isFinite(from) &&
          Number.isFinite(to)
        ) {
          maxDuration =
            Math.max(
              maxDuration,
              getPercentAnimationDuration(
                from,
                to
              )
            );
        }
      });


      return Math.min(
        PERCENT_ANIMATION_MAX_MS,
        maxDuration
      );
    }


    async function animateAdjacentRankingSwap(
      moving,
      displaced,
      duration
    ) {

      if (
        !moving ||
        !displaced
      ) {
        return;
      }


      const movingFirst =
        moving.getBoundingClientRect();

      const displacedFirst =
        displaced.getBoundingClientRect();


      /*
        DOM меняется на следующий соседний порядок.
      */

      rankingEl.insertBefore(
        moving,
        displaced
      );


      const movingLast =
        moving.getBoundingClientRect();

      const displacedLast =
        displaced.getBoundingClientRect();


      const movingDy =
        movingFirst.top -
        movingLast.top;

      const displacedDy =
        displacedFirst.top -
        displacedLast.top;


      /*
        Обе карточки визуально остаются на старых местах.
      */

      moving.style.transition = "none";
      displaced.style.transition = "none";

      moving.style.transform =
        `translate3d(0, ${movingDy}px, 0)`;

      displaced.style.transform =
        `translate3d(0, ${displacedDy}px, 0)`;

      moving.style.willChange =
        "transform";

      displaced.style.willChange =
        "transform";

      moving.style.zIndex = "4";
      displaced.style.zIndex = "3";


      void rankingEl.offsetHeight;


      /*
        Затем одновременно меняются местами.
        Это и создаёт эффект настоящего обгона:
        один занимает место другого, второй — освободившееся место.
      */

      await new Promise(resolve => {

        requestAnimationFrame(() => {

          requestAnimationFrame(() => {

            const transition =
              `transform ${duration}ms ${RANKING_EASING}`;

            moving.style.transition =
              transition;

            displaced.style.transition =
              transition;

            moving.style.transform =
              "translate3d(0, 0, 0)";

            displaced.style.transform =
              "translate3d(0, 0, 0)";

            setTimeout(
              resolve,
              duration + 8
            );
          });
        });
      });


      moving.style.transition = "";
      displaced.style.transition = "";

      moving.style.transform = "";
      displaced.style.transform = "";

      moving.style.willChange = "";
      displaced.style.willChange = "";

      moving.style.zIndex = "";
      displaced.style.zIndex = "";


      /*
        После каждого конкретного обгона сразу обновляем места,
        чтобы визуальная последовательность была понятной.
      */

      refreshRankingPlaces();
    }


    async function runRankingReorderQueue() {

      if (state.rankingAnimationRunning) {
        return;
      }

      state.rankingAnimationRunning = true;


      try {

        while (state.pendingRankingPeople) {

          const targetPeople =
            state.pendingRankingPeople;

          state.pendingRankingPeople =
            null;


          const targetNames =
            targetPeople.map(
              person => person.name
            );


          const currentNames =
            Array.from(
              rankingEl.querySelectorAll(".rank-card")
            ).map(
              card =>
                card.dataset.personName || ""
            );


          const swapPlan =
            buildAdjacentSwapPlan(
              currentNames,
              targetPeople
            );

          const rankingScaleDuration =
            getRankingScaleAnimationDuration(
              targetPeople
            );


          if (!swapPlan.length) {

            /*
              Если места не изменились — всё равно даём шкале
              и процентам закончить общий 3-секундный цикл.
            */

            await new Promise(resolve =>
              setTimeout(
                resolve,
                rankingScaleDuration
              )
            );

            refreshRankingPlaces();

            continue;
          }


          /*
            ВРЕМЯ ДВИЖЕНИЯ ПО "НЕВИДИМОЙ ШКАЛЕ".

            Раньше каждый соседний обгон занимал одинаковое
            время. Теперь длительность каждого участка
            зависит от разницы процентов между двумя
            соседними карточками.

            Большой разрыв процентов = более длинный участок.
            Маленький разрыв = короткий участок.

            Общая длительность сопоставима с анимацией
            изменения процентов.
          */

          const totalScaleGap =
            swapPlan.reduce(
              (sum, step) =>
                sum + step.scaleGap,
              0
            ) || 1;

          const minimumSwapMs = 150;

          const startedAt =
            performance.now();


          for (
            let i = 0;
            i < swapPlan.length;
            i++
          ) {

            const step =
              swapPlan[i];


            const cards =
              Array.from(
                rankingEl.querySelectorAll(".rank-card")
              );


            const moving =
              cards.find(
                card =>
                  card.dataset.personName ===
                  step.movingName
              );


            const displaced =
              cards.find(
                card =>
                  card.dataset.personName ===
                  step.displacedName
              );


            /*
              Длительность конкретного соседнего обгона
              пропорциональна расстоянию процентов.

              Например:
              91,0 ↔ 91,4  — быстрый короткий шаг;
              82,0 ↔ 91,0  — заметно более длинный шаг.
            */

            const elapsed =
              performance.now() -
              startedAt;

            const remainingTime =
              Math.max(
                minimumSwapMs,
                rankingScaleDuration -
                elapsed
              );

            const remainingWeight =
              swapPlan
                .slice(i)
                .reduce(
                  (sum, item) =>
                    sum + item.scaleGap,
                  0
                ) || step.scaleGap;

            const proportionalDuration =
              remainingTime *
              (
                step.scaleGap /
                remainingWeight
              );

            const duration =
              Math.max(
                minimumSwapMs,
                proportionalDuration
              );


            await animateAdjacentRankingSwap(
              moving,
              displaced,
              duration
            );
          }


          refreshRankingPlaces();
        }

      } finally {

        state.rankingAnimationRunning = false;

        if (state.pendingRankingPeople) {
          runRankingReorderQueue();
        }
      }
    }


    function refreshRankingPlaces() {

      Array.from(
        rankingEl.querySelectorAll(".rank-card")
      ).forEach((card, index) => {

        card.classList.toggle("first", index === 0);
        card.classList.toggle("second", index === 1);
        card.classList.toggle("third", index === 2);

        const placeEl =
          card.querySelector(".place");

        if (placeEl) {
          placeEl.textContent =
            getPlaceIcon(index);
        }
      });
    }


    function createRankingCard(
      person,
      index,
      clickableScale = true
    ) {

      const card =
        document.createElement("article");

      card.className = "rank-card";
      card.dataset.personName = person.name;


      /*

      card.setAttribute(

      );

      card.setAttribute(
        "tabindex",

      );

      card.setAttribute(

      );

        "click",

            Если внутри карточки позже появятся отдельные кнопки,

          */

            event.target.closest(

      );

      card.innerHTML = `

          class="person-name"

          </div>

            clickableScale
              ? '<span class="bar-hint">нажмите для истории</span>'
              : ""
          }
        </div>

        <div class="percent"></div>
      `;

      if (clickableScale) {

          card.querySelector(".bar-wrap");

      updateRankingCard(

    function updateRankingCard(
      card,
      person,
      index,
      immediate = false
    ) {

      const newPercent =
        clampPercent(person.percent);

      /*
        Берём именно ТЕКУЩЕЕ визуальное значение.
        Если новый ответ приходит во время незавершённой
        анимации, новая анимация продолжится с текущей цифры,
        а не прыгнет со старой цели.
      */
      const visualPercent =
        Number(card.dataset.visualPercent);

      const oldPercent =
        Number.isFinite(visualPercent)
          ? visualPercent
          : Number(card.dataset.percent);

      card.dataset.personName = person.name;

      card.classList.toggle("first", index === 0);
      card.classList.toggle("second", index === 1);
      card.classList.toggle("third", index === 2);

      const placeEl =
        card.querySelector(".place");

      const nameEl =
        card.querySelector(".person-name");

      const fillEl =
        card.querySelector(".bar-fill");

      const percentEl =
        card.querySelector(".percent");

      if (placeEl) {
        placeEl.textContent =
          getPlaceIcon(index);
      }

      if (nameEl) {
        nameEl.textContent = person.name;
        nameEl.title = person.name;
      }

      if (
        immediate ||
        !Number.isFinite(oldPercent)
      ) {
        if (fillEl) {
          fillEl.style.width =
            newPercent + "%";
        }

        if (percentEl) {
          percentEl.textContent =
            formatPercent(newPercent);
        }

        card.dataset.percent =
          String(newPercent);

        card.dataset.visualPercent =
          String(newPercent);

      } else if (
        Math.abs(oldPercent - newPercent) > 0.0001
      ) {

        const percentAnimationMs =
          getPercentAnimationDuration(
            oldPercent,
            newPercent
          );

        /*
          Число и шкала теперь двигаются ОДНИМ requestAnimationFrame.
          Поэтому шкала в каждый момент точно соответствует
          отображаемому проценту и останавливается одновременно с ним.
        */
        animatePercentValue(
          percentEl,
          oldPercent,
          newPercent,
          percentAnimationMs,
          card,
          fillEl
        );

        if (percentEl) {
          percentEl.classList.add(
            "value-changed"
          );

          setTimeout(
            () => {
              percentEl.classList.remove(
                "value-changed"
              );
            },
            260
          );
        }

        card.dataset.percent =
          String(newPercent);
      }

      if (percentEl) {
        percentEl.classList.toggle(
          "green",
          newPercent >= 90
        );
      }
    }


    function animatePercentValue(
      element,
      from,
      to,
      duration = PERCENT_ANIMATION_MIN_MS,
      card = null,
      fillElement = null
    ) {

      if (!element) {
        return;
      }

      const startValue =
        Number(from);

      const endValue =
        Number(to);

      if (
        !Number.isFinite(startValue) ||
        !Number.isFinite(endValue)
      ) {
        element.textContent =
          formatPercent(endValue);

        if (fillElement) {
          fillElement.style.width =
            clampPercent(endValue) + "%";
        }

        return;
      }


      const animationId =
        String(Date.now()) + Math.random();

      element.dataset.animationId =
        animationId;


      /*
        Число меняется ровно столько же,
        сколько перемещается карточка и заполняется шкала:
        3000 мс.

        Длительность зависит от размера изменения.
        На каждом кадре значение округляется до сотых,
        поэтому движение остаётся непрерывным и мягким.
      */

      const startedAt =
        performance.now();


      function frame(now) {

        if (
          element.dataset.animationId !==
          animationId
        ) {
          return;
        }


        const rawProgress =
          Math.min(
            1,
            Math.max(
              0,
              (now - startedAt) /
              Math.max(1, duration)
            )
          );


        /*
          То же ощущение ускорения/мягкого торможения,
          что и у движения карточек.
          Используем smoothstep — плавно без рывка на старте
          и без резкой остановки в конце.
        */

        const eased =
          rawProgress *
          rawProgress *
          (3 - 2 * rawProgress);


        const currentValue =
          Math.round(
            (
              startValue +
              (endValue - startValue) * eased
            ) * 100
          ) / 100;


        element.textContent =
          formatPercent(currentValue);

        if (fillElement) {
          fillElement.style.width =
            clampPercent(currentValue) + "%";
        }

        if (card) {
          card.dataset.visualPercent =
            String(currentValue);
        }


        element.classList.toggle(
          "green",
          currentValue >= 90
        );


        if (rawProgress < 1) {
          requestAnimationFrame(frame);
        } else {
          element.textContent =
            formatPercent(endValue);

          if (fillElement) {
            fillElement.style.width =
              clampPercent(endValue) + "%";
          }

          if (card) {
            card.dataset.visualPercent =
              String(endValue);
          }

          element.classList.toggle(
            "green",
            endValue >= 90
          );
        }
      }


      element.textContent =
        formatPercent(startValue);

      if (fillElement) {
        fillElement.style.width =
          clampPercent(startValue) + "%";
      }

      if (card) {
        card.dataset.visualPercent =
          String(startValue);
      }

      requestAnimationFrame(frame);
    }

    function ensureArchiveStartYear() {
      const periods = state.archivePeriods || [];

      if (!periods.length) {
        state.archiveSelectedYear = null;
        state.archiveSelectedPeriod = null;
        return;
      }

      const years = [...new Set(periods.map(item => item.year))]
        .sort((a, b) => b - a);

      if (!years.includes(state.archiveSelectedYear)) {
        state.archiveSelectedYear = years[0];
      }

    function enterArchiveMonth(period) {
      if (!period) {
        return Promise.resolve();
      }

      state.archiveSelectedYear = period.year;
      state.archiveSelectedPeriod = period.key;
      showArchiveDetail();

      return loadArchiveMonth(period);
    }


    function getShiftedArchivePeriod(direction) {
      const periods = (state.archivePeriods || [])
        .slice()
        .sort((a, b) => a.sort - b.sort);

      if (!periods.length) {
        return null;
      }

      let index = periods.findIndex(
        item => item.key === state.archiveSelectedPeriod
      );

      if (index < 0) {
        index = periods.length - 1;
      }

      const nextIndex = index + direction;

      if (nextIndex < 0 || nextIndex >= periods.length) {
        return null;
      }

      return periods[nextIndex];
    }


    function shiftArchiveMonth(direction) {
      const period =
        getShiftedArchivePeriod(direction);

      if (!period) {
        return Promise.resolve(false);
      }

      return enterArchiveMonth(period)
        .then(() => true);
    }


    let archiveSwipeAnimating = false;
    let archiveSwipeCurrentX = 0;


    async function animateArchiveSwipe(
      direction,
      startX = 0
    ) {

      if (archiveSwipeAnimating) {
        return;
      }


      const nextPeriod =
        getShiftedArchivePeriod(direction);


      const width =
        Math.max(
          1,
          archiveDetail.clientWidth
        );


      if (!nextPeriod) {

        /*
          Граница архива — мягкий отскок с текущего положения.
        */

        archiveSwipeAnimating = true;

        archiveRankingEl.style.transition =
          "transform 320ms cubic-bezier(.2,.8,.18,1), opacity 260ms ease";

        archiveRankingEl.style.transform =
          "translate3d(0, 0, 0)";

        archiveRankingEl.style.opacity =
          "1";


        await new Promise(resolve =>
          setTimeout(resolve, 330)
        );


        archiveRankingEl.style.transition = "";
        archiveSwipeAnimating = false;
        archiveSwipeCurrentX = 0;

        return;
      }


      archiveSwipeAnimating = true;


      /*
        Направление строго соответствует пальцу:
        свайп влево -> текущий месяц улетает влево,
        свайп вправо -> текущий месяц улетает вправо.
      */

      const exitX =
        direction > 0
          ? -width * 1.14
          : width * 1.14;


      const enterX =
        direction > 0
          ? width * 1.04
          : -width * 1.04;


      /*
        ВАЖНО:
        не возвращаем карточки в центр после отпускания пальца.
        Продолжаем движение ровно с той точки, до которой
        пользователь уже дотянул содержимое.
      */

      archiveRankingEl.style.transition =
        "none";

      archiveRankingEl.style.transform =
        `translate3d(${startX}px, 0, 0)`;


      void archiveRankingEl.offsetHeight;


      await new Promise(resolve => {

        requestAnimationFrame(() => {

          archiveRankingEl.style.transition =
            "transform 520ms cubic-bezier(.16,.82,.18,1), opacity 430ms ease";

          archiveRankingEl.style.transform =
            `translate3d(${exitX}px, 0, 0)`;

          archiveRankingEl.style.opacity =
            "0";

          setTimeout(resolve, 530);
        });
      });


      /*
        Новый месяц появляется строго с противоположной стороны,
        уже за пределами окна.
      */

      archiveRankingEl.style.transition =
        "none";

      archiveRankingEl.style.transform =
        `translate3d(${enterX}px, 0, 0)`;

      archiveRankingEl.style.opacity =
        "0";


      await enterArchiveMonth(
        nextPeriod
      );


      void archiveRankingEl.offsetHeight;


      /*
        И плавно заезжает в центр.
      */

      await new Promise(resolve => {

        requestAnimationFrame(() => {

          requestAnimationFrame(() => {

            archiveRankingEl.style.transition =
              "transform 540ms cubic-bezier(.16,.82,.18,1), opacity 430ms ease";

            archiveRankingEl.style.transform =
              "translate3d(0, 0, 0)";

            archiveRankingEl.style.opacity =
              "1";

            setTimeout(resolve, 550);
          });
        });
      });


      archiveRankingEl.style.transition = "";
      archiveRankingEl.style.transform = "";
      archiveRankingEl.style.opacity = "";

      archiveSwipeCurrentX = 0;
      archiveSwipeAnimating = false;
    }

    async function loadArchiveMonth(
      period
    ) {
      /*
        v157:
        До 5-го числа предыдущий месяц загружаем НАПРЯМУЮ
        с сервера и полностью игнорируем архивный клиентский кеш.

        Например 3 сентября:
        АВГУСТ2026 -> live API -> свежие данные из таблиц.
      */
      if (
        isPreviousMonthStillLiveV156(
          period
        )
      ) {
        showRankingLoader(
          archiveRankingEl
        );

        try {
          /*
            Удаляем старое значение из памяти, чтобы август
            не мог остаться замороженным после предыдущего открытия.
          */
          if (
            period &&
            period.key
          ) {
            state.archiveRankingCache
              .delete(period.key);
          }

          const liveData =
            await api({
              mode: "month",
              period: period.key,
              fresh: "1"
            });

          const livePeople =
            sanitizePeople(
              getRankingArray(
                liveData
              )
            );

          /*
            В память текущего сеанса кладём только свежий ответ.
            localStorage для live-предыдущего месяца не используем.
          */
          state.archiveRankingCache
            .set(
              period.key,
              livePeople
            );

          renderArchiveMonthResult(
            period,
            livePeople
          );

          return;

        } catch (error) {
          console.error(
            "Ошибка LIVE-загрузки предыдущего месяца:",
            error
          );

          showEmpty(
            archiveRankingEl,
            "Не удалось обновить данные этого месяца"
          );

          return;
        }
      }


      showRankingLoader(
        archiveRankingEl
      );


      /*
        Если пользователь уже открывал
        этот месяц, используем
        клиентский кеш.
      */

      if (
        state.archiveRankingCache
          .has(period.key)
      ) {

        const cached =
          state.archiveRankingCache
            .get(period.key);


        renderArchiveMonthResult(
          period,
          cached
        );

        return;
      }


      try {

        const data =
          await api({
            mode:
              "month",

            period:
              period.key
          });


        const people =
          sanitizePeople(
            getRankingArray(
              data
            )
          );


        state.archiveRankingCache
          .set(
            period.key,
            people
          );


        /*
          v152:
          fixed archive сохраняем и между перезапусками приложения.
          Live-период 1–5 числа сюда не попадёт, пока сервер
          не вернёт archive:true.
        */
        if (
          data &&
          data.archive === true
        ) {

          const local =
            readArchiveBundleLocalV147();

          if (local) {

            local.rankings =
              local.rankings &&
              typeof local.rankings === "object"
                ? local.rankings
                : {};

            local.rankings[period.key] =
              people;

            writeArchiveBundleLocalV147(
              local
            );
          }
        }


        renderArchiveMonthResult(
          period,
          people
        );


      } catch (error) {

        console.error(
          error
        );


        showEmpty(
          archiveRankingEl,
          "Не удалось загрузить этот месяц"
        );
      }
    }

      */

    /* =====================================================
       HISTORY
       ===================================================== */

    function normalizeHistoryData(
      data
    ) {

      const result = {
        people: {},
        periods: []
      };


      const periodMap =
        new Map();


      /*
        Новый формат Code.gs:

        people: [
          {
            name,
            history:[...]
          }
        ]
      */

      if (
        Array.isArray(
          data.people
        )
      ) {

        data.people.forEach(
          person => {

            const name =
              String(
                person.name || ""
              ).trim();


            if (!name) {
              return;
            }


            const rows =
              normalizeHistoryRows(
                person.history
              );


            result.people[name] =
              rows;


            rows.forEach(
              row => {

                periodMap.set(
                  row.period,
                  {
                    key:
                      row.period,

                    year:
                      row.year,

                    month:
                      row.month,

                    sort:
                      row.sort
                  }
                );
              }
            );
          }
        );
      }


      /*
        Совместимость со старым
        форматом объекта.
      */

      else if (
        data.people &&
        typeof data.people ===
          "object"
      ) {

        Object
          .entries(
            data.people
          )
          .forEach(
            ([name, rows]) => {

              const normalized =
                normalizeHistoryRows(
                  rows
                );


              result.people[name] =
                normalized;


              normalized.forEach(
                row => {

                  periodMap.set(
                    row.period,
                    {
                      key:
                        row.period,

                      year:
                        row.year,

                      month:
                        row.month,

                      sort:
                        row.sort
                    }
                  );
                }
              );
            }
          );
      }


      result.periods =
        [
          ...periodMap.values()
        ]
          .sort(
            (a, b) =>
              a.sort -
              b.sort
          );


      return result;
    }


    function normalizeHistoryRows(
      rows
    ) {

      if (
        !Array.isArray(
          rows
        )
      ) {
        return [];
      }


      return rows
        .map(
          row => {

            const year =
              Number(
                row.year
              );


            const month =
              Number(
                row.month
              );


            const percent =
              Number(
                row.percent
              );


            return {
              period:
                String(
                  row.period || ""
                ),

              year:
                year,

              month:
                month,

              sort:
                Number(
                  row.sort ||
                  (
                    year *
                    100 +
                    month
                  )
                ),

              percent:
                percent,

              label:
                row.label ||
                (
                  MONTH_NAMES[
                    month - 1
                  ] +
                  " " +
                  year
                )
            };
          }
        )
        .filter(
          row =>
            row.period &&
            Number.isFinite(
              row.year
            ) &&
            Number.isFinite(
              row.month
            ) &&
            isSafePercent(
              row.percent
            )
        )
        .sort(
          (a, b) =>
            a.sort -
            b.sort
        );
    }

    const CHART_PERSON_COLORS = [
      "#00C2FF",  // голубой
      "#FF9500",  // оранжевый
      "#FF3B30",  // красный
      "#D946EF",  // яркий пурпурный
      "#22C55E",  // зелёный
      "#FFD60A",  // жёлтый
      "#7C4DFF",  // индиго
      "#FF6B9A",  // розовый
      "#00E5B0",  // мятно-бирюзовый
      "#D4A373",  // песочно-коричневый
      "#F2F2F7",  // светлый
      "#5AC8FA"   // небесный
    ];


    function hashPersonName(name) {
      const text = String(name || "");
      let hash = 2166136261;

      for (let i = 0; i < text.length; i++) {
        hash ^= text.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }

      return hash >>> 0;
    }


    function buildPersonChartColorMap() {

      const map = new Map();

      const names =
        state.historyData &&
        state.historyData.people
          ? Object.keys(state.historyData.people)
          : [];

      names.sort((a, b) =>
        a.localeCompare(b, "ru")
      );

      names.forEach((name, index) => {
        map.set(
          name,
          CHART_PERSON_COLORS[
            index % CHART_PERSON_COLORS.length
          ]
        );
      });

      return map;
    }


    function getPersonChartColor(
      name,
      colorMap
    ) {

      const map =
        colorMap ||
        buildPersonChartColorMap();

      if (map.has(name)) {
        return map.get(name);
      }

      return CHART_PERSON_COLORS[
        hashPersonName(name) %
        CHART_PERSON_COLORS.length
      ];
    }


    function renderCompareChart() {

      const svg =
        compareChartEl;


      svg.innerHTML =
        "";


      if (
        !state.historyData
      ) {
        return;
      }


      const selected =
        [
          ...state.selectedComparePeople
        ];


      if (
        selected.length === 0
      ) {

        addSvgText(
          svg,
          450,
          185,
          "Выберите участников для сравнения",
          "#8e9bb7",
          "middle",
          15
        );

        return;
      }


      const periods =
        Array.isArray(
          state.historyData.periods
        )
          ? state.historyData.periods
          : [];


      if (
        periods.length === 0
      ) {
        return;
      }


      const width =
        900;

      const height =
        390;

      svg.setAttribute(
        "viewBox",
        `0 0 ${width} ${height}`
      );

      svg.setAttribute(
        "height",
        String(height)
      );


      const left =
        55;

      const right =
        22;

      const top =
        42;

      const bottom =
        72;

      const chartWidth =
        width -
        left -
        right;

      const chartHeight =
        height -
        top -
        bottom;


      const minY =
        70;

      const maxY =
        100;


      /*
        Горизонтальная шкала.
        Граница 90% выделена отдельно.
      */

      for (
        let value = 70;
        value <= 100;
        value += 5
      ) {

        const y =
          top +
          chartHeight *
          (
            1 -
            (
              value -
              minY
            ) /
            (
              maxY -
              minY
            )
          );


        const isTarget =
          value === 90;


        const line =
          document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
          );


        line.setAttribute(
          "x1",
          left
        );

        line.setAttribute(
          "y1",
          y
        );

        line.setAttribute(
          "x2",
          width - right
        );

        line.setAttribute(
          "y2",
          y
        );

        line.setAttribute(
          "stroke",
          isTarget
            ? "rgba(49,216,121,.78)"
            : "rgba(255,255,255,.09)"
        );

        line.setAttribute(
          "stroke-width",
          isTarget
            ? "1.35"
            : "1"
        );

        svg.appendChild(
          line
        );


        addSvgText(
          svg,
          46,
          y + 4,
          value + "%",
          isTarget
            ? "#31d879"
            : "#8e9bb7",
          "end",
          isTarget
            ? 12
            : 11
        );
      }


      /*
        Месяцы показываем одной буквой.
        Год выводим отдельной строкой.
        При смене года рисуем вертикальную границу.
      */

      const monthLetters =
        [
          "Я", "Ф", "М", "А",
          "М", "И", "И", "А",
          "С", "О", "Н", "Д"
        ];


      periods.forEach(
        (period, index) => {

          const x =
            getChartX(
              index,
              periods.length,
              left,
              chartWidth
            );


          addSvgText(
            svg,
            x,
            height - 37,
            monthLetters[
              period.month - 1
            ] || "",
            "#aab6cd",
            "middle",
            10
          );


          const previous =
            index > 0
              ? periods[index - 1]
              : null;


          if (
            previous &&
            previous.year !==
              period.year
          ) {

            const previousX =
              getChartX(
                index - 1,
                periods.length,
                left,
                chartWidth
              );


            const boundaryX =
              (
                previousX +
                x
              ) / 2;


            const boundary =
              document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
              );


            boundary.setAttribute(
              "x1",
              boundaryX
            );

            boundary.setAttribute(
              "y1",
              top
            );

            boundary.setAttribute(
              "x2",
              boundaryX
            );

            boundary.setAttribute(
              "y2",
              height - 27
            );

            boundary.setAttribute(
              "stroke",
              "rgba(255,255,255,.20)"
            );

            boundary.setAttribute(
              "stroke-width",
              "1.2"
            );

            boundary.setAttribute(
              "stroke-dasharray",
              "3 5"
            );


            svg.appendChild(
              boundary
            );
          }
        }
      );


      const yearGroups =
        [];


      periods.forEach(
        (period, index) => {

          const last =
            yearGroups[
              yearGroups.length - 1
            ];


          if (
            !last ||
            last.year !==
              period.year
          ) {

            yearGroups.push({
              year:
                period.year,

              start:
                index,

              end:
                index
            });

          } else {

            last.end =
              index;
          }
        }
      );


      yearGroups.forEach(
        group => {

          const startX =
            getChartX(
              group.start,
              periods.length,
              left,
              chartWidth
            );


          const endX =
            getChartX(
              group.end,
              periods.length,
              left,
              chartWidth
            );


          addSvgText(
            svg,
            (startX + endX) / 2,
            height - 15,
            String(
              group.year
            ),
            "#667795",
            "middle",
            10
          );
        }
      );


      const personColorMap =
        buildPersonChartColorMap();


      selected.forEach(
        name => {

          const rows =
            state.historyData.people[
              name
            ] || [];


          const map =
            new Map();


          rows.forEach(
            row => {

              if (
                isSafePercent(
                  row.percent
                )
              ) {

                map.set(
                  row.period,
                  Number(
                    row.percent
                  )
                );
              }
            }
          );


          /*
            Цвет зависит только от имени.
            Поэтому добавление другого человека
            больше не меняет цвета уже выбранных.
          */

          const color =
            getPersonChartColor(
              name,
              personColorMap
            );


          let path =
            "";

          let started =
            false;


          periods.forEach(
            (period, index) => {

              const value =
                map.get(
                  period.key
                );


              if (
                value === undefined
              ) {

                /*
                  Нет значения за этот месяц:
                  точку не рисуем, но линию не обрываем.
                  Следующая реальная точка соединится
                  с предыдущей реальной точкой.

                  Это не создаёт выдуманных значений —
                  на пропущенном месяце по-прежнему нет точки.
                */

                return;
              }


              const x =
                getChartX(
                  index,
                  periods.length,
                  left,
                  chartWidth
                );


              const clamped =
                Math.max(
                  minY,
                  Math.min(
                    maxY,
                    value
                  )
                );


              const y =
                top +
                chartHeight *
                (
                  1 -
                  (
                    clamped -
                    minY
                  ) /
                  (
                    maxY -
                    minY
                  )
                );


              if (!started) {

                path +=
                  `M ${x} ${y} `;

                started =
                  true;

              } else {

                path +=
                  `L ${x} ${y} `;
              }


              const circle =
                document.createElementNS(
                  "http://www.w3.org/2000/svg",
                  "circle"
                );


              circle.setAttribute(
                "cx",
                x
              );

              circle.setAttribute(
                "cy",
                y
              );

              circle.setAttribute(
                "r",
                "3.5"
              );

              circle.setAttribute(
                "fill",
                color
              );


              svg.appendChild(
                circle
              );
            }
          );


          const pathEl =
            document.createElementNS(
              "http://www.w3.org/2000/svg",
              "path"
            );


          pathEl.setAttribute(
            "d",
            path
          );

          pathEl.setAttribute(
            "fill",
            "none"
          );

          pathEl.setAttribute(
            "stroke",
            color
          );

          pathEl.setAttribute(
            "stroke-width",
            "2.5"
          );

          pathEl.setAttribute(
            "stroke-linecap",
            "round"
          );

          pathEl.setAttribute(
            "stroke-linejoin",
            "round"
          );


          svg.appendChild(
            pathEl
          );
        }
      );


      /*
        Легенда рисуется после линий
        и тоже использует постоянный цвет человека.
      */

      selected.forEach(
        (name, index) => {

          addSvgText(
            svg,
            left + 8,
            18 +
              index * 16,
            name,
            getPersonChartColor(
              name,
              personColorMap
            ),
            "start",
            10
          );
        }
      );
    }
