<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Рейтинг команды</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 22px 14px 40px;

  min-height: 100vh;

  background:
    radial-gradient(
      circle at top,
      #172554,
      #07111f 55%
    );

  color: #fff;

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

.container {
  width: 100%;
  max-width: 850px;
  margin: 0 auto;
}

h1 {
  margin: 0;

  text-align: center;

  font-size: 34px;
}

.subtitle {
  margin-top: 5px;

  text-align: center;

  color: #94a3b8;

  font-size: 14px;
}


/* =============================
   НАВИГАЦИЯ
============================= */

.top-nav {
  display: flex;

  justify-content: space-between;
  align-items: center;

  margin: 18px 0 12px;

  gap: 10px;
}

.back-button,
.compare-button {

  border: 1px solid rgba(255,255,255,.12);

  background: rgba(255,255,255,.07);

  color: white;

  min-height: 42px;

  padding: 9px 14px;

  border-radius: 12px;

  cursor: pointer;

  font-size: 13px;
}

.back-button:hover,
.compare-button:hover {

  background:
    rgba(255,255,255,.12);
}


/* =============================
   ЗАГОЛОВОК МЕСЯЦА
============================= */

.period-title {

  margin: 14px 0 13px;

  text-align: center;

  font-size: 23px;

  font-weight: 800;
}


/* =============================
   КАРТОЧКИ
============================= */

.cards {
  display: flex;

  flex-direction: column;

  gap: 8px;
}

.card {

  display: grid;

  grid-template-columns:
    55px
    minmax(0,1fr)
    100px;

  gap: 12px;

  align-items: center;

  padding: 13px 17px;

  border-radius: 16px;

  background:
    rgba(15,23,42,.78);

  border:
    1px solid rgba(255,255,255,.08);

  cursor: pointer;

  transition:
    transform .18s ease,
    background .18s ease;
}

.card:hover {

  transform: translateY(-1px);

  background:
    rgba(30,41,59,.9);
}

.card.rank-1 {
  border-color:
    rgba(250,204,21,.65);
}

.card.rank-2 {
  border-color:
    rgba(203,213,225,.5);
}

.card.rank-3 {
  border-color:
    rgba(180,83,9,.65);
}

.rank {

  font-size: 25px;

  font-weight: 800;
}

.name {

  overflow: hidden;

  font-size: 19px;

  font-weight: 700;

  text-overflow: ellipsis;
}

.percent {

  min-width: 90px;

  text-align: right;

  font-size: 23px;

  font-weight: 900;

  font-variant-numeric:
    tabular-nums;
}


/* =============================
   ШКАЛА
============================= */

.bar-wrapper {

  grid-column: 2 / 3;

  margin-top: 7px;
}

.bar {

  position: relative;

  width: 100%;
  height: 10px;

  overflow: hidden;

  border-radius: 100px;

  background:
    rgba(255,255,255,.08);
}

.fill {

  position: absolute;

  z-index: 1;

  top: 0;
  left: 0;
  bottom: 0;

  border-radius: 100px;

  background:
    linear-gradient(
      90deg,
      #38bdf8,
      #22c55e
    );

  transition:
    width .7s ease;
}


/* ЗАСЕЧКИ 5% */

.ticks {

  position: absolute;

  z-index: 2;

  inset: 0;

  pointer-events: none;

  background-image:
    repeating-linear-gradient(
      to right,
      transparent 0,
      transparent calc(5% - 1px),
      rgba(255,255,255,.25)
        calc(5% - 1px),
      rgba(255,255,255,.25)
        5%
    );
}


/* ЗАСЕЧКИ 10% */

.ticks-strong {

  position: absolute;

  z-index: 3;

  inset: 0;

  pointer-events: none;

  background-image:
    repeating-linear-gradient(
      to right,
      transparent 0,
      transparent calc(10% - 1px),
      rgba(255,255,255,.55)
        calc(10% - 1px),
      rgba(255,255,255,.55)
        10%
    );
}


/* =============================
   ВЫБОР ГОДА
============================= */

.period-selector {

  margin-top: 22px;

  padding-top: 16px;

  border-top:
    1px solid rgba(255,255,255,.08);
}

.selector-title {

  margin-bottom: 10px;

  text-align: center;

  color: #94a3b8;

  font-size: 13px;
}

.years,
.months {

  display: flex;

  justify-content: center;

  flex-wrap: wrap;

  gap: 7px;
}

.months {
  margin-top: 9px;
}

.year-button,
.month-button {

  border:
    1px solid rgba(255,255,255,.12);

  background:
    rgba(255,255,255,.06);

  color: #fff;

  min-height: 40px;

  padding: 8px 13px;

  border-radius: 11px;

  cursor: pointer;
}

.year-button.active,
.month-button.active {

  border-color:
    #38bdf8;

  background:
    rgba(56,189,248,.17);
}


/* =============================
   ИСТОРИЯ УЧАСТНИКА
============================= */

.person-header {

  margin: 18px 0;

  text-align: center;
}

.person-name {

  font-size: 27px;

  font-weight: 900;
}

.history-list {

  display: flex;

  flex-direction: column;

  gap: 7px;

  margin-top: 18px;
}

.history-row {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 10px;

  padding: 11px 14px;

  border-radius: 12px;

  background:
    rgba(255,255,255,.05);
}

.history-period {

  color: #cbd5e1;
}

.history-percent {

  font-weight: 900;

  font-size: 18px;
}


/* >= 90 */

.good-value {

  color: #22c55e !important;
}


/* =============================
   ГРАФИК
============================= */

.chart-box {

  width: 100%;

  overflow-x: auto;

  margin-top: 18px;

  padding: 15px;

  border-radius: 16px;

  background:
    rgba(15,23,42,.72);

  border:
    1px solid rgba(255,255,255,.07);
}

.chart {

  display: block;

  width: 100%;

  min-width: 620px;

  height: 300px;
}

.grid-line {

  stroke:
    rgba(255,255,255,.1);

  stroke-width: 1;
}

.axis-label {

  fill: #94a3b8;

  font-size: 11px;
}

.chart-line {

  fill: none;

  stroke-width: 3;

  stroke-linejoin: round;

  stroke-linecap: round;
}

.chart-dot {

  stroke: #07111f;

  stroke-width: 2;
}


/* =============================
   СРАВНЕНИЕ
============================= */

.compare-panel {

  margin-top: 18px;

  padding: 16px;

  border-radius: 16px;

  background:
    rgba(15,23,42,.75);

  border:
    1px solid rgba(255,255,255,.08);
}

.compare-title {

  margin-bottom: 14px;

  font-size: 18px;

  font-weight: 800;
}

.people-options {

  display: grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap: 8px;
}

.person-check {

  display: flex;

  align-items: center;

  gap: 9px;

  min-height: 44px;

  padding: 9px 11px;

  border-radius: 11px;

  background:
    rgba(255,255,255,.05);

  cursor: pointer;
}

.person-check input {

  width: 18px;
  height: 18px;
}

.show-comparison {

  width: 100%;

  min-height: 44px;

  margin-top: 13px;

  border: 0;

  border-radius: 12px;

  background: #2563eb;

  color: white;

  cursor: pointer;

  font-size: 14px;

  font-weight: 800;
}


/* ЛЕГЕНДА */

.legend {

  display: flex;

  flex-wrap: wrap;

  gap: 12px;

  margin-top: 12px;
}

.legend-item {

  display: flex;

  align-items: center;

  gap: 7px;

  font-size: 12px;
}

.legend-color {

  width: 12px;
  height: 12px;

  border-radius: 50%;
}


/* =============================
   СЛУЖЕБНОЕ
============================= */

.status {

  margin-top: 10px;

  text-align: center;

  color: #64748b;

  font-size: 11px;
}

.empty {

  padding: 30px;

  text-align: center;

  color: #94a3b8;
}

.hidden {
  display: none !important;
}


/* =============================
   МОБИЛЬНАЯ ВЕРСИЯ
============================= */

@media (max-width: 600px) {

  body {

    padding:
      14px
      9px
      30px;
  }

  h1 {

    font-size: 27px;
  }

  .subtitle {

    font-size: 12px;
  }

  .period-title {

    font-size: 20px;

    margin:
      11px
      0;
  }

  .card {

    grid-template-columns:
      40px
      minmax(0,1fr)
      75px;

    gap: 7px;

    padding:
      11px
      10px;
  }

  .rank {

    font-size: 21px;
  }

  .name {

    font-size: 16px;
  }

  .percent {

    min-width: 70px;

    font-size: 19px;
  }

  .bar-wrapper {

    grid-column:
      2 / 4;
  }

  .bar {

    height: 9px;
  }

  .people-options {

    grid-template-columns: 1fr;
  }

  .top-nav {

    align-items: stretch;
  }

  .back-button,
  .compare-button {

    flex: 1;
  }

  .year-button,
  .month-button {

    font-size: 12px;
  }

  .chart {

    min-width: 560px;

    height: 270px;
  }

  .history-row {

    padding:
      10px
      11px;
  }
}

</style>
</head>


<body>

<div class="container">

  <h1>🏆 Рейтинг команды</h1>

  <div class="subtitle">
    Актуальные результаты
  </div>


  <!-- ГЛАВНАЯ -->

  <section id="ranking-view">

    <div
      id="period-title"
      class="period-title"
    >
      Загрузка...
    </div>

    <div
      id="cards"
      class="cards"
    ></div>


    <div class="period-selector">

      <div class="selector-title">
        Выберите период
      </div>

      <div
        id="years"
        class="years"
      ></div>

      <div
        id="months"
        class="months"
      ></div>

    </div>

  </section>


  <!-- ЧЕЛОВЕК -->

  <section
    id="person-view"
    class="hidden"
  >

    <div class="top-nav">

      <button
        id="person-back"
        class="back-button"
      >
        ← К рейтингу
      </button>

      <button
        id="person-compare"
        class="compare-button"
      >
        Сравнить
      </button>

    </div>

    <div class="person-header">

      <div
        id="person-name"
        class="person-name"
      ></div>

    </div>

    <div
      id="person-chart"
      class="chart-box"
    ></div>

    <div
      id="history"
      class="history-list"
    ></div>

  </section>


  <!-- СРАВНЕНИЕ -->

  <section
    id="compare-view"
    class="hidden"
  >

    <div class="top-nav">

      <button
        id="compare-back"
        class="back-button"
      >
        ← Назад
      </button>

    </div>

    <div class="compare-panel">

      <div class="compare-title">
        Сравнение участников
      </div>

      <div
        id="people-options"
        class="people-options"
      ></div>

      <button
        id="show-comparison"
        class="show-comparison"
      >
        Показать сравнение
      </button>

    </div>

    <div
      id="compare-chart"
      class="chart-box hidden"
    ></div>

    <div
      id="compare-legend"
      class="legend"
    ></div>

  </section>


  <div
    id="status"
    class="status"
  >
    Загрузка данных...
  </div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwYcG1OIZ_y2E3OZQw8oH0IuDMyk06lxL41oM6K1TtXN0Noxa5bV7kC_hsWOXTsTde_IA/exec";


const MONTH_NAMES = [
  "ЯНВАРЬ",
  "ФЕВРАЛЬ",
  "МАРТ",
  "АПРЕЛЬ",
  "МАЙ",
  "ИЮНЬ",
  "ИЮЛЬ",
  "АВГУСТ",
  "СЕНТЯБРЬ",
  "ОКТЯБРЬ",
  "НОЯБРЬ",
  "ДЕКАБРЬ"
];


const SHORT_MONTHS = [
  "Янв",
  "Фев",
  "Мар",
  "Апр",
  "Май",
  "Июн",
  "Июл",
  "Авг",
  "Сен",
  "Окт",
  "Ноя",
  "Дек"
];


let availablePeriods = [];

let selectedYear = null;

let selectedPeriod = null;

let allStatistics = null;

let openedPerson = null;

let loadingRanking = false;


/* =========================
   СТАРТ
========================= */

async function init() {

  try {

    const data =
      await apiRequest(
        "?mode=months"
      );

    availablePeriods =
      data.months || [];

    if (!availablePeriods.length) {

      document.getElementById(
        "cards"
      ).innerHTML =
        '<div class="empty">Нет доступных месяцев</div>';

      return;
    }

    renderYears();

    selectInitialPeriod();

  } catch (error) {

    showError(error);
  }
}


/* =========================
   API
========================= */

async function apiRequest(query) {

  const separator =
    query.includes("?")
      ? "&"
      : "?";

  const response =
    await fetch(
      API_URL +
      query +
      separator +
      "_=" +
      Date.now()
    );

  if (!response.ok) {

    throw new Error(
      "Ошибка загрузки"
    );
  }

  return response.json();
}


/* =========================
   ТЕКУЩИЙ МЕСЯЦ
========================= */

function getCurrentPeriodKey() {

  const now = new Date();

  return (
    MONTH_NAMES[now.getMonth()] +
    now.getFullYear()
  );
}


function selectInitialPeriod() {

  const current =
    getCurrentPeriodKey();

  const found =
    availablePeriods.find(
      p => p.key === current
    );

  if (found) {

    selectedYear = found.year;

    renderYears();

    renderMonths();

    loadPeriod(found.key);

    return;
  }


  /* Если текущего месяца нет,
     открываем самый последний */

  const latest =
    availablePeriods[
      availablePeriods.length - 1
    ];

  selectedYear =
    latest.year;

  renderYears();

  renderMonths();

  loadPeriod(latest.key);
}


/* =========================
   ГОДЫ
========================= */

function renderYears() {

  const root =
    document.getElementById(
      "years"
    );

  const years =
    [
      ...new Set(
        availablePeriods.map(
          p => p.year
        )
      )
    ].sort((a,b) => b-a);

  root.innerHTML = "";

  years.forEach(year => {

    const button =
      document.createElement(
        "button"
      );

    button.className =
      "year-button";

    button.textContent = year;

    if (year === selectedYear) {

      button.classList.add(
        "active"
      );
    }

    button.addEventListener(
      "click",
      () => {

        selectedYear = year;

        renderYears();

        renderMonths();

      }
    );

    root.appendChild(button);
  });
}


/* =========================
   МЕСЯЦЫ
========================= */

function renderMonths() {

  const root =
    document.getElementById(
      "months"
    );

  root.innerHTML = "";

  const periods =
    availablePeriods.filter(
      p =>
        p.year === selectedYear
    );

  periods.forEach(period => {

    const button =
      document.createElement(
        "button"
      );

    button.className =
      "month-button";

    button.textContent =
      MONTH_NAMES[
        period.month - 1
      ].charAt(0) +
      MONTH_NAMES[
        period.month - 1
      ]
        .slice(1)
        .toLowerCase();

    if (
      period.key ===
      selectedPeriod
    ) {

      button.classList.add(
        "active"
      );
    }

    button.addEventListener(
      "click",
      () => {

        loadPeriod(period.key);

      }
    );

    root.appendChild(button);
  });
}


/* =========================
   РЕЙТИНГ
========================= */

async function loadPeriod(periodKey) {

  if (loadingRanking) {
    return;
  }

  loadingRanking = true;

  selectedPeriod =
    periodKey;

  const period =
    availablePeriods.find(
      p => p.key === periodKey
    );

  if (period) {

    selectedYear =
      period.year;

    document.getElementById(
      "period-title"
    ).textContent =
      period.label;
  }

  renderYears();

  renderMonths();

  try {

    const data =
      await apiRequest(
        "?mode=month&period=" +
        encodeURIComponent(
          periodKey
        )
      );

    renderRanking(
      data.people || []
    );

    document.getElementById(
      "status"
    ).textContent =
      "Данные обновлены";

  } catch (error) {

    showError(error);

  } finally {

    loadingRanking = false;
  }
}


function renderRanking(people) {

  const root =
    document.getElementById(
      "cards"
    );

  root.innerHTML = "";

  if (!people.length) {

    root.innerHTML =
      '<div class="empty">Нет данных за этот месяц</div>';

    return;
  }

  people.forEach(
    (person,index) => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "card rank-" +
        (index + 1);

      let rank =
        index + 1;

      if (rank === 1) {
        rank = "🥇";
      }

      if (rank === 2) {
        rank = "🥈";
      }

      if (rank === 3) {
        rank = "🥉";
      }


      const percentClass =
        person.percent >= 90
          ? "good-value"
          : "";


      card.innerHTML = `

        <div class="rank">
          ${rank}
        </div>

        <div>

          <div class="name">
            ${escapeHtml(person.name)}
          </div>

          <div class="bar-wrapper">

            <div class="bar">

              <div
                class="fill"
                style="
                  width:
                  ${clampPercent(person.percent)}%
                "
              ></div>

              <div class="ticks"></div>

              <div class="ticks-strong"></div>

            </div>

          </div>

        </div>

        <div
          class="
            percent
            ${percentClass}
          "
          style="
            color:
            ${getPercentColor(person.percent)}
          "
        >
          ${formatPercent(person.percent)}
        </div>
      `;


      card.addEventListener(
        "click",
        () => {

          openPerson(
            person.name
          );

        }
      );


      root.appendChild(card);

    }
  );
}


/* =========================
   ВСЯ СТАТИСТИКА
========================= */

async function loadAllStatistics() {

  if (allStatistics) {

    return allStatistics;
  }

  document.getElementById(
    "status"
  ).textContent =
    "Загрузка истории...";

  allStatistics =
    await apiRequest(
      "?mode=all"
    );

  document.getElementById(
    "status"
  ).textContent =
    "История загружена";

  return allStatistics;
}


/* =========================
   КАРТОЧКА ЧЕЛОВЕКА
========================= */

async function openPerson(name) {

  openedPerson = name;

  showView(
    "person-view"
  );

  document.getElementById(
    "person-name"
  ).textContent =
    name;

  try {

    const data =
      await loadAllStatistics();

    const history =
      data.people[name] || [];

    renderPersonHistory(
      history
    );

    renderSingleChart(
      history,
      name
    );

  } catch (error) {

    showError(error);
  }
}


function renderPersonHistory(history) {

  const root =
    document.getElementById(
      "history"
    );

  root.innerHTML = "";


  const sorted =
    history
      .slice()
      .sort(
        (a,b) =>
          b.sort - a.sort
      );


  sorted.forEach(item => {

    const row =
      document.createElement(
        "div"
      );

    row.className =
      "history-row";

    const good =
      item.percent >= 90
        ? "good-value"
        : "";


    row.innerHTML = `

      <div class="history-period">
        ${escapeHtml(item.label)}
      </div>

      <div
        class="
          history-percent
          ${good}
        "
      >
        ${formatPercent(item.percent)}
      </div>

    `;

    root.appendChild(row);

  });
}


/* =========================
   ГРАФИК ОДНОГО ЧЕЛОВЕКА
========================= */

function renderSingleChart(
  history,
  name
) {

  const series = [{
    name: name,
    values:
      history
        .slice()
        .sort(
          (a,b) =>
            a.sort - b.sort
        )
  }];

  renderChart(
    document.getElementById(
      "person-chart"
    ),
    series
  );
}


/* =========================
   СРАВНЕНИЕ
========================= */

async function openCompare() {

  showView(
    "compare-view"
  );

  try {

    const data =
      await loadAllStatistics();

    renderCompareOptions(
      data
    );

  } catch (error) {

    showError(error);
  }
}


function renderCompareOptions(data) {

  const root =
    document.getElementById(
      "people-options"
    );

  root.innerHTML = "";


  const names =
    Object.keys(
      data.people
    );


  names.forEach(name => {

    const label =
      document.createElement(
        "label"
      );

    label.className =
      "person-check";


    const checked =
      name === openedPerson
        ? "checked"
        : "";


    label.innerHTML = `

      <input
        type="checkbox"
        value="${escapeAttribute(name)}"
        ${checked}
      >

      <span>
        ${escapeHtml(name)}
      </span>

    `;

    root.appendChild(label);

  });
}


function showComparison() {

  if (!allStatistics) {
    return;
  }


  const checked =
    Array.from(
      document.querySelectorAll(
        "#people-options input:checked"
      )
    );


  if (!checked.length) {

    alert(
      "Выберите хотя бы одного участника"
    );

    return;
  }


  const names =
    checked.map(
      input => input.value
    );


  const series =
    names.map(name => ({

      name: name,

      values:
        (
          allStatistics.people[name]
          || []
        )
          .slice()
          .sort(
            (a,b) =>
              a.sort - b.sort
          )

    }));


  const box =
    document.getElementById(
      "compare-chart"
    );

  box.classList.remove(
    "hidden"
  );


  renderChart(
    box,
    series
  );

  renderLegend(
    names
  );
}


/* =========================
   ГРАФИК
========================= */

const SERIES_COLORS = [
  "#38bdf8",
  "#f59e0b",
  "#a78bfa",
  "#fb7185",
  "#2dd4bf",
  "#f97316",
  "#84cc16",
  "#e879f9"
];


function renderChart(
  root,
  series
) {

  if (!series.length) {

    root.innerHTML =
      '<div class="empty">Нет данных</div>';

    return;
  }


  const allPeriods =
    new Map();


  series.forEach(s => {

    s.values.forEach(v => {

      allPeriods.set(
        v.sort,
        v
      );

    });

  });


  const periods =
    Array.from(
      allPeriods.values()
    )
      .sort(
        (a,b) =>
          a.sort - b.sort
      );


  if (!periods.length) {

    root.innerHTML =
      '<div class="empty">Нет данных</div>';

    return;
  }


  const width = Math.max(
    620,
    periods.length * 90
  );

  const height = 300;

  const left = 45;
  const right = 20;
  const top = 20;
  const bottom = 55;

  const chartWidth =
    width - left - right;

  const chartHeight =
    height - top - bottom;


  /*
    Показываем диапазон 70–100,
    чтобы различия были заметнее.
  */

  const minY = 70;
  const maxY = 100;


  const x = index => {

    if (periods.length === 1) {
      return (
        left +
        chartWidth / 2
      );
    }

    return (
      left +
      index *
      chartWidth /
      (periods.length - 1)
    );
  };


  const y = value => {

    const safe =
      Math.max(
        minY,
        Math.min(
          maxY,
          value
        )
      );

    return (
      top +
      chartHeight -
      (
        (safe - minY) /
        (maxY - minY)
      ) *
      chartHeight
    );
  };


  let svg = `

    <svg
      class="chart"
      viewBox="0 0 ${width} ${height}"
      style="width:${width}px"
    >
  `;


  [70,75,80,85,90,95,100]
    .forEach(value => {

      const yy = y(value);

      svg += `

        <line
          class="grid-line"
          x1="${left}"
          y1="${yy}"
          x2="${width-right}"
          y2="${yy}"
        />

        <text
          class="axis-label"
          x="5"
          y="${yy + 4}"
        >
          ${value}%
        </text>

      `;

    });


  periods.forEach(
    (period,index) => {

      svg += `

        <text
          class="axis-label"
          text-anchor="middle"
          x="${x(index)}"
          y="${height - 22}"
        >
          ${
            SHORT_MONTHS[
              period.month - 1
            ]
          }
          ${String(period.year).slice(-2)}
        </text>

      `;

    }
  );


  series.forEach(
    (s,seriesIndex) => {

      const color =
        SERIES_COLORS[
          seriesIndex %
          SERIES_COLORS.length
        ];


      const valuesByPeriod =
        new Map(
          s.values.map(
            item => [
              item.sort,
              item
            ]
          )
        );


      let path = "";

      let started = false;


      periods.forEach(
        (period,index) => {

          const item =
            valuesByPeriod.get(
              period.sort
            );

          if (!item) {

            started = false;

            return;
          }


          const px =
            x(index);

          const py =
            y(item.percent);


          if (!started) {

            path +=
              `M ${px} ${py}`;

            started = true;

          } else {

            path +=
              ` L ${px} ${py}`;

          }

        }
      );


      svg += `

        <path
          d="${path}"
          class="chart-line"
          stroke="${color}"
        />

      `;


      periods.forEach(
        (period,index) => {

          const item =
            valuesByPeriod.get(
              period.sort
            );

          if (!item) return;


          const dotColor =
            item.percent >= 90
              ? "#22c55e"
              : color;


          svg += `

            <circle
              class="chart-dot"
              cx="${x(index)}"
              cy="${y(item.percent)}"
              r="5"
              fill="${dotColor}"
            >

              <title>
                ${escapeHtml(s.name)}
                —
                ${escapeHtml(period.label)}
                —
                ${formatPercent(item.percent)}
              </title>

            </circle>

          `;

        }
      );

    }
  );


  svg += "</svg>";

  root.innerHTML = svg;
}


/* =========================
   ЛЕГЕНДА
========================= */

function renderLegend(names) {

  const root =
    document.getElementById(
      "compare-legend"
    );

  root.innerHTML = "";

  names.forEach(
    (name,index) => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "legend-item";

      item.innerHTML = `

        <span
          class="legend-color"
          style="
            background:
            ${
              SERIES_COLORS[
                index %
                SERIES_COLORS.length
              ]
            }
          "
        ></span>

        <span>
          ${escapeHtml(name)}
        </span>

      `;

      root.appendChild(item);

    }
  );
}

/* =========================
   ЦВЕТ ПРОЦЕНТА
========================= */

function getPercentColor(value) {

  if (value >= 90) {

    return "#22c55e";
  }

  if (value <= 80) {

    return "#ef4444";
  }

  if (value <= 85) {

    return mixColor(
      "#ef4444",
      "#facc15",
      (value - 80) / 5
    );
  }

  return mixColor(
    "#facc15",
    "#84cc16",
    (value - 85) / 5
  );
}


function mixColor(a,b,t) {

  const A =
    parseInt(
      a.slice(1),
      16
    );

  const B =
    parseInt(
      b.slice(1),
      16
    );


  const ar = A >> 16;

  const ag =
    (A >> 8) & 255;

  const ab =
    A & 255;


  const br = B >> 16;

  const bg =
    (B >> 8) & 255;

  const bb =
    B & 255;


  const r =
    Math.round(
      ar +
      (br-ar)*t
    );

  const g =
    Math.round(
      ag +
      (bg-ag)*t
    );

  const bl =
    Math.round(
      ab +
      (bb-ab)*t
    );


  return (
    "#" +
    (
      (1<<24) +
      (r<<16) +
      (g<<8) +
      bl
    )
      .toString(16)
      .slice(1)
  );
}


/* =========================
   УТИЛИТЫ
========================= */

function formatPercent(value) {

  return (
    Number(value)
      .toFixed(1)
      .replace(".",",")
      +
    "%"
  );
}


function clampPercent(value) {

  return Math.max(
    0,
    Math.min(
      100,
      Number(value) || 0
    )
  );
}


function escapeHtml(value) {

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function escapeAttribute(value) {

  return escapeHtml(value);
}


function showError(error) {

  console.error(error);

  document.getElementById(
    "status"
  ).textContent =
    "Ошибка загрузки данных";
}
