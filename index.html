<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Рейтинг команды</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      padding: 36px 18px;
    }

    .wrap {
      width: 100%;
      max-width: 900px;
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 42px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-top: 10px;
      margin-bottom: 28px;
      font-size: 16px;
    }

    .card {
      display: grid;
      grid-template-columns: 70px 1fr 120px;
      gap: 16px;
      align-items: center;
      padding: 22px;
      margin-bottom: 14px;
      border-radius: 18px;
      background: #1e293b;
      box-shadow: 0 8px 24px rgba(0,0,0,.22);
    }

    .top1 {
      border: 1px solid #facc15;
    }

    .top2 {
      border: 1px solid #cbd5e1;
    }

    .top3 {
      border: 1px solid #fb923c;
    }

    .rank {
      font-size: 30px;
      font-weight: 700;
      text-align: center;
    }

    .name {
      font-size: 24px;
      font-weight: 700;
    }

    .percent {
      font-size: 28px;
      font-weight: 800;
      text-align: right;
    }

    .bar {
      grid-column: 2 / 4;
      height: 10px;
      background: #334155;
      border-radius: 999px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #38bdf8, #22c55e);
    }

    .status {
      margin-top: 18px;
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
    }

    .error {
      text-align: center;
      color: #fca5a5;
      padding: 30px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 30px;
      }

      .card {
        grid-template-columns: 50px 1fr 90px;
        padding: 16px;
      }

      .name {
        font-size: 18px;
      }

      .percent {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>🏆 Рейтинг команды</h1>
    <div class="subtitle">Актуальные результаты</div>

    <div id="ranking">Загрузка...</div>

    <div class="status" id="status"></div>
  </div>

  <script>
    const CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vTGL-KACsRd8HUNn2iHLPk6cAgRTsMTcxFMbkL7BkdbHWc3DWaS2fHt53zVx-hQSHXszSzdXVAZO_vS/pub?gid=0&single=true&output=csv";

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {
          if (inQuotes && next === '"') {
            cell += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === "," && !inQuotes) {
          row.push(cell);
          cell = "";
        } else if ((char === "\n" || char === "\r") && !inQuotes) {
          if (char === "\r" && next === "\n") {
            i++;
          }

          row.push(cell);
          rows.push(row);

          row = [];
          cell = "";
        } else {
          cell += char;
        }
      }

      if (cell.length > 0 || row.length > 0) {
        row.push(cell);
        rows.push(row);
      }

      return rows;
    }

    function parsePercent(value) {
      if (!value) return 0;

      return (
        parseFloat(
          value
            .replace("%", "")
            .replace(/\s/g, "")
            .replace(",", ".")
        ) || 0
      );
    }

    function medal(index) {
      if (index === 0) return "🥇";
      if (index === 1) return "🥈";
      if (index === 2) return "🥉";
      return index + 1;
    }

    async function loadRanking() {
      try {
        const response = await fetch(CSV_URL + "&t=" + Date.now(), {
          cache: "no-store"
        });

        const text = await response.text();
        const rows = parseCSV(text);

        /*
          В опубликованной таблице:
          D = место
          E = имя
          F = процент

          Индексы массива:
          D -> 3
          E -> 4
          F -> 5
        */

        const people = rows
          .slice(1)
          .map(row => {
            const name = (row[4] || "").trim();
            const percentText = (row[5] || "").trim();

            return {
              name,
              percent: parsePercent(percentText)
            };
          })
          .filter(person => person.name)
          .sort((a, b) => b.percent - a.percent)
          .slice(0, 5);

        const ranking = document.getElementById("ranking");
        ranking.innerHTML = "";

        people.forEach((person, index) => {
          const card = document.createElement("div");

          card.className =
            "card " +
            (index === 0
              ? "top1"
              : index === 1
              ? "top2"
              : index === 2
              ? "top3"
              : "");

          card.innerHTML = `
            <div class="rank">${medal(index)}</div>

            <div class="name">${person.name}</div>

            <div class="percent">
              ${person.percent.toFixed(1).replace(".", ",")}%
            </div>

            <div class="bar">
              <div
                class="fill"
                style="width:${Math.min(person.percent, 100)}%"
              ></div>
            </div>
          `;

          ranking.appendChild(card);
        });

        document.getElementById("status").textContent =
          "Обновлено: " +
          new Date().toLocaleTimeString("ru-RU");

      } catch (error) {
        document.getElementById("ranking").innerHTML =
          '<div class="error">Не удалось загрузить данные.</div>';
      }
    }

    loadRanking();

    setInterval(loadRanking, 1000);
  </script>
</body>
</html>
