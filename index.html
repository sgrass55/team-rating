<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Рейтинг команды</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg1: #07101f;
      --bg2: #0d1830;
      --card: rgba(21, 34, 60, 0.86);
      --card2: rgba(26, 41, 71, 0.9);
      --border: rgba(255,255,255,0.13);
      --text: #f5f7ff;
      --muted: #8997b4;
      --blue: #3dbaf5;
      --green: #31d879;
      --gold: #f6c626;
      --silver: #b7c1ce;
      --bronze: #d07a29;
      --danger: #ff5f70;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 50% 0%,
          #162857 0,
          #0a1427 32%,
          #050c18 70%
        );

      background-attachment: fixed;
    }

    body {
      min-height: 100vh;
    }

    button {
      font: inherit;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding:
        22px
        18px
        60px;
    }

    .container {
      width: min(
        900px,
        100%
      );
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
    }

    .title {
      margin: 0;
      font-size: 33px;
      line-height: 1.1;
      font-weight: 850;
      letter-spacing: -1px;
    }

    .subtitle {
      margin-top: 7px;
      font-size: 14px;
      color: var(--muted);
    }

    .current-period {
      margin-top: 12px;
      font-size: 24px;
      font-weight: 800;
    }

    .status {
      min-height: 19px;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .status.error {
      color: var(--danger);
    }


    /* =====================================================
       RANKING
       ===================================================== */

    .ranking {
      margin-top: 12px;
      display: grid;
      gap: 9px;
    }

    .rank-card {
      position: relative;

      display: grid;

      grid-template-columns:
        42px
        minmax(150px, 1fr)
        minmax(240px, 4fr)
        auto;

      align-items: center;

      min-height: 64px;

      padding:
        10px
        15px;

      border-radius: 17px;

      border:
        1px solid
        var(--border);

      background:
        linear-gradient(
          90deg,
          rgba(28,42,69,.92),
          rgba(15,26,47,.9)
        );

      transition:
        transform .16s ease,
        border-color .16s ease,
        opacity .16s ease;
    }

    .rank-card:hover {
      transform:
        translateY(-1px);
    }

    .rank-card.first {
      border-color:
        rgba(246,198,38,.72);
    }

    .rank-card.second {
      border-color:
        rgba(183,193,206,.45);
    }

    .rank-card.third {
      border-color:
        rgba(208,122,41,.7);
    }

    .place {
      font-size: 19px;
      text-align: center;
    }

    .person-name {
      min-width: 0;

      font-size: 16px;
      font-weight: 780;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .percent {
      padding-left: 12px;

      font-size: 21px;
      line-height: 1;

      font-weight: 850;

      white-space: nowrap;

      color: var(--blue);
    }

    .percent.green {
      color: var(--green);
    }


    /* =====================================================
       BAR
       ===================================================== */

    .bar-wrap {
      padding:
        0
        5px;
    }

    .bar {
      position: relative;

      height: 11px;

      overflow: hidden;

      border-radius: 999px;

      background:
        rgba(255,255,255,.08);
    }

    .bar::after {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      background:
        repeating-linear-gradient(
          to right,
          transparent 0,
          transparent calc(5% - 1px),
          rgba(255,255,255,.18)
            calc(5% - 1px),
          rgba(255,255,255,.18) 5%
        );
    }

    .bar-fill {
      position: absolute;

      left: 0;
      top: 0;
      bottom: 0;

      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          #37bff5,
          #2fd67b
        );

      transition:
        width .3s ease;
    }


    /* =====================================================
       PERIOD CONTROLS
       ===================================================== */

    .period-panel {
      margin-top: 18px;

      padding-top: 16px;

      border-top:
        1px solid
        rgba(255,255,255,.08);

      text-align: center;
    }

    .period-label {
      margin-bottom: 9px;

      color: var(--muted);

      font-size: 12px;
    }

    .years,
    .months {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
    }

    .months {
      margin-top: 9px;
    }

    .period-button {
      appearance: none;

      border:
        1px solid
        rgba(255,255,255,.12);

      border-radius: 11px;

      padding:
        9px
        14px;

      color: var(--text);

      cursor: pointer;

      background:
        rgba(255,255,255,.07);

      transition:
        background .15s ease,
        border-color .15s ease,
        transform .15s ease;
    }

    .period-button:hover:not(:disabled) {
      transform:
        translateY(-1px);

      background:
        rgba(255,255,255,.11);
    }

    .period-button.active {
      border-color:
        var(--blue);

      background:
        rgba(52,181,246,.16);

      box-shadow:
        inset 0 0 0 1px
        rgba(52,181,246,.12);
    }

    .period-button:disabled {
      cursor: default;

      opacity: .24;
    }


    /* =====================================================
       EXTRA
       ===================================================== */

    .extra-actions {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;

      margin-top: 18px;
    }

    .secondary-btn {
      border:
        1px solid
        rgba(255,255,255,.12);

      border-radius: 11px;

      padding:
        9px
        14px;

      color: var(--text);

      background:
        rgba(255,255,255,.06);

      cursor: pointer;
    }

    .secondary-btn:hover {
      background:
        rgba(255,255,255,.1);
    }


    /* =====================================================
       HISTORY
       ===================================================== */

    .section {
      display: none;

      margin-top: 22px;

      padding:
        17px;

      border-radius: 18px;

      border:
        1px solid
        rgba(255,255,255,.1);

      background:
        rgba(13,24,44,.78);
    }

    .section.visible {
      display: block;
    }

    .section-title {
      margin:
        0
        0
        13px;

      font-size: 20px;
      font-weight: 800;
    }

    .person-select {
      width: 100%;

      padding:
        11px
        12px;

      border:
        1px solid
        rgba(255,255,255,.12);

      border-radius: 11px;

      outline: none;

      color: var(--text);

      background:
        #15213b;
    }

    .history-list {
      display: grid;
      gap: 7px;

      margin-top: 13px;
    }

    .history-row {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 15px;

      padding:
        9px
        12px;

      border-radius: 11px;

      background:
        rgba(255,255,255,.05);
    }

    .history-period {
      color: #dce4f7;
    }

    .history-percent {
      font-weight: 800;
      color: var(--blue);
    }

    .history-percent.green {
      color: var(--green);
    }


    /* =====================================================
       COMPARISON
       ===================================================== */

    .compare-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      margin-bottom: 16px;
    }

    .compare-option {
      display: flex;
      align-items: center;
      gap: 6px;

      padding:
        8px
        10px;

      border-radius: 10px;

      background:
        rgba(255,255,255,.05);

      cursor: pointer;
    }

    .chart-wrap {
      overflow-x: auto;
    }

    #compareChart {
      min-width: 690px;
    }


    /* =====================================================
       LOADER
       ===================================================== */

    .loader {
      margin:
        32px auto;

      width: 31px;
      height: 31px;

      border:
        3px solid
        rgba(255,255,255,.14);

      border-top-color:
        var(--blue);

      border-radius: 50%;

      animation:
        spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform:
          rotate(360deg);
      }
    }

    .empty {
      padding:
        30px
        15px;

      text-align: center;

      color:
        var(--muted);
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (
      max-width: 700px
    ) {

      .page {
        padding:
          17px
          10px
          40px;
      }

      .title {
        font-size: 27px;
      }

      .current-period {
        font-size: 21px;
      }

      .rank-card {
        grid-template-columns:
          34px
          1fr
          auto;

        grid-template-areas:
          "place name percent"
          ". bar bar";

        gap:
          7px
          8px;

        padding:
          10px
          12px;
      }

      .place {
        grid-area: place;
      }

      .person-name {
        grid-area: name;
      }

      .percent {
        grid-area: percent;

        font-size: 18px;
      }

      .bar-wrap {
        grid-area: bar;

        padding:
          0
          0
          2px;
      }

      .period-button {
        padding:
          8px
          10px;

        font-size: 13px;
      }
    }

  </style>
</head>


<body>

  <main class="page">

    <div class="container">

      <header class="header">

        <h1 class="title">
          🏆 Рейтинг команды
        </h1>

        <div class="subtitle">
          Актуальные результаты
        </div>

        <div
          class="current-period"
          id="currentPeriod">
          —
        </div>

        <div
          class="status"
          id="status">
        </div>

      </header>


      <section
        class="ranking"
        id="ranking">
      </section>


      <section class="period-panel">

        <div class="period-label">
          Выберите год и месяц
        </div>

        <div
          class="years"
          id="years">
        </div>

        <div
          class="months"
          id="months">
        </div>

      </section>


      <div class="extra-actions">

        <button
          class="secondary-btn"
          id="historyBtn"
          type="button">
          История участника
        </button>

        <button
          class="secondary-btn"
          id="compareBtn"
          type="button">
          Сравнение
        </button>

      </div>


      <section
        class="section"
        id="historySection">

        <h2 class="section-title">
          История участника
        </h2>

        <select
          class="person-select"
          id="historyPerson">
        </select>

        <div
          class="history-list"
          id="historyList">
        </div>

      </section>


      <section
        class="section"
        id="compareSection">

        <h2 class="section-title">
          Сравнение участников
        </h2>

        <div
          class="compare-options"
          id="compareOptions">
        </div>

        <div class="chart-wrap">

          <svg
            id="compareChart"
            width="100%"
            height="360"
            viewBox="0 0 900 360"
            preserveAspectRatio="none">
          </svg>

        </div>

      </section>

    </div>

  </main>


  <script>

    /* =====================================================
       API
       ===================================================== */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbwYcG1OIZ_y2E3OZQw8oH0IuDMyk06lxL41oM6K1TtXN0Noxa5bV7kC_hsWOXTsTde_IA/exec";


    /* =====================================================
       MONTHS
       ===================================================== */

    const MONTH_NAMES = [
      "Январь",
      "Февраль",
      "Март",
      "Апрель",
      "Май",
      "Июнь",
      "Июль",
      "Август",
      "Сентябрь",
      "Октябрь",
      "Ноябрь",
      "Декабрь"
    ];


    /* =====================================================
       STATE

       ВАЖНО:
       выбранный пользователем год
       хранится отдельно.

       Обновление списка периодов
       больше не имеет права
       его менять.
       ===================================================== */

    const state = {

      periods: [],

      selectedYear: null,

      selectedPeriod: null,

      rankingRequestId: 0,

      periodsLoaded: false,

      historyData: null,

      historyLoadedAt: 0,

      historyLoading: false,

      selectedComparePeople:
        new Set()

    };


    /* =====================================================
       DOM
       ===================================================== */

    const rankingEl =
      document.getElementById(
        "ranking"
      );

    const yearsEl =
      document.getElementById(
        "years"
      );

    const monthsEl =
      document.getElementById(
        "months"
      );

    const currentPeriodEl =
      document.getElementById(
        "currentPeriod"
      );

    const statusEl =
      document.getElementById(
        "status"
      );

    const historyBtn =
      document.getElementById(
        "historyBtn"
      );

    const compareBtn =
      document.getElementById(
        "compareBtn"
      );

    const historySection =
      document.getElementById(
        "historySection"
      );

    const compareSection =
      document.getElementById(
        "compareSection"
      );

    const historyPersonEl =
      document.getElementById(
        "historyPerson"
      );

    const historyListEl =
      document.getElementById(
        "historyList"
      );

    const compareOptionsEl =
      document.getElementById(
        "compareOptions"
      );

    const compareChartEl =
      document.getElementById(
        "compareChart"
      );


    /* =====================================================
       FETCH
       ===================================================== */

    async function api(params) {

      const url =
        new URL(API_URL);


      Object
        .entries(params)
        .forEach(
          ([key, value]) => {

            url.searchParams.set(
              key,
              value
            );

          }
        );


      /*
        cache:no-store важен,
        чтобы браузер не показывал
        старый JSON после обновления
        Apps Script.
      */

      const response =
        await fetch(
          url.toString(),
          {
            cache: "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );
      }


      const data =
        await response.json();


      if (data.error) {

        throw new Error(
          data.error
        );
      }


      return data;
    }


    /* =====================================================
       START
       ===================================================== */

    async function init() {

      showRankingLoader();

      setStatus(
        "Загрузка…"
      );


      try {

        await refreshPeriods(
          true
        );


        if (
          state.selectedPeriod
        ) {

          await loadRanking(
            state.selectedPeriod
          );
        }


      } catch (error) {

        showMainError(
          error
        );
      }


      /*
        Список существующих месяцев
        обновляем раз в минуту.

        НО selectedYear
        и selectedPeriod
        здесь НЕ сбрасываются.
      */

      setInterval(
        () => {

          refreshPeriods(
            false
          );

        },
        60000
      );


      /*
        Сам рейтинг текущего выбранного
        периода обновляем раз в 20 секунд.

        Эта функция также НЕ меняет
        выбранный год.
      */

      setInterval(
        () => {

          if (
            !state.selectedPeriod
          ) {
            return;
          }


          /*
            Когда вкладка браузера
            неактивна, запросы не делаем.
          */

          if (
            document.hidden
          ) {
            return;
          }


          loadRanking(
            state.selectedPeriod,
            true
          );

        },
        20000
      );
    }


    /* =====================================================
       PERIODS
       ===================================================== */

    async function refreshPeriods(
      initial
    ) {

      const data =
        await api({
          mode: "months",
          _: Date.now()
        });


      const periods =
        Array.isArray(data.months)
          ? data.months
          : [];


      state.periods =
        periods
          .filter(
            item =>
              item &&
              item.key &&
              Number.isFinite(
                Number(
                  item.year
                )
              ) &&
              Number.isFinite(
                Number(
                  item.month
                )
              )
          )
          .sort(
            (a, b) =>
              Number(a.sort) -
              Number(b.sort)
          );


      if (
        state.periods.length === 0
      ) {

        state.selectedYear =
          null;

        state.selectedPeriod =
          null;

        renderPeriodControls();

        showEmptyRanking(
          "Месяцы пока не найдены"
        );

        return;
      }


      /*
        =================================
        ТОЛЬКО ПРИ ПЕРВОМ ЗАПУСКЕ
        выбираем стартовый период.
        =================================
      */

      if (
        initial ||
        !state.periodsLoaded
      ) {

        const start =
          chooseInitialPeriod(
            state.periods
          );


        state.selectedPeriod =
          start.key;


        state.selectedYear =
          Number(
            start.year
          );


        state.periodsLoaded =
          true;
      }


      /*
        =================================
        ПРИ ОБЫЧНОМ АВТООБНОВЛЕНИИ
        НИЧЕГО НЕ СБРАСЫВАЕМ
        =================================
      */

      else {

        const stillExists =
          state.periods.some(
            item =>
              item.key ===
              state.selectedPeriod
          );


        /*
          Только если выбранный лист
          реально исчез из всех таблиц,
          выбираем другой.

          Обычное обновление API
          не должно менять выбор.
        */

        if (
          !stillExists
        ) {

          const sameYear =
            getPeriodsForYear(
              state.selectedYear
            );


          if (
            sameYear.length
          ) {

            const latest =
              sameYear[
                sameYear.length - 1
              ];


            state.selectedPeriod =
              latest.key;
          }

          else {

            const latest =
              state.periods[
                state.periods.length - 1
              ];


            state.selectedPeriod =
              latest.key;


            state.selectedYear =
              Number(
                latest.year
              );
          }
        }
      }


      renderPeriodControls();
    }


    /* =====================================================
       INITIAL PERIOD

       Если есть текущий месяц —
       выбираем его.

       Иначе последний доступный.
       ===================================================== */

    function chooseInitialPeriod(
      periods
    ) {

      const now =
        new Date();


      const currentYear =
        now.getFullYear();


      const currentMonth =
        now.getMonth() + 1;


      const current =
        periods.find(
          item =>
            Number(item.year) ===
              currentYear &&
            Number(item.month) ===
              currentMonth
        );


      if (current) {
        return current;
      }


      return periods[
        periods.length - 1
      ];
    }


    /* =====================================================
       YEARS + MONTHS
       ===================================================== */

    function renderPeriodControls() {

      renderYears();

      renderMonths();

      renderCurrentPeriodLabel();
    }


    function renderYears() {

      const years =
        [
          ...new Set(
            state.periods.map(
              item =>
                Number(item.year)
            )
          )
        ]
          .filter(
            Number.isFinite
          )
          .sort(
            (a, b) =>
              b - a
          );


      yearsEl.innerHTML =
        "";


      years.forEach(year => {

        const button =
          document.createElement(
            "button"
          );


        button.type =
          "button";


        button.className =
          "period-button";


        button.textContent =
          String(year);


        if (
          year ===
          state.selectedYear
        ) {

          button.classList.add(
            "active"
          );
        }


        button.addEventListener(
          "click",
          () => {

            selectYear(year);

          }
        );


        yearsEl.appendChild(
          button
        );

      });
    }


    function selectYear(year) {

      /*
        КЛЮЧЕВОЕ ИСПРАВЛЕНИЕ:

        Год меняется ТОЛЬКО здесь,
        когда его нажал пользователь.
      */

      state.selectedYear =
        Number(year);


      const available =
        getPeriodsForYear(
          state.selectedYear
        );


      /*
        Если текущий выбранный месяц
        существует и в новом году,
        выбираем тот же номер месяца.
      */

      const oldPeriod =
        getPeriodByKey(
          state.selectedPeriod
        );


      let next = null;


      if (oldPeriod) {

        next =
          available.find(
            item =>
              Number(item.month) ===
              Number(oldPeriod.month)
          );
      }


      /*
        Если такого месяца нет,
        выбираем последний доступный
        месяц выбранного года.
      */

      if (!next) {

        next =
          available[
            available.length - 1
          ];
      }


      if (next) {

        state.selectedPeriod =
          next.key;
      }


      renderPeriodControls();


      if (
        state.selectedPeriod
      ) {

        loadRanking(
          state.selectedPeriod
        );
      }
    }


    function renderMonths() {

      monthsEl.innerHTML =
        "";


      if (
        !state.selectedYear
      ) {

        return;
      }


      const periodsForYear =
        getPeriodsForYear(
          state.selectedYear
        );


      const map = {};


      periodsForYear.forEach(
        item => {

          map[
            Number(item.month)
          ] = item;

        }
      );


      /*
        Показываем 12 месяцев.

        Существующие — активны.
        Несуществующие — disabled.
      */

      for (
        let month = 1;
        month <= 12;
        month++
      ) {

        const period =
          map[month];


        const button =
          document.createElement(
            "button"
          );


        button.type =
          "button";


        button.className =
          "period-button";


        button.textContent =
          MONTH_NAMES[
            month - 1
          ];


        if (!period) {

          button.disabled =
            true;
        }


        if (
          period &&
          period.key ===
            state.selectedPeriod
        ) {

          button.classList.add(
            "active"
          );
        }


        if (period) {

          button.addEventListener(
            "click",
            () => {

              /*
                Месяц выбирается только
                из текущего selectedYear.
              */

              state.selectedPeriod =
                period.key;


              /*
                selectedYear здесь
                специально не меняем.
              */


              renderPeriodControls();


              loadRanking(
                period.key
              );

            }
          );
        }


        monthsEl.appendChild(
          button
        );
      }
    }


    function getPeriodsForYear(year) {

      return state.periods
        .filter(
          item =>
            Number(item.year) ===
            Number(year)
        )
        .sort(
          (a, b) =>
            Number(a.month) -
            Number(b.month)
        );
    }


    function getPeriodByKey(key) {

      if (!key) {
        return null;
      }


      return (
        state.periods.find(
          item =>
            item.key === key
        )
        || null
      );
    }


    function renderCurrentPeriodLabel() {

      const period =
        getPeriodByKey(
          state.selectedPeriod
        );


      currentPeriodEl.textContent =
        period
          ? period.label
          : "—";
    }


    /* =====================================================
       RANKING
       ===================================================== */

    async function loadRanking(
      period,
      silent = false
    ) {

      if (!period) {
        return;
      }


      /*
        Каждому запросу свой номер.

        Если пользователь успел
        нажать другой месяц,
        результат старого запроса
        будет проигнорирован.
      */

      const requestId =
        ++state.rankingRequestId;


      if (!silent) {

        showRankingLoader();

        setStatus(
          "Загрузка…"
        );
      }


      try {

        const data =
          await api({
            mode: "month",
            period: period,
            _: Date.now()
          });


        /*
          Пока запрос шёл,
          пользователь уже мог
          выбрать другой месяц.
        */

        if (
          requestId !==
          state.rankingRequestId
        ) {

          return;
        }


        /*
          Ещё одна защита:
          ответ должен относиться
          именно к текущему периоду.
        */

        if (
          period !==
          state.selectedPeriod
        ) {

          return;
        }


        const people =
          sanitizePeople(
            data.people
          );


        renderRanking(
          people
        );


        setStatus(
          "Данные обновлены"
        );


      } catch (error) {

        if (
          requestId !==
          state.rankingRequestId
        ) {

          return;
        }


        if (!silent) {

          showMainError(
            error
          );
        }
      }
    }


    /* =====================================================
       CLIENT-SIDE PROTECTION

       Даже если API вдруг прислал
       мусор > 100, сайт его
       физически не покажет.
       ===================================================== */

    function sanitizePeople(
      people
    ) {

      if (
        !Array.isArray(people)
      ) {

        return [];
      }


      return people
        .map(
          item => {

            const percent =
              Number(
                item.percent
              );


            return {
              name:
                String(
                  item.name || ""
                ).trim(),
              percent:
                percent
            };
          }
        )
        .filter(
          item =>
            item.name &&
            Number.isFinite(
              item.percent
            ) &&
            item.percent >= 0 &&
            item.percent <= 100
        )
        .sort(
          (a, b) =>
            b.percent -
            a.percent
        );
    }


    function renderRanking(
      people
    ) {

      rankingEl.innerHTML =
        "";


      if (
        people.length === 0
      ) {

        showEmptyRanking(
          "За этот месяц статистика не найдена"
        );

        return;
      }


      people.forEach(
        (person, index) => {

          const card =
            document.createElement(
              "article"
            );


          card.className =
            "rank-card";


          if (index === 0) {
            card.classList.add(
              "first"
            );
          }


          if (index === 1) {
            card.classList.add(
              "second"
            );
          }


          if (index === 2) {
            card.classList.add(
              "third"
            );
          }


          const place =
            getPlaceIcon(
              index
            );


          const percent =
            clampPercent(
              person.percent
            );


          const percentClass =
            percent >= 90
              ? "percent green"
              : "percent";


          card.innerHTML = `

            <div class="place">
              ${place}
            </div>

            <div
              class="person-name"
              title="${escapeHtml(person.name)}">
              ${escapeHtml(person.name)}
            </div>

            <div class="bar-wrap">

              <div class="bar">

                <div
                  class="bar-fill"
                  style="width:${percent}%">
                </div>

              </div>

            </div>

            <div
              class="${percentClass}">
              ${formatPercent(percent)}
            </div>

          `;


          rankingEl.appendChild(
            card
          );
        }
      );
    }


    function getPlaceIcon(index) {

      if (index === 0) {
        return "🥇";
      }


      if (index === 1) {
        return "🥈";
      }


      if (index === 2) {
        return "🥉";
      }


      return String(
        index + 1
      );
    }


    /* =====================================================
       HISTORY
       ===================================================== */

    historyBtn.addEventListener(
      "click",
      async () => {

        const willOpen =
          !historySection
            .classList
            .contains(
              "visible"
            );


        historySection
          .classList
          .toggle(
            "visible"
          );


        if (!willOpen) {
          return;
        }


        compareSection
          .classList
          .remove(
            "visible"
          );


        await ensureHistoryData();


        renderHistoryPeople();

      }
    );


    /* =====================================================
       COMPARE
       ===================================================== */

    compareBtn.addEventListener(
      "click",
      async () => {

        const willOpen =
          !compareSection
            .classList
            .contains(
              "visible"
            );


        compareSection
          .classList
          .toggle(
            "visible"
          );


        if (!willOpen) {
          return;
        }


        historySection
          .classList
          .remove(
            "visible"
          );


        await ensureHistoryData();


        renderCompareOptions();

        renderCompareChart();

      }
    );


    /* =====================================================
       LOAD HISTORY LAZILY
       ===================================================== */

    async function ensureHistoryData() {

      /*
        Историю не перезагружаем
        чаще раза в минуту.
      */

      if (
        state.historyData &&
        Date.now() -
          state.historyLoadedAt <
          60000
      ) {

        return;
      }


      if (
        state.historyLoading
      ) {

        return;
      }


      state.historyLoading =
        true;


      try {

        const data =
          await api({
            mode: "all",
            _: Date.now()
          });


        state.historyData =
          data;


        state.historyLoadedAt =
          Date.now();


      } catch (error) {

        console.error(error);

      } finally {

        state.historyLoading =
          false;
      }
    }


    /* =====================================================
       HISTORY UI
       ===================================================== */

    function renderHistoryPeople() {

      if (
        !state.historyData ||
        !state.historyData.people
      ) {

        historyPersonEl.innerHTML =
          "";

        historyListEl.innerHTML =
          '<div class="empty">Не удалось загрузить историю</div>';

        return;
      }


      const names =
        Object.keys(
          state.historyData.people
        );


      historyPersonEl.innerHTML =
        "";


      names.forEach(name => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          name;


        option.textContent =
          name;


        historyPersonEl.appendChild(
          option
        );
      });


      historyPersonEl.onchange =
        () => {

          renderPersonHistory(
            historyPersonEl.value
          );

        };


      if (
        names.length
      ) {

        renderPersonHistory(
          names[0]
        );
      }
    }


    function renderPersonHistory(
      name
    ) {

      const rows =
        state.historyData &&
        state.historyData.people &&
        Array.isArray(
          state.historyData.people[
            name
          ]
        )
          ? state.historyData.people[
              name
            ]
          : [];


      historyListEl.innerHTML =
        "";


      const safeRows =
        rows.filter(
          item =>
            isSafePercent(
              item.percent
            )
        );


      if (
        safeRows.length === 0
      ) {

        historyListEl.innerHTML =
          '<div class="empty">История отсутствует</div>';

        return;
      }


      safeRows
        .slice()
        .sort(
          (a, b) =>
            Number(b.sort) -
            Number(a.sort)
        )
        .forEach(item => {

          const row =
            document.createElement(
              "div"
            );


          row.className =
            "history-row";


          const percent =
            Number(
              item.percent
            );


          row.innerHTML = `

            <span class="history-period">
              ${escapeHtml(item.label)}
            </span>

            <span
              class="${
                percent >= 90
                  ? "history-percent green"
                  : "history-percent"
              }">
              ${formatPercent(percent)}
            </span>

          `;


          historyListEl.appendChild(
            row
          );
        });
    }


    /* =====================================================
       COMPARE OPTIONS
       ===================================================== */

    function renderCompareOptions() {

      compareOptionsEl.innerHTML =
        "";


      if (
        !state.historyData ||
        !state.historyData.people
      ) {

        return;
      }


      const names =
        Object.keys(
          state.historyData.people
        );


      names.forEach(name => {

        const label =
          document.createElement(
            "label"
          );


        label.className =
          "compare-option";


        const checkbox =
          document.createElement(
            "input"
          );


        checkbox.type =
          "checkbox";


        checkbox.checked =
          state.selectedComparePeople
            .has(name);


        checkbox.addEventListener(
          "change",
          () => {

            if (
              checkbox.checked
            ) {

              state
                .selectedComparePeople
                .add(name);

            } else {

              state
                .selectedComparePeople
                .delete(name);
            }


            renderCompareChart();

          }
        );


        const text =
          document.createElement(
            "span"
          );


        text.textContent =
          name;


        label.appendChild(
          checkbox
        );


        label.appendChild(
          text
        );


        compareOptionsEl.appendChild(
          label
        );

      });
    }


    /* =====================================================
       SVG COMPARISON
       ===================================================== */

    function renderCompareChart() {

      const svg =
        compareChartEl;


      svg.innerHTML =
        "";


      if (
        !state.historyData
      ) {
        return;
      }


      const selected =
        [
          ...state.selectedComparePeople
        ];


      if (
        selected.length === 0
      ) {

        svg.innerHTML = `

          <text
            x="450"
            y="180"
            text-anchor="middle"
            fill="#8997b4"
            font-size="15">
            Выберите участников для сравнения
          </text>

        `;

        return;
      }


      const periods =
        Array.isArray(
          state.historyData.periods
        )
          ? state.historyData.periods
              .slice()
              .sort(
                (a, b) =>
                  Number(a.sort) -
                  Number(b.sort)
              )
          : [];


      if (
        periods.length === 0
      ) {

        return;
      }


      const width =
        900;


      const height =
        360;


      const left =
        50;


      const right =
        20;


      const top =
        25;


      const bottom =
        50;


      const chartWidth =
        width -
        left -
        right;


      const chartHeight =
        height -
        top -
        bottom;


      const minY =
        70;


      const maxY =
        100;


      /* -----------------------------
         GRID Y
         ----------------------------- */

      for (
        let value = 70;
        value <= 100;
        value += 5
      ) {

        const y =
          top +
          chartHeight *
            (
              1 -
              (
                value -
                minY
              ) /
              (
                maxY -
                minY
              )
            );


        addSvgLine(
          svg,
          left,
          y,
          width - right,
          y,
          "rgba(255,255,255,.09)"
        );


        addSvgText(
          svg,
          42,
          y + 4,
          value + "%",
          "#8997b4",
          "end",
          11
        );
      }


      /* -----------------------------
         X LABELS
         ----------------------------- */

      periods.forEach(
        (period, index) => {

          if (
            periods.length > 12 &&
            index % 2 !== 0 &&
            index !==
              periods.length - 1
          ) {

            return;
          }


          const x =
            periods.length === 1
              ? left +
                chartWidth / 2
              : left +
                chartWidth *
                index /
                (
                  periods.length - 1
                );


          const label =
            MONTH_NAMES[
              Number(period.month) - 1
            ]
              .slice(0, 3) +
            " " +
            String(
              period.year
            ).slice(-2);


          addSvgText(
            svg,
            x,
            height - 18,
            label,
            "#8997b4",
            "middle",
            10
          );
        }
      );


      /* -----------------------------
         SERIES

         Цвет не задаём вручную
         массивом.

         Берём текущийColor через CSS
         stroke HSL по индексу.
         ----------------------------- */

      selected.forEach(
        (name, seriesIndex) => {

          const rows =
            state.historyData.people[
              name
            ] || [];


          const map =
            new Map();


          rows.forEach(row => {

            if (
              isSafePercent(
                row.percent
              )
            ) {

              map.set(
                row.period,
                Number(
                  row.percent
                )
              );
            }
          });


          const hue =
            (
              seriesIndex * 73 +
              190
            ) %
            360;


          const stroke =
            `hsl(${hue} 75% 62%)`;


          let path =
            "";


          let started =
            false;


          periods.forEach(
            (period, index) => {

              const value =
                map.get(
                  period.key
                );


              if (
                value === undefined
              ) {

                started =
                  false;

                return;
              }


              const x =
                periods.length === 1
                  ? left +
                    chartWidth / 2
                  : left +
                    chartWidth *
                    index /
                    (
                      periods.length -
                      1
                    );


              const clamped =
                Math.max(
                  minY,
                  Math.min(
                    maxY,
                    value
                  )
                );


              const y =
                top +
                chartHeight *
                  (
                    1 -
                    (
                      clamped -
                      minY
                    ) /
                    (
                      maxY -
                      minY
                    )
                  );


              if (!started) {

                path +=
                  `M ${x} ${y} `;

                started =
                  true;

              } else {

                path +=
                  `L ${x} ${y} `;
              }


              const circle =
                document
                  .createElementNS(
                    "http://www.w3.org/2000/svg",
                    "circle"
                  );


              circle.setAttribute(
                "cx",
                x
              );


              circle.setAttribute(
                "cy",
                y
              );


              circle.setAttribute(
                "r",
                "3.5"
              );


              circle.setAttribute(
                "fill",
                stroke
              );


              svg.appendChild(
                circle
              );

            }
          );


          const pathEl =
            document
              .createElementNS(
                "http://www.w3.org/2000/svg",
                "path"
              );


          pathEl.setAttribute(
            "d",
            path
          );


          pathEl.setAttribute(
            "fill",
            "none"
          );


          pathEl.setAttribute(
            "stroke",
            stroke
          );


          pathEl.setAttribute(
            "stroke-width",
            "2.5"
          );


          pathEl.setAttribute(
            "stroke-linecap",
            "round"
          );


          pathEl.setAttribute(
            "stroke-linejoin",
            "round"
          );


          svg.appendChild(
            pathEl
          );


          addSvgText(
            svg,
            left + 10,
            18 +
              seriesIndex * 16,
            name,
            stroke,
            "start",
            10
          );

        }
      );
    }


    /* =====================================================
       SVG HELPERS
       ===================================================== */

    function addSvgLine(
      svg,
      x1,
      y1,
      x2,
      y2,
      stroke
    ) {

      const line =
        document
          .createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
          );


      line.setAttribute(
        "x1",
        x1
      );


      line.setAttribute(
        "y1",
        y1
      );


      line.setAttribute(
        "x2",
        x2
      );


      line.setAttribute(
        "y2",
        y2
      );


      line.setAttribute(
        "stroke",
        stroke
      );


      line.setAttribute(
        "stroke-width",
        "1"
      );


      svg.appendChild(
        line
      );
    }


    function addSvgText(
      svg,
      x,
      y,
      text,
      fill,
      anchor,
      size
    ) {

      const el =
        document
          .createElementNS(
            "http://www.w3.org/2000/svg",
            "text"
          );


      el.setAttribute(
        "x",
        x
      );


      el.setAttribute(
        "y",
        y
      );


      el.setAttribute(
        "fill",
        fill
      );


      el.setAttribute(
        "text-anchor",
        anchor
      );


      el.setAttribute(
        "font-size",
        size
      );


      el.textContent =
        text;


      svg.appendChild(
        el
      );
    }


    /* =====================================================
       UI HELPERS
       ===================================================== */

    function showRankingLoader() {

      rankingEl.innerHTML =
        '<div class="loader"></div>';
    }


    function showEmptyRanking(text) {

      rankingEl.innerHTML =
        `<div class="empty">${escapeHtml(text)}</div>`;
    }


    function setStatus(
      text,
      error = false
    ) {

      statusEl.textContent =
        text || "";


      statusEl.classList.toggle(
        "error",
        Boolean(error)
      );
    }


    function showMainError(error) {

      console.error(error);


      setStatus(
        "Ошибка загрузки данных",
        true
      );


      showEmptyRanking(
        "Не удалось получить данные"
      );
    }


    function isSafePercent(value) {

      const number =
        Number(value);


      return (
        Number.isFinite(number) &&
        number >= 0 &&
        number <= 100
      );
    }


    function clampPercent(value) {

      const number =
        Number(value);


      if (
        !Number.isFinite(number)
      ) {

        return 0;
      }


      return Math.max(
        0,
        Math.min(
          100,
          number
        )
      );
    }


    function formatPercent(value) {

      const number =
        Number(value);


      if (
        !isSafePercent(number)
      ) {

        return "—";
      }


      return (
        number
          .toFixed(1)
          .replace(
            ".",
            ","
          )
        +
        "%"
      );
    }


    function escapeHtml(value) {

      return String(
        value || ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }


    /* =====================================================
       VISIBILITY

       Когда возвращаемся на вкладку
       браузера, один раз обновляем
       выбранный период.
       ===================================================== */

    document.addEventListener(
      "visibilitychange",
      () => {

        if (
          !document.hidden &&
          state.selectedPeriod
        ) {

          loadRanking(
            state.selectedPeriod,
            true
          );
        }
      }
    );


    /* =====================================================
       RUN
       ===================================================== */

    init();

  </script>

</body>
