<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Рейтинг команды</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #050c18;
      --bg2: #0c1730;
      --card: rgba(22, 36, 63, 0.94);
      --card2: rgba(14, 27, 49, 0.97);
      --border: rgba(255,255,255,.11);

      --text: #f5f7ff;
      --muted: #8e9bb7;

      --blue: #38bdf8;
      --green: #31d879;

      --gold: #f6c626;
      --silver: #bac4d1;
      --bronze: #cf7b30;

      --danger: #ff6174;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 50% 0%,
          #172959 0%,
          #0b162b 34%,
          #050c18 74%
        );

      background-attachment: fixed;
    }

    body.modal-open {
      overflow: hidden;
    }

    button {
      font: inherit;
    }

    .page {
      min-height: 100vh;
      padding: 28px 16px 60px;
    }

    .container {
      width: min(920px, 100%);
      margin: 0 auto;
    }

    /* ================================
       HEADER
       ================================ */

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    .eyebrow {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .current-period {
      margin: 0;

      font-size: 30px;
      line-height: 1.1;
      font-weight: 850;

      letter-spacing: -.7px;
    }

    .status {
      min-height: 18px;
      margin-top: 8px;

      font-size: 12px;
      color: var(--muted);
    }

    .status.error {
      color: var(--danger);
    }

    /* ================================
       RANKING
       ================================ */

    .ranking {
      display: grid;
      gap: 9px;
      margin-top: 18px;
    }

    .rank-card {
      display: grid;

      grid-template-columns:
        46px
        minmax(145px, 1.25fr)
        minmax(210px, 4fr)
        auto;

      align-items: center;

      min-height: 68px;
      padding: 10px 15px;

      border:
        1px solid
        var(--border);

      border-radius: 17px;

      background:
        linear-gradient(
          90deg,
          rgba(30,45,74,.95),
          rgba(15,26,47,.94)
        );

      transition:
        transform .7s cubic-bezier(.2,.8,.2,1),
        border-color .3s ease,
        box-shadow .3s ease,
        opacity .3s ease;

      will-change: transform;
    }

    .rank-card.first {
      border-color:
        rgba(246,198,38,.68);

      box-shadow:
        0 0 26px rgba(246,198,38,.055);
    }

    .rank-card.second {
      border-color:
        rgba(186,196,209,.48);
    }

    .rank-card.third {
      border-color:
        rgba(207,123,48,.62);
    }

    .rank-card.new-card {
      animation:
        cardAppear .45s ease both;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform:
          translateY(14px)
          scale(.985);
      }

      to {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }
    }

    .place {
      text-align: center;

      font-size: 20px;
      font-weight: 800;
    }

    .person-name {
      min-width: 0;

      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;

      font-size: 16px;
      font-weight: 780;
    }

    .percent {
      min-width: 72px;

      padding-left: 13px;

      text-align: right;
      white-space: nowrap;

      font-size: 21px;
      line-height: 1;

      font-weight: 850;

      color: var(--blue);

      transition:
        color .35s ease,
        transform .22s ease;
    }

    .percent.green {
      color: var(--green);
    }

    .percent.value-changed {
      transform: scale(1.08);
    }

    /* ================================
       PROGRESS
       ================================ */

    .bar-wrap {
      position: relative;

      padding: 14px 8px;

      cursor: pointer;

      border-radius: 12px;

      -webkit-tap-highlight-color:
        transparent;
    }

    .bar-track {
      position: relative;

      height: 10px;

      border-radius: 999px;

      overflow: hidden;

      background:
        rgba(255,255,255,.08);

      box-shadow:
        inset 0 0 0 1px
        rgba(255,255,255,.045);
    }

    .bar-fill {
      position: absolute;

      left: 0;
      top: 0;
      bottom: 0;

      width: 0%;

      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          #229ee9 0%,
          #30bbbd 72%,
          #31d879 100%
        );

      transition:
        width .8s
        cubic-bezier(.2,.75,.2,1);

      will-change: width;
    }

    .bar-grid {
      position: absolute;

      left: 8px;
      right: 8px;

      top: 6px;
      height: 26px;

      pointer-events: none;
    }

    .bar-tick {
      position: absolute;

      top: 0;

      width: 1px;
      height: 5px;

      background:
        rgba(255,255,255,.22);

      transform:
        translateX(-.5px);
    }

    .bar-tick.major {
      height: 7px;

      background:
        rgba(255,255,255,.35);
    }

    .empty {
      padding: 28px 18px;

      text-align: center;

      color: var(--muted);

      border:
        1px solid var(--border);

      border-radius: 18px;

      background:
        rgba(15,26,47,.55);
    }

    .loader {
      width: 32px;
      height: 32px;

      margin: 36px auto;

      border:
        3px solid
        rgba(255,255,255,.13);

      border-top-color:
        var(--blue);

      border-radius: 50%;

      animation:
        spin .75s linear infinite;
    }

    @keyframes spin {
      to {
        transform:
          rotate(360deg);
      }
    }

    /* ================================
       ARCHIVE BUTTON
       ================================ */

    .footer {
      margin-top: 28px;
      text-align: center;
    }

    .archive-link {
      appearance: none;

      border: 0;

      background: transparent;

      color: #aab7d3;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      padding: 10px 14px;

      border-radius: 10px;

      transition:
        color .2s ease,
        background .2s ease;
    }

    .archive-link:hover {
      color: white;

      background:
        rgba(255,255,255,.055);
    }

    /* ================================
       MODALS
       ================================ */

    .modal {
      position: fixed;

      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 18px;

      background:
        rgba(0,0,0,.72);

      backdrop-filter:
        blur(7px);

      z-index: 1000;
    }

    .modal.visible {
      display: flex;
    }

    .modal-card {
      width:
        min(900px, 100%);

      max-height:
        calc(100vh - 36px);

      overflow: auto;

      border:
        1px solid
        rgba(255,255,255,.13);

      border-radius: 22px;

      background:
        linear-gradient(
          180deg,
          #111f38,
          #07111f
        );

      box-shadow:
        0 30px 100px
        rgba(0,0,0,.55);
    }

    .modal-card.person-card {
      width:
        min(1000px, 100%);
    }

    .modal-head {
      position: sticky;

      top: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 18px 20px;

      background:
        rgba(12,23,48,.96);

      backdrop-filter:
        blur(8px);

      border-bottom:
        1px solid
        var(--border);

      z-index: 10;
    }

    .modal-title {
      margin: 0;

      font-size: 21px;
      font-weight: 820;
    }

    .close-btn {
      width: 38px;
      height: 38px;

      border: 0;
      border-radius: 12px;

      background:
        rgba(255,255,255,.075);

      color: white;

      font-size: 25px;
      line-height: 1;

      cursor: pointer;
    }

    .modal-body {
      padding: 18px;
    }

    .panel {
      padding: 17px;

      margin-bottom: 14px;

      border:
        1px solid
        var(--border);

      border-radius: 17px;

      background:
        rgba(255,255,255,.025);
    }

    .section-title {
      margin:
        0 0 14px;

      font-size: 15px;
      font-weight: 800;
    }

    /* ================================
       ARCHIVE
       ================================ */

    .archive-years,
    .archive-months {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;
    }

    .archive-months {
      margin-top: 14px;
    }

    .archive-chip {
      appearance: none;

      padding:
        9px 13px;

      border:
        1px solid
        rgba(255,255,255,.12);

      border-radius:
        999px;

      background:
        rgba(255,255,255,.04);

      color:
        #dbe4f7;

      font-weight:
        700;

      cursor:
        pointer;

      transition:
        background .2s ease,
        border-color .2s ease,
        color .2s ease;
    }

    .archive-chip.active {
      color: white;

      background:
        rgba(56,189,248,.16);

      border-color:
        rgba(56,189,248,.5);
    }

    .archive-ranking {
      margin-top: 16px;

      display: grid;
      gap: 9px;
    }

    /* ================================
       HISTORY
       ================================ */

    .history-list {
      display: grid;
      gap: 7px;
    }

    .history-row {
      display: flex;

      justify-content:
        space-between;

      align-items:
        center;

      gap: 12px;

      padding:
        10px 12px;

      border-radius:
        12px;

      background:
        rgba(255,255,255,.04);
    }

    .history-period {
      color:
        #b7c3dc;

      font-size:
        14px;
    }

    .history-percent {
      font-weight:
        820;

      color:
        var(--blue);
    }

    .history-percent.green {
      color:
        var(--green);
    }

    /* ================================
       COMPARE
       ================================ */

    .compare-options {
      display: flex;
      flex-wrap: wrap;

      gap: 8px;
    }

    .compare-option {
      display:
        inline-flex;

      align-items:
        center;

      gap: 7px;

      padding:
        8px 10px;

      border:
        1px solid
        rgba(255,255,255,.11);

      border-radius:
        11px;

      background:
        rgba(255,255,255,.035);

      cursor:
        pointer;

      user-select:
        none;

      font-size:
        13px;
    }

    .compare-option input {
      accent-color:
        var(--blue);
    }

    .chart-wrap {
      margin-top: 18px;

      overflow-x: auto;

      border:
        1px solid
        rgba(255,255,255,.08);

      border-radius:
        14px;

      background:
        rgba(0,0,0,.12);
    }

    #compareChart {
      display: block;

      min-width: 720px;
    }

    /* ================================
       MOBILE
       ================================ */

    @media (
      max-width: 680px
    ) {

      .page {
        padding:
          20px 10px 42px;
      }

      .current-period {
        font-size: 27px;
      }

      .rank-card {
        grid-template-columns:
          38px
          minmax(0,1fr)
          78px;

        grid-template-areas:
          "place name percent"
          "bar bar bar";

        row-gap: 5px;

        min-height:
          78px;

        padding:
          10px 11px;
      }

      .place {
        grid-area: place;

        font-size:
          18px;
      }

      .person-name {
        grid-area: name;

        font-size:
          15px;
      }

      .percent {
        grid-area:
          percent;

        font-size:
          19px;

        padding-left:
          4px;
      }

      .bar-wrap {
        grid-area:
          bar;

        padding:
          11px 3px
          7px;
      }

      .bar-grid {
        left: 3px;
        right: 3px;
      }

      .modal {
        padding: 8px;
      }

      .modal-card {
        max-height:
          calc(
            100vh - 16px
          );

        border-radius:
          18px;
      }

      .modal-head {
        padding:
          14px;
      }

      .modal-body {
        padding:
          12px;
      }

      .panel {
        padding:
          13px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="container">

      <header class="header">

        <div class="eyebrow">
          Текущий месяц
        </div>

        <h1
          class="current-period"
          id="currentPeriod">
        </h1>

        <div
          class="status"
          id="status">
        </div>

      </header>


      <section
        class="ranking"
        id="ranking">
      </section>


      <footer class="footer">

        <button
          class="archive-link"
          id="archiveBtn"
          type="button">
          Архив
        </button>

      </footer>

    </div>

  </main>


  <!-- ===================================
       ARCHIVE MODAL
       =================================== -->

  <div
    class="modal"
    id="archiveModal"
    aria-hidden="true">

    <div class="modal-card">

      <div class="modal-head">

        <h2 class="modal-title">
          Архив
        </h2>

        <button
          class="close-btn"
          id="archiveClose"
          type="button"
          aria-label="Закрыть">
          ×
        </button>

      </div>


      <div class="modal-body">

        <div class="panel">

          <div
            class="archive-years"
            id="archiveYears">
          </div>

          <div
            class="archive-months"
            id="archiveMonths">
          </div>

        </div>


        <div
          class="archive-ranking"
          id="archiveRanking">
        </div>

      </div>

    </div>

  </div>


  <!-- ===================================
       PERSON MODAL
       =================================== -->

  <div
    class="modal"
    id="personModal"
    aria-hidden="true">

    <div
      class="
        modal-card
        person-card
      ">

      <div class="modal-head">

        <h2
          class="modal-title"
          id="personModalTitle">
          Статистика участника
        </h2>

        <button
          class="close-btn"
          id="personClose"
          type="button"
          aria-label="Закрыть">
          ×
        </button>

      </div>


      <div class="modal-body">

        <div class="panel">

          <h3 class="section-title">
            История статистики
          </h3>

          <div
            class="history-list"
            id="historyList">
          </div>

        </div>


        <div class="panel">

          <h3 class="section-title">
            Сравнение участников
          </h3>

          <div
            class="compare-options"
            id="compareOptions">
          </div>


          <div class="chart-wrap">

            <svg
              id="compareChart"
              width="100%"
              height="370"
              viewBox="0 0 900 370"
              preserveAspectRatio="none">
            </svg>

          </div>

        </div>

      </div>

    </div>

  </div>


  <script>

    /* ===================================
       API
       =================================== */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbwYcG1OIZ_y2E3OZQw8oH0IuDMyk06lxL41oM6K1TtXN0Noxa5bV7kC_hsWOXTsTde_IA/exec";


    const MONTH_KEYS = [
      "ЯНВАРЬ",
      "ФЕВРАЛЬ",
      "МАРТ",
      "АПРЕЛЬ",
      "МАЙ",
      "ИЮНЬ",
      "ИЮЛЬ",
      "АВГУСТ",
      "СЕНТЯБРЬ",
      "ОКТЯБРЬ",
      "НОЯБРЬ",
      "ДЕКАБРЬ"
    ];


    const MONTH_NAMES = [
      "Январь",
      "Февраль",
      "Март",
      "Апрель",
      "Май",
      "Июнь",
      "Июль",
      "Август",
      "Сентябрь",
      "Октябрь",
      "Ноябрь",
      "Декабрь"
    ];


    /* ===================================
       STATE
       =================================== */

    const state = {

      currentPeriod: null,

      currentPeople: [],

      currentMonthLoading: false,

      archivePeriods: null,

      archiveSelectedYear: null,

      archiveSelectedPeriod: null,

      archiveRankingCache:
        new Map(),

      archiveOpened:
        false,

      historyData:
        null,

      historyLoading:
        null,

      selectedPerson:
        null,

      selectedComparePeople:
        new Set()
    };


    /* ===================================
       DOM
       =================================== */

    const rankingEl =
      document.getElementById(
        "ranking"
      );

    const currentPeriodEl =
      document.getElementById(
        "currentPeriod"
      );

    const statusEl =
      document.getElementById(
        "status"
      );

    const archiveBtn =
      document.getElementById(
        "archiveBtn"
      );

    const archiveModal =
      document.getElementById(
        "archiveModal"
      );

    const archiveClose =
      document.getElementById(
        "archiveClose"
      );

    const archiveYearsEl =
      document.getElementById(
        "archiveYears"
      );

    const archiveMonthsEl =
      document.getElementById(
        "archiveMonths"
      );

    const archiveRankingEl =
      document.getElementById(
        "archiveRanking"
      );

    const personModal =
      document.getElementById(
        "personModal"
      );

    const personClose =
      document.getElementById(
        "personClose"
      );

    const personModalTitle =
      document.getElementById(
        "personModalTitle"
      );

    const historyListEl =
      document.getElementById(
        "historyList"
      );

    const compareOptionsEl =
      document.getElementById(
        "compareOptions"
      );

    const compareChartEl =
      document.getElementById(
        "compareChart"
      );


    /* ===================================
       FETCH
       =================================== */

    async function api(params) {

      const url =
        new URL(
          API_URL
        );


      Object
        .entries(params)
        .forEach(
          ([key,value]) => {

            url.searchParams.set(
              key,
              value
            );
          }
        );


      /*
       * Запрещаем браузеру использовать
       * старую копию ответа.
       */

      url.searchParams.set(
        "_",
        Date.now()
      );


      const response =
        await fetch(
          url.toString(),
          {
            cache:
              "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );
      }


      const data =
        await response.json();


      if (
        data &&
        data.ok === false
      ) {

        throw new Error(
          data.error ||
          "Ошибка API"
        );
      }


      return data;
    }


    /* ===================================
       CURRENT MONTH
       =================================== */

    function getCurrentPeriod() {

      const now =
        new Date();

      const month =
        now.getMonth();

      const year =
        now.getFullYear();


      return {
        key:
          MONTH_KEYS[month] +
          year,

        month:
          month + 1,

        year:
          year,

        label:
          MONTH_NAMES[month] +
          " " +
          year
      };
    }


    async function loadCurrentMonth(
      silent = false
    ) {

      if (
        state.currentMonthLoading
      ) {
        return;
      }


      state.currentMonthLoading =
        true;


      const period =
        getCurrentPeriod();


      const monthChanged =
        state.currentPeriod &&
        state.currentPeriod.key !==
          period.key;


      if (monthChanged) {

        state.archivePeriods =
          null;

        state.archiveSelectedYear =
          null;

        state.archiveSelectedPeriod =
          null;

        state.archiveRankingCache
          .clear();

        state.historyData =
          null;

        state.historyLoading =
          null;

        state.currentPeople =
          [];

        rankingEl.innerHTML =
          "";
      }


      state.currentPeriod =
        period;


      currentPeriodEl.textContent =
        period.label;


      if (
        !silent &&
        !rankingEl.children.length
      ) {

        showRankingLoader(
          rankingEl
        );
      }


      setStatus("");


      try {

        /*
         * fresh=1 говорит новому Code.gs:
         * не использовать старый
         * 20-секундный кеш рейтинга.
         */

        const data =
          await api({
            mode: "month",
            period: period.key,
            fresh: "1"
          });


        /*
         * За время запроса мог
         * наступить следующий месяц.
         */

        const actualPeriod =
          getCurrentPeriod();


        if (
          actualPeriod.key !==
          period.key
        ) {
          return;
        }


        const people =
          sanitizePeople(
            getRankingArray(
              data
            )
          );


        if (
          !rankingEl.querySelector(
            ".rank-card"
          )
        ) {

          renderRanking(
            rankingEl,
            people,
            {
              clickableScale:
                true
            }
          );

        } else {

          updateLiveRanking(
            people
          );
        }


        state.currentPeople =
          people;


        setStatus("");


      } catch (error) {

        console.error(
          "Ошибка загрузки:",
          error
        );


        /*
         * Если старый рейтинг
         * уже есть — не убираем его
         * из-за одного неудачного запроса.
         */

        if (
          !state.currentPeople.length
        ) {

          setStatus(
            "Ошибка загрузки данных",
            true
          );


          showEmpty(
            rankingEl,
            "Не удалось получить данные текущего месяца"
          );
        }

      } finally {

        state.currentMonthLoading =
          false;
      }
    }


    /* ===================================
       CREATE / UPDATE CARD
       =================================== */

    function createRankingCard(
      person,
      index,
      clickableScale
    ) {

      const card =
        document.createElement(
          "article"
        );


      card.className =
        "rank-card";


      card.dataset.personName =
        person.name;


      card.innerHTML =
        `
          <div class="place"></div>

          <div class="person-name"></div>

          <div
            class="bar-wrap"
            title="Открыть историю"
          >
            <div class="bar-track">
              <div class="bar-fill"></div>
            </div>

            <div class="bar-grid"></div>
          </div>

          <div class="percent"></div>
        `;


      createScaleTicks(
        card.querySelector(
          ".bar-grid"
        )
      );


      if (clickableScale) {

        card
          .querySelector(
            ".bar-wrap"
          )
          .addEventListener(
            "click",
            () => {

              openPersonStatistics(
                card.dataset.personName
              );
            }
          );
      }


      /*
       * Сначала ставим ширину 0,
       * чтобы даже при первой загрузке
       * шкала красиво заполнилась.
       */

      const fill =
        card.querySelector(
          ".bar-fill"
        );


      fill.style.width =
        "0%";


      updateRankingCard(
        card,
        person,
        index,
        true
      );


      return card;
    }


    function updateRankingCard(
      card,
      person,
      index,
      initial = false
    ) {

      const oldPercent =
        Number(
          card.dataset.percent
        );


      const newPercent =
        clampPercent(
          person.percent
        );


      card.dataset.personName =
        person.name;


      card
        .classList
        .toggle(
          "first",
          index === 0
        );


      card
        .classList
        .toggle(
          "second",
          index === 1
        );


      card
        .classList
        .toggle(
          "third",
          index === 2
        );


      const placeEl =
        card.querySelector(
          ".place"
        );


      const nameEl =
        card.querySelector(
          ".person-name"
        );


      const percentEl =
        card.querySelector(
          ".percent"
        );


      const fillEl =
        card.querySelector(
          ".bar-fill"
        );


      placeEl.textContent =
        getPlaceIcon(
          index
        );


      nameEl.textContent =
        person.name;


      percentEl.classList.toggle(
        "green",
        newPercent >= 90
      );


      /*
       * При первом появлении карточки
       * число показываем сразу,
       * а шкалу запускаем через frame.
       */

      if (
        initial ||
        !Number.isFinite(
          oldPercent
        )
      ) {

        percentEl.textContent =
          formatPercent(
            newPercent
          );


        card.dataset.percent =
          String(
            newPercent
          );


        requestAnimationFrame(
          () => {

            requestAnimationFrame(
              () => {

                fillEl.style.width =
                  newPercent + "%";
              }
            );
          }
        );


        return;
      }


      /*
       * Если значение вообще
       * не изменилось —
       * ничего не анимируем.
       */

      if (
        Math.abs(
          oldPercent -
          newPercent
        ) < 0.0001
      ) {

        fillEl.style.width =
          newPercent + "%";

        return;
      }


      /*
       * Шкала двигается CSS-анимацией.
       */

      fillEl.style.width =
        newPercent + "%";


      /*
       * Цифры меняются именно
       * по одной десятой:
       *
       * 90,0
       * 89,9
       * 89,8
       * ...
       * 87,3
       */

      animatePercentValue(
        percentEl,
        oldPercent,
        newPercent,
        card
      );


      percentEl.classList.add(
        "value-changed"
      );


      setTimeout(
        () => {

          percentEl
            .classList
            .remove(
              "value-changed"
            );
        },
        260
      );
    }


    /* ===================================
       SMOOTH NUMBER
       =================================== */

    function animatePercentValue(
      element,
      from,
      to,
      card
    ) {

      /*
       * Прерываем старую анимацию,
       * если новое значение пришло,
       * пока предыдущая ещё идёт.
       */

      const previousTimer =
        Number(
          element.dataset.timerId
        );


      if (
        Number.isFinite(
          previousTimer
        )
      ) {
        clearInterval(
          previousTimer
        );
      }


      const startTenths =
        Math.round(
          Number(from) * 10
        );


      const targetTenths =
        Math.round(
          Number(to) * 10
        );


      if (
        startTenths ===
        targetTenths
      ) {

        element.textContent =
          formatPercent(
            to
          );


        card.dataset.percent =
          String(to);


        return;
      }


      const direction =
        targetTenths >
        startTenths
          ? 1
          : -1;


      const distance =
        Math.abs(
          targetTenths -
          startTenths
        );


      /*
       * Хотим видеть шаги по 0,1,
       * но не растягивать анимацию
       * на десятки секунд при
       * большом скачке.
       *
       * Обычные изменения идут
       * примерно 35-55 мс на 0,1.
       */

      let stepDelay =
        42;


      if (
        distance > 50
      ) {
        stepDelay = 24;
      }


      if (
        distance > 120
      ) {
        stepDelay = 14;
      }


      let current =
        startTenths;


      const timer =
        setInterval(
          () => {

            current +=
              direction;


            if (
              direction > 0 &&
              current >=
                targetTenths
            ) {
              current =
                targetTenths;
            }


            if (
              direction < 0 &&
              current <=
                targetTenths
            ) {
              current =
                targetTenths;
            }


            const value =
              current / 10;


            element.textContent =
              formatPercent(
                value
              );


            element.classList.toggle(
              "green",
              value >= 90
            );


            card.dataset.percent =
              String(
                value
              );


            if (
              current ===
              targetTenths
            ) {

              clearInterval(
                timer
              );


              element.dataset.timerId =
                "";


              /*
               * Сохраняем точное
               * серверное значение.
               */

              card.dataset.percent =
                String(to);


              element.textContent =
                formatPercent(
                  to
                );


              element.classList.toggle(
                "green",
                to >= 90
              );
            }

          },
          stepDelay
        );


      element.dataset.timerId =
        String(timer);
    }


    /* ===================================
       LIVE REORDER
       =================================== */

    function updateLiveRanking(
      people
    ) {

      if (
        !Array.isArray(
          people
        )
      ) {
        return;
      }


      if (
        !people.length
      ) {

        if (
          !rankingEl.querySelector(
            ".rank-card"
          )
        ) {

          showEmpty(
            rankingEl,
            "За этот месяц статистика не найдена"
          );
        }

        return;
      }


      const existing =
        new Map();


      const firstPositions =
        new Map();


      Array
        .from(
          rankingEl.querySelectorAll(
            ".rank-card"
          )
        )
        .forEach(
          card => {

            const name =
              card.dataset.personName ||
              "";


            if (!name) {
              return;
            }


            existing.set(
              name,
              card
            );


            firstPositions.set(
              name,
              card.getBoundingClientRect()
            );
          }
        );


      const incomingNames =
        new Set(
          people.map(
            person =>
              person.name
          )
        );


      /*
       * Удаляем только людей,
       * которых больше нет в ответе.
       */

      existing.forEach(
        (card,name) => {

          if (
            !incomingNames.has(
              name
            )
          ) {
            card.remove();
          }
        }
      );


      /*
       * Обновляем карточки
       * и сразу ставим их
       * в новый порядок.
       */

      people.forEach(
        (person,index) => {

          let card =
            existing.get(
              person.name
            );


          if (!card) {

            card =
              createRankingCard(
                person,
                index,
                true
              );


            card.classList.add(
              "new-card"
            );

          } else {

            updateRankingCard(
              card,
              person,
              index
            );
          }


          rankingEl.appendChild(
            card
          );
        }
      );


      /*
       * FLIP animation:
       * после перестановки карточки
       * визуально стартуют со старых
       * координат и затем едут
       * на новое место.
       */

      const movements =
        [];


      Array
        .from(
          rankingEl.querySelectorAll(
            ".rank-card"
          )
        )
        .forEach(
          card => {

            const name =
              card.dataset.personName;


            const first =
              firstPositions.get(
                name
              );


            if (!first) {
              return;
            }


            const last =
              card.getBoundingClientRect();


            const deltaY =
              first.top -
              last.top;


            if (
              Math.abs(
                deltaY
              ) < 1
            ) {
              return;
            }


            card.style.transition =
              "none";


            card.style.transform =
              `translateY(${deltaY}px)`;


            movements.push(
              card
            );
          }
        );


      if (
        movements.length
      ) {

        /*
         * Форсируем layout,
         * иначе браузер может
         * схлопнуть две позиции
         * в один кадр.
         */

        rankingEl.offsetHeight;


        requestAnimationFrame(
          () => {

            movements.forEach(
              card => {

                card.style.transition =
                  "transform .7s cubic-bezier(.2,.8,.2,1), border-color .3s ease, box-shadow .3s ease, opacity .3s ease";


                card.style.transform =
                  "translateY(0)";
              }
            );


            setTimeout(
              () => {

                movements.forEach(
                  card => {

                    card.style.transform =
                      "";

                    card.style.transition =
                      "";
                  }
                );

              },
              760
            );
          }
        );
      }
    }


    /* ===================================
       TICKS EVERY 5%
       =================================== */

    function createScaleTicks(
      container
    ) {

      if (!container) {
        return;
      }


      container.innerHTML =
        "";


      for (
        let value = 0;
        value <= 100;
        value += 5
      ) {

        const tick =
          document.createElement(
            "span"
          );


        tick.className =
          "bar-tick";


        if (
          value % 10 === 0
        ) {

          tick.classList.add(
            "major"
          );
        }


        tick.style.left =
          value + "%";


        container.appendChild(
          tick
        );
      }
    }

    async function refreshArchivePeriods() {

      const data =
        await api({
          mode: "months"
        });


      const source =
        Array.isArray(
          data.periods
        )
          ? data.periods
          : Array.isArray(
              data.months
            )
            ? data.months
            : [];


      const current =
        getCurrentPeriod();


      /*
       * На экран архива не выводим
       * текущий месяц.
       */

      state.archivePeriods =
        source
          .map(
            normalizePeriodObject
          )
          .filter(Boolean)
          .filter(
            item =>
              item.key !==
              current.key
          )
          .sort(
            (a,b) =>
              a.sort -
              b.sort
          );


      renderArchiveNavigation();
    }


    function renderArchiveNavigation() {

      const periods =
        state.archivePeriods ||
        [];


      if (!periods.length) {

        archiveYearsEl.innerHTML =
          "";

        archiveMonthsEl.innerHTML =
          "";


        showEmpty(
          archiveRankingEl,
          "Архив пока пуст"
        );


        return;
      }


      const years =
        [
          ...new Set(
            periods.map(
              item =>
                item.year
            )
          )
        ]
          .sort(
            (a,b) =>
              b - a
          );


      /*
       * Если выбранного года
       * больше нет, используем
       * самый новый.
       */

      if (
        !state.archiveSelectedYear ||
        !years.includes(
          state.archiveSelectedYear
        )
      ) {

        state.archiveSelectedYear =
          years[0];
      }


      archiveYearsEl.innerHTML =
        "";


      years.forEach(
        year => {

          const button =
            document.createElement(
              "button"
            );


          button.type =
            "button";


          button.className =
            "archive-chip";


          button.textContent =
            year;


          button.classList.toggle(
            "active",
            year ===
            state.archiveSelectedYear
          );


          button.addEventListener(
            "click",
            () => {

              state.archiveSelectedYear =
                year;


              state.archiveSelectedPeriod =
                null;


              archiveRankingEl.innerHTML =
                "";


              renderArchiveNavigation();
            }
          );


          archiveYearsEl.appendChild(
            button
          );
        }
      );


      const months =
        periods
          .filter(
            item =>
              item.year ===
              state.archiveSelectedYear
          )
          .sort(
            (a,b) =>
              a.month -
              b.month
          );


      archiveMonthsEl.innerHTML =
        "";


      months.forEach(
        period => {

          const button =
            document.createElement(
              "button"
            );


          button.type =
            "button";


          button.className =
            "archive-chip";


          button.textContent =
            MONTH_NAMES[
              period.month - 1
            ];


          button.classList.toggle(
            "active",
            period.key ===
            state.archiveSelectedPeriod
          );


          button.addEventListener(
            "click",
            () => {

              loadArchiveMonth(
                period
              );
            }
          );


          archiveMonthsEl.appendChild(
            button
          );
        }
      );
    }


    async function loadArchiveMonth(
      period
    ) {

      state.archiveSelectedPeriod =
        period.key;


      renderArchiveNavigation();


      showRankingLoader(
        archiveRankingEl
      );


      try {

        let people =
          state.archiveRankingCache
            .get(
              period.key
            );


        if (!people) {

          const data =
            await api({
              mode: "month",
              period:
                period.key
            });


          people =
            sanitizePeople(
              getRankingArray(
                data
              )
            );


          state.archiveRankingCache.set(
            period.key,
            people
          );
        }


        /*
         * Если пользователь успел
         * открыть другой месяц —
         * старый ответ не рисуем.
         */

        if (
          state.archiveSelectedPeriod !==
          period.key
        ) {
          return;
        }


        renderRanking(
          archiveRankingEl,
          people,
          {
            clickableScale:
              false
          }
        );


      } catch (error) {

        showEmpty(
          archiveRankingEl,
          "Не удалось загрузить этот месяц"
        );
      }
    }

    async function ensureHistoryData() {

      if (
        state.historyData
      ) {

        return state.historyData;
      }


      if (
        state.historyLoading
      ) {

        return state.historyLoading;
      }


      state.historyLoading =
        api({
          mode: "all"
        })
          .then(
            data => {

              state.historyData =
                normalizeHistoryData(
                  data
                );


              return state.historyData;
            }
          )
          .finally(
            () => {

              state.historyLoading =
                null;
            }
          );


      return state.historyLoading;
    }


    function normalizeHistoryData(
      data
    ) {

      const people =
        [];


      /*
       * Новый формат API:
       *
       * people: [
       *   {
       *     name,
       *     history:[...]
       *   }
       * ]
       */

      if (
        Array.isArray(
          data.people
        )
      ) {

        data.people.forEach(
          person => {

            const history =
              Array.isArray(
                person.history
              )
                ? person.history
                    .map(
                      normalizeHistoryItem
                    )
                    .filter(Boolean)
                    .sort(
                      (a,b) =>
                        a.sort -
                        b.sort
                    )
                : [];


            people.push({
              name:
                String(
                  person.name ||
                  ""
                ).trim(),

              history:
                history
            });
          }
        );
      }


      /*
       * Запасной вариант:
       * если пришёл плоский history.
       */

      if (
        !people.length &&
        Array.isArray(
          data.history
        )
      ) {

        const grouped =
          new Map();


        data.history.forEach(
          item => {

            const name =
              String(
                item.name ||
                ""
              ).trim();


            if (!name) {
              return;
            }


            if (
              !grouped.has(
                name
              )
            ) {

              grouped.set(
                name,
                []
              );
            }


            const normalized =
              normalizeHistoryItem(
                item
              );


            if (normalized) {

              grouped
                .get(name)
                .push(
                  normalized
                );
            }
          }
        );


        grouped.forEach(
          (history,name) => {

            history.sort(
              (a,b) =>
                a.sort -
                b.sort
            );


            people.push({
              name:
                name,

              history:
                history
            });
          }
        );
      }


      return {
        people:
          people
            .filter(
              person =>
                person.name
            )
      };
    }


    function normalizeHistoryItem(
      item
    ) {

      if (!item) {
        return null;
      }


      const percent =
        Number(
          item.percent
        );


      const year =
        Number(
          item.year
        );


      const month =
        Number(
          item.month
        );


      if (
        !isSafePercent(
          percent
        ) ||
        !Number.isFinite(
          year
        ) ||
        !Number.isFinite(
          month
        ) ||
        month < 1 ||
        month > 12
      ) {
        return null;
      }


      return {
        period:
          String(
            item.period ||
            ""
          ),

        year:
          year,

        month:
          month,

        sort:
          Number(
            item.sort ||
            (
              year *
              100 +
              month
            )
          ),

        percent:
          percent
      };
    }


    function renderPersonHistory(
      personName,
      data
    ) {

      const person =
        data.people.find(
          item =>
            item.name ===
            personName
        );


      historyListEl.innerHTML =
        "";


      if (
        !person ||
        !person.history.length
      ) {

        showEmpty(
          historyListEl,
          "История пока отсутствует"
        );


        return;
      }


      /*
       * Самые свежие месяцы сверху.
       */

      [
        ...person.history
      ]
        .sort(
          (a,b) =>
            b.sort -
            a.sort
        )
        .forEach(
          item => {

            const row =
              document.createElement(
                "div"
              );


            row.className =
              "history-row";


            const green =
              item.percent >= 90
                ? " green"
                : "";


            row.innerHTML =
              `
                <div class="history-period">
                  ${
                    MONTH_NAMES[
                      item.month - 1
                    ]
                  }
                  ${item.year}
                </div>

                <div class="history-percent${green}">
                  ${formatPercent(item.percent)}
                </div>
              `;


            historyListEl.appendChild(
              row
            );
          }
        );
    }


    /* ===================================
       COMPARE
       =================================== */

    function renderCompareOptions(
      primaryName,
      data
    ) {

      compareOptionsEl.innerHTML =
        "";


      if (
        !state.selectedComparePeople.size
      ) {

        state.selectedComparePeople.add(
          primaryName
        );
      }


      /*
       * Гарантируем, что человек,
       * которого открыли, выбран.
       */

      state.selectedComparePeople.add(
        primaryName
      );


      const validNames =
        new Set(
          data.people.map(
            person =>
              person.name
          )
        );


      [
        ...state.selectedComparePeople
      ]
        .forEach(
          name => {

            if (
              !validNames.has(
                name
              )
            ) {

              state.selectedComparePeople.delete(
                name
              );
            }
          }
        );


      data.people
        .slice()
        .sort(
          (a,b) =>
            a.name.localeCompare(
              b.name,
              "ru"
            )
        )
        .forEach(
          person => {

            const label =
              document.createElement(
                "label"
              );


            label.className =
              "compare-option";


            const input =
              document.createElement(
                "input"
              );


            input.type =
              "checkbox";


            input.checked =
              state.selectedComparePeople
                .has(
                  person.name
                );


            input.addEventListener(
              "change",
              () => {

                if (input.checked) {

                  state.selectedComparePeople
                    .add(
                      person.name
                    );

                } else {

                  state.selectedComparePeople
                    .delete(
                      person.name
                    );
                }


                renderCompareChart(
                  data
                );
              }
            );


            const span =
              document.createElement(
                "span"
              );


            span.textContent =
              person.name;


            label.appendChild(
              input
            );


            label.appendChild(
              span
            );


            compareOptionsEl.appendChild(
              label
            );
          }
        );
    }


    function renderCompareChart(
      data
    ) {

      const svg =
        compareChartEl;


      svg.innerHTML =
        "";


      const selected =
        data.people.filter(
          person =>
            state.selectedComparePeople
              .has(
                person.name
              )
        );


      if (!selected.length) {

        addSvgText(
          svg,
          450,
          190,
          "Выберите участников",
          "#8e9bb7",
          "middle",
          18
        );


        return;
      }


      const periodMap =
        new Map();


      selected.forEach(
        person => {

          person.history.forEach(
            item => {

              const key =
                item.year +
                "-" +
                String(
                  item.month
                ).padStart(
                  2,
                  "0"
                );


              if (
                !periodMap.has(
                  key
                )
              ) {

                periodMap.set(
                  key,
                  {
                    key:
                      key,

                    year:
                      item.year,

                    month:
                      item.month,

                    sort:
                      item.sort
                  }
                );
              }
            }
          );
        }
      );


      const periods =
        [
          ...periodMap.values()
        ]
          .sort(
            (a,b) =>
              a.sort -
              b.sort
          );


      if (!periods.length) {

        addSvgText(
          svg,
          450,
          190,
          "Нет данных для сравнения",
          "#8e9bb7",
          "middle",
          18
        );


        return;
      }


      const width =
        900;

      const height =
        370;

      const left =
        62;

      const right =
        30;

      const top =
        34;

      const bottom =
        62;

      const chartWidth =
        width -
        left -
        right;

      const chartHeight =
        height -
        top -
        bottom;


      /*
       * Шкала графика строго
       * от 70 до 100.
       */

      const minY =
        70;

      const maxY =
        100;


      function yForPercent(
        value
      ) {

        const clamped =
          Math.max(
            minY,
            Math.min(
              maxY,
              value
            )
          );


        return (
          top +
          (
            maxY -
            clamped
          ) /
          (
            maxY -
            minY
          ) *
          chartHeight
        );
      }


      /*
       * Горизонтальные линии
       * каждые 5%.
       */

      for (
        let value = 70;
        value <= 100;
        value += 5
      ) {

        const y =
          yForPercent(
            value
          );


        addSvgLine(
          svg,
          left,
          y,
          width - right,
          y,
          "rgba(255,255,255,.10)"
        );


        addSvgText(
          svg,
          left - 10,
          y + 4,
          value + "%",
          "#8290ad",
          "end",
          12
        );
      }


      /*
       * Вертикальные подписи месяцев.
       */

      periods.forEach(
        (period,index) => {

          const x =
            getChartX(
              index,
              periods.length,
              left,
              chartWidth
            );


          addSvgLine(
            svg,
            x,
            top,
            x,
            top + chartHeight,
            "rgba(255,255,255,.045)"
          );


          const label =
            MONTH_NAMES[
              period.month - 1
            ]
              .slice(
                0,
                3
              ) +
            " " +
            String(
              period.year
            ).slice(
              -2
            );


          addSvgText(
            svg,
            x,
            height - 27,
            label,
            "#8190ad",
            "middle",
            11
          );
        }
      );


      /*
       * Цвета участников.
       */

      const colors = [
        "#38bdf8",
        "#31d879",
        "#f6c626",
        "#f472b6",
        "#a78bfa",
        "#fb923c",
        "#22d3ee",
        "#e879f9",
        "#f87171",
        "#84cc16"
      ];


      selected.forEach(
        (person,personIndex) => {

          const historyMap =
            new Map();


          person.history.forEach(
            item => {

              historyMap.set(
                item.year +
                "-" +
                String(
                  item.month
                ).padStart(
                  2,
                  "0"
                ),
                item.percent
              );
            }
          );


          const points =
            [];


          periods.forEach(
            (period,index) => {

              if (
                !historyMap.has(
                  period.key
                )
              ) {
                return;
              }


              const value =
                historyMap.get(
                  period.key
                );


              const x =
                getChartX(
                  index,
                  periods.length,
                  left,
                  chartWidth
                );


              const y =
                yForPercent(
                  value
                );


              points.push({
                x:
                  x,

                y:
                  y,

                value:
                  value
              });
            }
          );


          if (!points.length) {
            return;
          }


          const color =
            colors[
              personIndex %
              colors.length
            ];


          if (
            points.length >
            1
          ) {

            const polyline =
              document.createElementNS(
                "http://www.w3.org/2000/svg",
                "polyline"
              );


            polyline.setAttribute(
              "points",
              points
                .map(
                  point =>
                    point.x +
                    "," +
                    point.y
                )
                .join(
                  " "
                )
            );


            polyline.setAttribute(
              "fill",
              "none"
            );


            polyline.setAttribute(
              "stroke",
              color
            );


            polyline.setAttribute(
              "stroke-width",
              "3"
            );


            polyline.setAttribute(
              "stroke-linecap",
              "round"
            );


            polyline.setAttribute(
              "stroke-linejoin",
              "round"
            );


            svg.appendChild(
              polyline
            );
          }


          points.forEach(
            point => {

              const circle =
                document.createElementNS(
                  "http://www.w3.org/2000/svg",
                  "circle"
                );


              circle.setAttribute(
                "cx",
                point.x
              );


              circle.setAttribute(
                "cy",
                point.y
              );


              circle.setAttribute(
                "r",
                "4.5"
              );


              circle.setAttribute(
                "fill",
                color
              );


              svg.appendChild(
                circle
              );
            }
          );


          /*
           * Легенда.
           */

          const legendX =
            left +
            (
              personIndex %
              3
            ) *
            245;


          const legendY =
            16 +
            Math.floor(
              personIndex / 3
            ) *
            16;


          const legendDot =
            document.createElementNS(
              "http://www.w3.org/2000/svg",
              "circle"
            );


          legendDot.setAttribute(
            "cx",
            legendX
          );


          legendDot.setAttribute(
            "cy",
            legendY
          );


          legendDot.setAttribute(
            "r",
            "4"
          );


          legendDot.setAttribute(
            "fill",
            color
          );


          svg.appendChild(
            legendDot
          );


          addSvgText(
            svg,
            legendX + 9,
            legendY + 4,
            person.name,
            "#cbd6ea",
            "start",
            11
          );
        }
      );
    }


    /* ===================================
       GENERAL RANKING
       =================================== */

    function getRankingArray(
      data
    ) {

      if (
        data &&
        Array.isArray(
          data.people
        )
      ) {

        return data.people;
      }


      if (
        data &&
        Array.isArray(
          data.ranking
        )
      ) {

        return data.ranking;
      }


      return [];
    }


    function sanitizePeople(
      people
    ) {

      if (
        !Array.isArray(
          people
        )
      ) {
        return [];
      }


      return people
        .map(
          item => ({
            name:
              String(
                item.name ||
                ""
              ).trim(),

            percent:
              Number(
                item.percent
              )
          })
        )
        .filter(
          item =>
            item.name &&
            isSafePercent(
              item.percent
            )
        )
        .sort(
          (a,b) =>
            b.percent -
            a.percent
        );
    }


    function renderRanking(
      target,
      people,
      options = {}
    ) {

      target.innerHTML =
        "";


      if (
        !people.length
      ) {

        showEmpty(
          target,
          "За этот месяц статистика не найдена"
        );


        return;
      }


      people.forEach(
        (person,index) => {

          const card =
            createRankingCard(
              person,
              index,
              Boolean(
                options.clickableScale
              )
            );


          target.appendChild(
            card
          );
        }
      );
    }


    /* ===================================
       PERIOD NORMALIZATION
       =================================== */

    function normalizePeriodObject(
      item
    ) {

      if (!item) {
        return null;
      }


      const year =
        Number(
          item.year
        );


      const month =
        Number(
          item.month
        );


      if (
        !item.key ||
        !Number.isFinite(
          year
        ) ||
        !Number.isFinite(
          month
        ) ||
        month < 1 ||
        month > 12
      ) {

        return null;
      }


      return {
        key:
          String(
            item.key
          ),

        year:
          year,

        month:
          month,

        sort:
          Number(
            item.sort ||
            (
              year *
              100 +
              month
            )
          ),

        label:
          item.label ||
          (
            MONTH_NAMES[
              month - 1
            ] +
            " " +
            year
          )
      };
    }


    /* ===================================
       MODALS
       =================================== */

    function openModal(
      modal
    ) {

      modal.classList.add(
        "visible"
      );


      modal.setAttribute(
        "aria-hidden",
        "false"
      );


      document.body
        .classList
        .add(
          "modal-open"
        );
    }


    function closeModal(
      modal
    ) {

      modal.classList.remove(
        "visible"
      );


      modal.setAttribute(
        "aria-hidden",
        "true"
      );


      if (
        !document.querySelector(
          ".modal.visible"
        )
      ) {

        document.body
          .classList
          .remove(
            "modal-open"
          );
      }
    }


    archiveClose.addEventListener(
      "click",
      () => {

        closeModal(
          archiveModal
        );
      }
    );


    personClose.addEventListener(
      "click",
      () => {

        closeModal(
          personModal
        );
      }
    );


    archiveModal.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          archiveModal
        ) {

          closeModal(
            archiveModal
          );
        }
      }
    );


    personModal.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          personModal
        ) {

          closeModal(
            personModal
          );
        }
      }
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key !==
          "Escape"
        ) {
          return;
        }


        if (
          personModal
            .classList
            .contains(
              "visible"
            )
        ) {

          closeModal(
            personModal
          );

          return;
        }


        if (
          archiveModal
            .classList
            .contains(
              "visible"
            )
        ) {

          closeModal(
            archiveModal
          );
        }
      }
    );


    /* ===================================
       SVG
       =================================== */

    function getChartX(
      index,
      count,
      left,
      width
    ) {

      if (
        count <= 1
      ) {

        return (
          left +
          width / 2
        );
      }


      return (
        left +
        width *
        index /
        (
          count - 1
        )
      );
    }


    function addSvgLine(
      svg,
      x1,
      y1,
      x2,
      y2,
      stroke
    ) {

      const line =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "line"
        );


      line.setAttribute(
        "x1",
        x1
      );

      line.setAttribute(
        "y1",
        y1
      );

      line.setAttribute(
        "x2",
        x2
      );

      line.setAttribute(
        "y2",
        y2
      );

      line.setAttribute(
        "stroke",
        stroke
      );

      line.setAttribute(
        "stroke-width",
        "1"
      );


      svg.appendChild(
        line
      );
    }


    function addSvgText(
      svg,
      x,
      y,
      text,
      fill,
      anchor,
      size
    ) {

      const element =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "text"
        );


      element.setAttribute(
        "x",
        x
      );

      element.setAttribute(
        "y",
        y
      );

      element.setAttribute(
        "fill",
        fill
      );

      element.setAttribute(
        "text-anchor",
        anchor
      );

      element.setAttribute(
        "font-size",
        size
      );


      element.textContent =
        text;


      svg.appendChild(
        element
      );
    }


    /* ===================================
       UI HELPERS
       =================================== */

    function getPlaceIcon(
      index
    ) {

      if (
        index === 0
      ) {
        return "🥇";
      }


      if (
        index === 1
      ) {
        return "🥈";
      }


      if (
        index === 2
      ) {
        return "🥉";
      }


      return String(
        index + 1
      );
    }


    function showRankingLoader(
      target
    ) {

      target.innerHTML =
        '<div class="loader"></div>';
    }


    function showEmpty(
      target,
      text
    ) {

      target.innerHTML =
        `<div class="empty">${escapeHtml(text)}</div>`;
    }


    function setStatus(
      text,
      error = false
    ) {

      statusEl.textContent =
        text || "";


      statusEl
        .classList
        .toggle(
          "error",
          Boolean(error)
        );
    }


    function isSafePercent(
      value
    ) {

      const number =
        Number(
          value
        );


      return (
        Number.isFinite(
          number
        ) &&
        number >= 0 &&
        number <= 100
      );
    }


    function clampPercent(
      value
    ) {

      const number =
        Number(
          value
        );


      if (
        !Number.isFinite(
          number
        )
      ) {
        return 0;
      }


      return Math.max(
        0,
        Math.min(
          100,
          number
        )
      );
    }


    function formatPercent(
      value
    ) {

      const number =
        Number(
          value
        );


      if (
        !isSafePercent(
          number
        )
      ) {

        return "—";
      }


      return (
        number
          .toFixed(1)
          .replace(
            ".",
            ","
          )
        +
        "%"
      );
    }


    function escapeHtml(
      value
    ) {

      return String(
        value || ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }


    /* ===================================
       AUTO REFRESH — 2 SECONDS
       =================================== */

    let lastKnownPeriodKey =
      getCurrentPeriod().key;


    setInterval(
      () => {

        /*
         * Когда вкладка браузера
         * скрыта — лишние запросы
         * не делаем.
         */

        if (
          document.hidden
        ) {
          return;
        }


        /*
         * Не запускаем второй запрос,
         * пока предыдущий ещё работает.
         */

        if (
          state.currentMonthLoading
        ) {
          return;
        }


        const actualPeriod =
          getCurrentPeriod();


        /*
         * Смена месяца.
         */

        if (
          actualPeriod.key !==
          lastKnownPeriodKey
        ) {

          lastKnownPeriodKey =
            actualPeriod.key;


          state.archivePeriods =
            null;

          state.archiveSelectedYear =
            null;

          state.archiveSelectedPeriod =
            null;

          state.archiveRankingCache
            .clear();

          state.historyData =
            null;

          state.historyLoading =
            null;
        }


        loadCurrentMonth(
          true
        );

      },
      2000
    );


    /*
     * Если человек вернулся
     * во вкладку сайта —
     * сразу проверяем данные,
     * не ждём следующего интервала.
     */

    document.addEventListener(
      "visibilitychange",
      () => {

        if (
          !document.hidden
        ) {

          loadCurrentMonth(
            true
          );
        }
      }
    );


    /* ===================================
       START
       =================================== */

    loadCurrentMonth();

  </script>
